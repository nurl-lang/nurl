# bench/rust_http2_server/Cargo.toml — minimal Cargo manifest for the
# hyper-based hello-world HTTP/2 server, the Rust peer of bench/run_http2.sh.
# Its own crate, so the HTTP/1.1 peer (bench/rust_http_server) and its
# dependency tree stay exactly as bench/run_http.sh measures them.
#
# Build:
#     cargo build --release --manifest-path bench/rust_http2_server/Cargo.toml
#
# The runner script bench/run_http2.sh does this automatically.

[package]
name = "http2_server"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
hyper = { version = "1.5", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util"] }
bytes = "1"
# TLS peer: tokio-rustls, the same rustls stack axum/warp use, with ALPN
# "h2" so clients negotiate HTTP/2 (RFC 9113 §3.3). Pinned to the ring
# crypto provider so a CI runner needs no system OpenSSL to build.
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
