# bench/tls_bench/rust — the Rust half of the TLS benchmark
# (bench/tls_bench/run_tls.sh drives it against the NURL half).
#
#   tls_server   hyper 1.x + tokio-rustls — the peer of the NURL HttpApp
#                server (bench/http_torture/server.nu), same routes and
#                bodies, one session ticket per connection like NURL
#   tls_load     the load generator: a raw tokio-rustls HTTP/1.1 client
#                that drives EITHER server with a pinned group / suite,
#                full or resumed handshakes, keep-alive or not
#   tls_prims    the crypto primitives a TLS 1.3 handshake and record
#                layer are made of, timed the same way bench.nu times
#                the NURL ones (bench/tls_bench/prims.nu)
#   tls_client   reqwest — the peer of NURL's packages/http-client, for
#                the client-side rows
#
# Crypto provider: aws-lc-rs, rustls's default. That is the state of the
# art a NURL TLS stack is measured against — assembly AES-GCM, AVX2
# X25519, the X25519MLKEM768 hybrid group — not a portable stand-in: the
# point of this benchmark is the absolute gap to what production Rust
# deploys. (bench/rust_pq is the portable-vs-portable comparison.)
#
# Build:
#     cargo build --release --manifest-path bench/tls_bench/rust/Cargo.toml

[package]
name = "tls_bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
aws-lc-rs = "1.13"
rustls = { version = "0.23.27", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time"] }
hyper = { version = "1.5", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
