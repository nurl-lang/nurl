name: wasm-bench

# Runs the WebAssembly benchmark — the same corpus bench.yml measures, one
# axis rotated: every benchmark compiled to a native binary AND a
# wasm32-wasi module in NURL, C and Rust, each module then run on the
# reference wasmtime (Cranelift JIT) and on packages/wasmtime (`wt`, the
# interpreter written in pure NURL) — on a fixed `ubuntu-latest` runner,
# and commits the refreshed report back to the repository:
#
#   bench/results/wasm-latest.json   machine-readable
#   bench/WASMRESULTS.md             the same run rendered for humans
#
# Both are fully generated by bench/wasmbench.sh, which overwrites them
# every run — the same contract bench/RESULTS.md has with bench.sh.
#
# Deliberately MANUAL, like http-bench.yml and pq-bench.yml: no push/tag
# trigger. The interpreter column alone is tens of minutes, so re-measuring
# on every merge would cost hours of runner time to restate numbers that
# move only when the compiler, the runtime or the packages do. Run it after
# a change to any of those — or after a zig/wasmtime bump, since the report
# records both versions. The commit-to-main mechanism is identical to
# bench.yml's so all four benchmark workflows behave the same once
# triggered.

on:
  workflow_dispatch:
    inputs:
      quick:
        description: 'Smoke test (1 rep/cell) — verifies the harness, does NOT commit'
        type: boolean
        default: false
      wt_all_langs:
        description: 'Also run C/Rust on the NURL interpreter (roughly triples the run)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # for committing the refreshed report to main

jobs:
  wasm-bench:
    name: 15 benchmarks × NURL / C / Rust × native / JIT / interpreter
    runs-on: ubuntu-latest
    # The interpreter is ~500x slower than native — that is the
    # measurement, not a defect of the harness — and wasmbench.sh keeps it
    # finite per cell (--budget-ms, --timeout) rather than per suite. On a
    # shared 2-vCPU VM the whole matrix needs hours, and --wt-all-langs
    # roughly triples the interpreter's share of it.
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the results commit can be pushed onto the
          # upstream tip without a rejected non-fast-forward.
          fetch-depth: 0

      - name: Install build deps (clang + FFI libs)
        # Same FFI-lib block as bench.yml so the bootstrap path is
        # identical to a regular build.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Install Rust (stable, minimal profile) + the wasm target
        # rustc ships wasm32-wasip1 as a rustup component, not by default;
        # wasmbench.sh refuses to start without it rather than leaving a
        # hole in the table.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add wasm32-wasip1

      - name: Install zig (the C → wasm compiler)
        # zig carries its own wasi-libc and wasm-ld, so no wasi-sdk is
        # needed — for the C column here and inside wasmbuilder alike.
        # Same version the release workflow bundles and wasmbuilder
        # provisions, so the report's `zig` row names the shipped backend.
        #
        # On PATH rather than in $NURL_ZIG on purpose: wasmbench.sh and
        # wasmbuilder both fall through to a PATH zig, while nurl.sh keeps
        # using system clang to build `wt` and `wasmbuilder` — and `wt`'s
        # own compiler is part of what the interpreter column measures, so
        # it has to match how the repo builds it everywhere else.
        run: |
          ZIG_VER=0.16.0
          curl -fsSL "https://ziglang.org/download/${ZIG_VER}/zig-x86_64-linux-${ZIG_VER}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig-toolchain"
          tar -xf /tmp/zig.tar.xz -C "$HOME/zig-toolchain" --strip-components=1
          echo "$HOME/zig-toolchain" >> "$GITHUB_PATH"
          "$HOME/zig-toolchain/zig" version

      - name: Install wasmtime (the reference runtime)
        # Deliberately not vendored anywhere in this repo: its whole job in
        # this benchmark is to be the outside opinion on what the wasm
        # target costs, with compiler quality controlled for.
        #
        # $WASMTIME is pinned to the installed path rather than left to
        # wasmbench.sh's PATH lookup. On a developer box `wasmtime` on PATH
        # is usually $NURL_HOME/bin/wasmtime — the PURE-NURL interpreter
        # installed by the toolchain — and the lookup would then fill the
        # "reference JIT" column with the very runtime the column exists to
        # compare against. The runner has no such install today; pinning
        # keeps that true if it ever gains one.
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          echo "WASMTIME=$HOME/.wasmtime/bin/wasmtime" >> "$GITHUB_ENV"

      - name: Record toolchain versions
        run: |
          clang --version | head -1
          rustc --version
          zig version
          wasmtime --version

      - name: Build nurlc (bootstrap fixed point + runtime.o)
        run: ./build.sh --no-tests

      - name: Run the wasm benchmark
        env:
          # Read by wasmbench.sh and written into the report so the table
          # says where its numbers came from. The CPU / cores / memory are
          # measured by the script itself, so only the label is set here.
          BENCH_HOST_LABEL: GitHub Actions ubuntu-latest runner
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # A row whose implementations print different lines makes
        # wasmbench.sh exit non-zero after writing the report: the timings
        # would be comparing different computations. The commit step below
        # is not `if: always()`, so such a run publishes nothing.
        run: |
          args=()
          if [[ '${{ inputs.quick }}' == 'true' ]]; then
            args+=(--quick)
          fi
          if [[ '${{ inputs.wt_all_langs }}' == 'true' ]]; then
            args+=(--wt-all-langs)
          fi
          echo "running: ./bench/wasmbench.sh ${args[*]}"
          ./bench/wasmbench.sh "${args[@]}"

      - name: Publish the report to the run summary
        if: always()
        run: |
          if [[ -f bench/WASMRESULTS.md ]]; then
            cat bench/WASMRESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '`bench/WASMRESULTS.md` was not produced — the run failed before the report stage.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-bench-results-${{ github.run_id }}
          path: |
            bench/results/wasm-latest.json
            bench/WASMRESULTS.md
          retention-days: 90

      - name: Commit the refreshed report to main
        # Skipped for a --quick run: 1 repetition per cell is a harness
        # smoke test, not a measurement, and committing it would replace
        # the published table with numbers nobody should quote. The
        # artifact and the run summary above still carry it.
        if: ${{ inputs.quick != true }}
        # Same mechanism as bench.yml's results commit: push straight to
        # main (a manual re-measure keeps the published table current),
        # bypassing the PR ruleset with BENCH_PUSH_TOKEN when present.
        env:
          GH_TOKEN: ${{ secrets.BENCH_PUSH_TOKEN || github.token }}
        run: |
          if git diff --quiet -- bench/results/wasm-latest.json bench/WASMRESULTS.md; then
            echo "report unchanged — nothing to commit."
            exit 0
          fi

          today="$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # actions/checkout stores an Authorization header for GITHUB_TOKEN
          # in the local git config, and that header WINS over credentials
          # embedded in the remote URL. Drop it so the URL's token (the
          # bypass PAT, when set) is the one that authenticates.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          git fetch origin main
          git stash push -- bench/results/wasm-latest.json bench/WASMRESULTS.md
          git checkout -B main origin/main
          git checkout stash@{0} -- bench/results/wasm-latest.json bench/WASMRESULTS.md
          git stash drop

          # [skip ci] because this commit is two data files and nothing
          # else — no need to spin up the full CI matrix against unchanged
          # code. The report was produced by a run that passed the
          # correctness gate before committing.
          git add bench/results/wasm-latest.json bench/WASMRESULTS.md
          git commit -m "bench: refresh WASMRESULTS ($today) [skip ci]"

          # Keep the measured files OUTSIDE the worktree for the replay
          # below. Stashing them cannot work there: by that point they are
          # committed, so `git stash push -- <paths>` finds nothing to save
          # and the replay would silently drop the run's results.
          keep="$(mktemp -d)"
          cp bench/results/wasm-latest.json "$keep/wasm-latest.json"
          cp bench/WASMRESULTS.md "$keep/WASMRESULTS.md"

          # The suite takes hours; another merge can land in that window.
          # Replay the two files onto the new tip rather than failing — the
          # report is a pure overwrite, so there is nothing to reconcile.
          for attempt in 1 2 3; do
            git push origin main && exit 0
            echo "push refused (attempt $attempt) — replaying onto the new tip"
            git fetch origin main
            git reset --hard origin/main
            cp "$keep/wasm-latest.json" bench/results/wasm-latest.json
            cp "$keep/WASMRESULTS.md" bench/WASMRESULTS.md
            if git diff --quiet -- bench/results/wasm-latest.json bench/WASMRESULTS.md; then
              echo "the new tip already carries this report — nothing to do."
              exit 0
            fi
            git commit -am "bench: refresh WASMRESULTS ($today) [skip ci]"
          done
          echo "::error::could not push refreshed report after 3 attempts."
          echo "::error::If this is GH013, BENCH_PUSH_TOKEN's account is not in the"
          echo "::error::'Protect main' ruleset bypass list."
          exit 1
