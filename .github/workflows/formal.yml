name: formal

# The mechanized proof of the memory model (formal/). Builds every Lean
# module and checks the proof is complete: no `sorry`, no new axioms.
# Nothing in nurlc is compiled from formal/, so this runs only when it
# changes.

on:
  # main only: a push to a PR branch is already covered by its pull_request
  # run, and the merge queue's temporary gh-readonly-queue/* branches are
  # tested by ci.yml. Without the filter every such push ran the proof a
  # second time. formal/rules/ holds RULES.md's change rows, one file per
  # change (Agora #299): text, no Lean, so a row alone builds nothing.
  push:
    branches: [main]
    paths: ['formal/**', '!formal/rules/**', '.github/workflows/formal.yml']
  pull_request:
    paths: ['formal/**', '!formal/rules/**', '.github/workflows/formal.yml']
  workflow_dispatch:

jobs:
  proof:
    name: A1, A2 and A3 proofs build, sorry-free
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (the release formal/lean-toolchain names, pinned by content)
        # The proof is only as trusted as the Lean that checks it, so the
        # toolchain is the release archive itself, checked against the digest
        # its publisher lists (GitHub's asset digest), not whatever an
        # installer script on a branch serves that day (Agora #535). No elan:
        # the archive's bin/ has lean and lake. Bumping lean-toolchain means
        # bumping LEAN_VERSION and LEAN_SHA256 here, and this step says so.
        env:
          LEAN_VERSION: "4.35.0"
          LEAN_SHA256: "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d"
        run: |
          want="leanprover/lean4:v${LEAN_VERSION}"
          have="$(tr -d '[:space:]' < formal/lean-toolchain)"
          if [ "$have" != "$want" ]; then
            echo "formal/lean-toolchain says $have; this step pins $want: update LEAN_VERSION and LEAN_SHA256" >&2
            exit 1
          fi
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/lean.tar.zst \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          echo "${LEAN_SHA256}  /tmp/lean.tar.zst" | sha256sum -c -
          mkdir -p "$HOME/lean"
          tar --zstd -xf /tmp/lean.tar.zst -C "$HOME/lean"
          echo "$HOME/lean/lean-${LEAN_VERSION}-linux/bin" >> "$GITHUB_PATH"
      - name: Build and check
        working-directory: formal
        run: ./check.sh
