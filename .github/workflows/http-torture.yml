name: http-torture

# Runs the open-loop HTTP torture harness — NURL vs Rust hyper/rustls over
# 1 KB / 16 KB / 1 MB bodies: sustainable capacity, tail under load, CPU
# per request, connection churn, slowloris, keep-alive scale, TLS 1.3
# resumption and a soak — on a fixed `ubuntu-latest` runner and commits
# the refreshed report back to the repository:
#
#   bench/http_torture/TORTURE_RESULTS.md   fully generated by
#                                           bench/http_torture/run_torture.sh;
#                                           overwritten every run, the same
#                                           contract bench/HTTP_RESULTS.md
#                                           has with run_http.sh.
#
# Deliberately MANUAL, like http-bench.yml and pq-bench.yml: no push/tag
# trigger. A full run is ~80 minutes and its cells are load numbers on a
# shared VM — opt in when you want a fresh runner-measured table.
#
# Two things differ from the workstation runs the table was born on:
#   * ubuntu-latest has 4 vCPUs. The harness derives its core split from
#     nproc (servers 0-1, generator 2-3), so the absolute numbers are a
#     fraction of a 12-thread box's; the table is a comparison between
#     the two servers on the same cores, and its header says which host.
#   * Co-tenant jitter. Read pairs of cells (NURL vs Rust in the same
#     run), not single ones, and expect run-to-run movement of one
#     bisection step (8k at 1 KB, 4k at 16 KB, 250 at 1 MB).

on:
  workflow_dispatch:
    inputs:
      soak_sec:
        description: 'Seconds per soak (600 = the real thing; 60 for a quick re-measure)'
        required: false
        default: '600'
      dims:
        description: 'Dimensions to run (space-separated subset of: capacity loadlevels cpu churn slowloris keepalive tls_resume soak)'
        required: false
        default: 'capacity loadlevels cpu churn slowloris keepalive tls_resume soak'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # for committing the refreshed report to main

jobs:
  http-torture:
    name: NURL vs Rust hyper/rustls — open-loop torture
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the results commit can be pushed onto the
          # upstream tip without a rejected non-fast-forward.
          fetch-depth: 0

      - name: Install build deps (clang + FFI libs + openssl + python3)
        # Same FFI-lib block as http-bench.yml so the bootstrap path is
        # identical to a regular build. openssl makes the self-signed
        # cert for the TLS cells and probes resumption; python3 drives
        # the oha JSON parsing and the slowloris / resumption helpers.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            pkg-config \
            openssl \
            python3 \
            curl \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Install Rust (stable, minimal profile)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install oha (load generator)
        # Pinned to the version the report header records.
        run: cargo install oha --version 1.8.0 --locked

      - name: Record toolchain versions
        run: |
          clang --version | head -1
          rustc --version
          python3 --version
          "$HOME/.cargo/bin/oha" --version
          nproc

      - name: Build nurlc (bootstrap fixed point + runtime.o)
        run: ./build.sh --no-tests

      - name: Run the torture harness
        env:
          MODE: full
          SOAK_SEC: ${{ github.event.inputs.soak_sec }}
          DIMS: ${{ github.event.inputs.dims }}
          # Read by run_torture.sh and written into the report header so
          # the table says where its numbers came from.
          BENCH_HOST_LABEL: GitHub Actions ubuntu-latest runner
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bench/http_torture/run_torture.sh > /dev/null

      - name: Publish the report to the run summary
        if: always()
        run: |
          if [[ -f bench/http_torture/TORTURE_RESULTS.md ]]; then
            cat bench/http_torture/TORTURE_RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '`bench/http_torture/TORTURE_RESULTS.md` was not produced — the run failed before the report stage.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-torture-results-${{ github.run_id }}
          path: bench/http_torture/TORTURE_RESULTS.md
          retention-days: 90

      - name: Commit the refreshed report to main
        # Same mechanism as http-bench.yml's results commit: push straight
        # to main, bypassing the PR ruleset with BENCH_PUSH_TOKEN when
        # present.
        env:
          GH_TOKEN: ${{ secrets.BENCH_PUSH_TOKEN || github.token }}
        run: |
          if git diff --quiet -- bench/http_torture/TORTURE_RESULTS.md; then
            echo "report unchanged — nothing to commit."
            exit 0
          fi

          today="$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # actions/checkout stores an Authorization header for GITHUB_TOKEN
          # in the local git config, and that header WINS over credentials
          # embedded in the remote URL. Drop it so the URL's token (the
          # bypass PAT, when set) is the one that authenticates.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          git fetch origin main
          git stash push -- bench/http_torture/TORTURE_RESULTS.md
          git checkout -B main origin/main
          git checkout stash@{0} -- bench/http_torture/TORTURE_RESULTS.md
          git stash drop

          # [skip ci] because this commit is one data file and nothing
          # else. The report was produced by a completed harness run.
          git add bench/http_torture/TORTURE_RESULTS.md
          git commit -m "bench: refresh TORTURE_RESULTS ($today) [skip ci]"

          keep="$(mktemp -d)"
          cp bench/http_torture/TORTURE_RESULTS.md "$keep/TORTURE_RESULTS.md"

          # Another merge can land while the harness runs; replay the
          # file onto the new tip rather than failing — the report is a
          # pure overwrite, so there is nothing to reconcile.
          for attempt in 1 2 3; do
            git push origin main && exit 0
            echo "push refused (attempt $attempt) — replaying onto the new tip"
            git fetch origin main
            git reset --hard origin/main
            cp "$keep/TORTURE_RESULTS.md" bench/http_torture/TORTURE_RESULTS.md
            if git diff --quiet -- bench/http_torture/TORTURE_RESULTS.md; then
              echo "the new tip already carries this report — nothing to do."
              exit 0
            fi
            git commit -am "bench: refresh TORTURE_RESULTS ($today) [skip ci]"
          done
          echo "::error::could not push refreshed report after 3 attempts."
          echo "::error::If this is GH013, BENCH_PUSH_TOKEN's account is not in the"
          echo "::error::'Protect main' ruleset bypass list."
          exit 1
