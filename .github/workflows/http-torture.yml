name: http-torture

# Runs the open-loop HTTP torture harness — NURL vs Rust hyper/rustls over
# 1 KB / 16 KB / 1 MB bodies: sustainable capacity, tail under load, CPU
# per request, connection churn, slowloris, keep-alive scale, TLS 1.3
# resumption and a soak — on a fixed `ubuntu-latest` runner and publishes
# the refreshed report to the bench-data branch (tools/bench_data.sh):
#
#   bench/http_torture/TORTURE_RESULTS.md   fully generated by
#                                           bench/http_torture/run_torture.sh;
#                                           overwritten every run, the same
#                                           contract bench/HTTP_RESULTS.md
#                                           has with run_http.sh.
#
# Deliberately MANUAL, like http-bench.yml and pq-bench.yml: no push/tag
# trigger. A full run stays under 60 minutes from checkout to the published
# report (its "Wall time per dimension" table says where it went:
# two 600 s soaks are 20 of them), and its cells are load numbers on a
# shared VM — opt in when you want a fresh runner-measured table. Only a
# full run on main publishes its report; a run on a branch, or a smoke run,
# leaves it in the run summary and the artifact.
#
# Two things differ from the workstation runs the table was born on:
#   * ubuntu-latest has 4 vCPUs. The harness derives its core split from
#     nproc (servers 0-1, generator 2-3), so the absolute numbers are a
#     fraction of a 12-thread box's; the table is a comparison between
#     the two servers on the same cores, and its header says which host.
#   * Co-tenant jitter. Read pairs of cells (NURL vs Rust in the same
#     run), not single ones, and expect run-to-run movement of one
#     bisection step (8k at 1 KB, 4k at 16 KB, 250 at 1 MB).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = the real run; smoke = short cells that exercise every column'
        required: false
        default: 'full'
        type: choice
        options: [full, smoke]
      soak_sec:
        description: 'Seconds per soak (600 = the real thing; 60 for a quick re-measure; empty = the mode default)'
        required: false
        default: '600'
      dims:
        description: 'Dimensions to run (space-separated subset of: capacity loadlevels churn slowloris keepalive tls_resume soak; cpu = loadlevels, for one release)'
        required: false
        default: 'capacity loadlevels churn slowloris keepalive tls_resume soak'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # to publish the report to the bench-data branch

jobs:
  http-torture:
    name: NURL vs Rust hyper/rustls — open-loop torture
    runs-on: ubuntu-latest
    # The budget is 60 minutes; the margin is for a cold cache.
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: the report header's NURL version is
          # `git describe` (tools/version.sh).
          fetch-depth: 0

      - name: Install build deps (clang + FFI libs + openssl + python3)
        # Same FFI-lib block as http-bench.yml so the bootstrap path is
        # identical to a regular build. openssl makes the self-signed
        # cert for the TLS cells and probes resumption; python3 drives
        # the oha JSON parsing and the slowloris / resumption helpers.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            pkg-config \
            openssl \
            python3 \
            curl \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Install Rust (stable, minimal profile)
        # rustup-init pinned by version and checksum, from the archive URL —
        # `curl https://sh.rustup.rs | sh` pipes whatever that endpoint serves
        # into a shell. The TOOLCHAIN stays `stable` on purpose: the point of
        # this column is what current stable Rust does, and the version it
        # resolved to is recorded in the run's toolchain-versions step.
        run: |
          RUSTUP_VER=1.29.1
          RUSTUP_SHA=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VER}/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # oha is built from source by `cargo install`, minutes of every run
      # for the same pinned version: the binary is cached by that version.
      - name: Restore oha
        id: oha-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/oha
          key: oha-1.8.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install oha (load generator)
        # Pinned to the version the report header records.
        if: steps.oha-cache.outputs.cache-hit != 'true'
        run: cargo install oha --version 1.8.0 --locked

      # The Rust peer's dependencies are pinned by its Cargo.lock; cargo
      # rebuilds whatever a newer stable rustc or a changed source needs.
      - name: Restore the Rust peer's build
        uses: actions/cache@v4
        with:
          path: bench/http_torture/rust/target
          key: http-torture-rust-${{ runner.os }}-${{ hashFiles('bench/http_torture/rust/Cargo.lock', 'bench/http_torture/rust/Cargo.toml', 'bench/http_torture/rust/src/**') }}
          restore-keys: http-torture-rust-${{ runner.os }}-

      - name: Record toolchain versions
        run: |
          clang --version | head -1
          rustc --version
          python3 --version
          "$HOME/.cargo/bin/oha" --version
          nproc

      - name: Build nurlc (bootstrap fixed point + runtime.o)
        run: ./build.sh --no-tests

      - name: Run the torture harness
        env:
          MODE: ${{ github.event.inputs.mode || 'full' }}
          SOAK_SEC: ${{ github.event.inputs.soak_sec }}
          DIMS: ${{ github.event.inputs.dims }}
          # Read by run_torture.sh and written into the report header so
          # the table says where its numbers came from.
          BENCH_HOST_LABEL: GitHub Actions ubuntu-latest runner
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bench/http_torture/run_torture.sh > /dev/null

      - name: Publish the report to the run summary
        if: always()
        run: |
          if [[ -f bench/http_torture/TORTURE_RESULTS.md ]]; then
            cat bench/http_torture/TORTURE_RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '`bench/http_torture/TORTURE_RESULTS.md` was not produced — the run failed before the report stage.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-torture-results-${{ github.run_id }}
          path: bench/http_torture/TORTURE_RESULTS.md
          retention-days: 90

      - name: Publish the report to the bench-data branch
        # Measured numbers live on the bench-data branch, not on main
        # (tools/bench_data.sh, Agora #290): every push to main outside the
        # merge queue made the queue rebuild and re-run each group in flight.
        # Only a run of main's code publishes; a run of a branch leaves its
        # report in the run summary and the artifact.
        if: github.ref == 'refs/heads/main' && (github.event.inputs.mode || 'full') == 'full'
        run: |
          tools/bench_data.sh publish "bench: refresh TORTURE_RESULTS ($(date -u +%Y-%m-%d))" bench/http_torture/TORTURE_RESULTS.md
