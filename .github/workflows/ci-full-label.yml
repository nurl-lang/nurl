name: ci-full-label

# Adding `ci:full` to an open PR starts ci.yml's full run on it at once
# (Agora #324). Before this, `full` read the labels of the push or open
# that started a run, so a label added later did nothing until the next
# push. A new PR's first run never had the full set, because the label
# cannot exist before the PR does: github#1465 reached the merge queue
# unsanitized that way.
#
# ci.yml itself does not listen for `labeled`. A run of it for any other
# label would list every one of its jobs as a skipped check run, and
# GitHub counts a skipped check as passed. On github#1478 one such run took
# the PR from `blocked` to `unstable` while its build was still running.
# Here a label other than ci:full skips this one job, whose name no
# required check carries.
#
# For ci:full, the job dispatches ci.yml on the PR's head with `pr` set.
# A run dispatched that way joins the PR's own concurrency group
# (refs/pull/N/merge), so the full run replaces the fast one in progress,
# and the PR's next push, which carries the label, replaces it in turn.
# Its check runs are on the PR's head commit, so they are the PR's checks.
on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  start:
    name: ci:full starts the full run
    # A fork's PR has a read-only token and a head branch this repository
    # does not have: there, push after labelling.
    if: github.event.label.name == 'ci:full' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: dispatch ci.yml on the PR's head, as the PR's run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
        # A branch from before ci.yml took `pr` refuses the input. It still
        # gets the full run, beside the fast one instead of in its place.
        run: |
          gh workflow run ci.yml --repo "$REPO" --ref "$HEAD_REF" -f pr="$PR" ||
            gh workflow run ci.yml --repo "$REPO" --ref "$HEAD_REF"
