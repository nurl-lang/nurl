name: http-bench

# Runs the HTTP + HTTPS peer-comparison benchmark — NURL vs Rust hyper vs
# Node, plaintext and over TLS — on a fixed `ubuntu-latest` runner and
# commits the refreshed report back to the repository:
#
#   bench/HTTP_RESULTS.md   fully generated by bench/run_http.sh (the
#                           environment block, the plaintext table and the
#                           TLS table). The script overwrites it every run,
#                           the same contract bench/RESULTS.md has with
#                           bench/bench.sh.
#   bench/HTTP_DB_RESULTS.md  fully generated by `bench/run_http.sh --suite
#                           db`: NURL vs Rust on the database endpoints
#                           (TechEmpower's five, HttpArena's async-db),
#                           against a throwaway PostgreSQL the script starts
#                           from the runner image's server binaries.
#
# Deliberately MANUAL for now: unlike bench.yml, there is no push/tag
# trigger. HTTP load numbers on a shared CI VM are far noisier than the
# single-process wall-clock suite (scheduling, co-tenant network jitter),
# so this is opt-in — you run it when you want a fresh runner-measured
# table, not on every merge. The commit-to-main mechanism is identical to
# bench.yml so the two behave the same once triggered.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # for committing the refreshed report to main

jobs:
  http-bench:
    name: NURL / Rust hyper / Node — HTTP + HTTPS, and the database suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the results commit can be pushed onto the
          # upstream tip without a rejected non-fast-forward.
          fetch-depth: 0

      - name: Install build deps (clang + FFI libs + openssl)
        # Same FFI-lib block as bench.yml so the bootstrap path is
        # identical to a regular build. openssl generates the self-signed
        # TLS cert the HTTPS servers present. Node ships in the image.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            pkg-config \
            openssl \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Install Rust (stable, minimal profile)
        # The Rust peer's TLS path uses tokio-rustls, whose current
        # releases need a recent stable toolchain — rustup stable is well
        # ahead of that floor.
        # rustup-init pinned by version and checksum, from the archive URL —
        # `curl https://sh.rustup.rs | sh` pipes whatever that endpoint serves
        # into a shell. The TOOLCHAIN stays `stable` on purpose: the point of
        # this column is what current stable Rust does, and the version it
        # resolved to is recorded in the run's toolchain-versions step.
        run: |
          RUSTUP_VER=1.29.1
          RUSTUP_SHA=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VER}/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install oha (load generator)
        # Pinned to the version the report header records. --locked keeps
        # its dependency tree reproducible.
        run: cargo install oha --version 1.8.0 --locked

      - name: Record toolchain versions
        run: |
          clang --version | head -1
          rustc --version
          node --version
          "$HOME/.cargo/bin/oha" --version

      - name: Build nurlc (bootstrap fixed point + runtime.o)
        run: ./build.sh --no-tests

      - name: Run the HTTP + HTTPS benchmark
        env:
          # Read by run_http.sh and written into the report so the table
          # says where its numbers came from. The CPU / cores / memory are
          # measured by the script itself, so only the label is set here.
          BENCH_HOST_LABEL: GitHub Actions ubuntu-latest runner
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./bench/run_http.sh

      - name: PostgreSQL server binaries for the database suite
        # The runner image ships PostgreSQL with its service off; the suite
        # starts a throwaway cluster of its own from those binaries. Should
        # an image lack them, install them — and stop the cluster the
        # package starts, so it does not share the machine.
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends postgresql
            sudo systemctl stop postgresql || true
          fi
          ls /usr/lib/postgresql/*/bin/initdb

      - name: Run the database benchmark
        env:
          BENCH_HOST_LABEL: GitHub Actions ubuntu-latest runner
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./bench/run_http.sh --suite db

      - name: Publish the reports to the run summary
        if: always()
        run: |
          for f in bench/HTTP_RESULTS.md bench/HTTP_DB_RESULTS.md; do
            if [[ -f "$f" ]]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "\`$f\` was not produced — the run failed before the report stage." \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload the report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-bench-results-${{ github.run_id }}
          path: |
            bench/HTTP_RESULTS.md
            bench/HTTP_DB_RESULTS.md
          retention-days: 90

      - name: Commit the refreshed report to main
        # Same mechanism as bench.yml's results commit: push straight to
        # main (a manual re-measure keeps the published table current),
        # bypassing the PR ruleset with BENCH_PUSH_TOKEN when present.
        env:
          GH_TOKEN: ${{ secrets.BENCH_PUSH_TOKEN || github.token }}
        run: |
          reports="bench/HTTP_RESULTS.md bench/HTTP_DB_RESULTS.md"
          # --porcelain: a report a first run creates counts as changed too.
          if [[ -z "$(git status --porcelain -- $reports)" ]]; then
            echo "reports unchanged — nothing to commit."
            exit 0
          fi

          today="$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # actions/checkout stores an Authorization header for GITHUB_TOKEN
          # in the local git config, and that header WINS over credentials
          # embedded in the remote URL. Drop it so the URL's token (the
          # bypass PAT, when set) is the one that authenticates.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          keep="$(mktemp -d)"
          for f in $reports; do [[ -f "$f" ]] && cp "$f" "$keep/"; done
          git fetch origin main
          git checkout -f -B main origin/main
          for f in $reports; do [[ -f "$keep/$(basename "$f")" ]] && cp "$keep/$(basename "$f")" "$f"; done

          # [skip ci] because this commit is data files and nothing
          # else — no need to spin up the full CI matrix against unchanged
          # code. The reports were produced by a completed benchmark run.
          git add -- $reports 2>/dev/null || true
          git commit -m "bench: refresh HTTP_RESULTS ($today) [skip ci]"

          # Another merge can land while the benchmark runs; replay the
          # files onto the new tip rather than failing — the reports are a
          # pure overwrite, so there is nothing to reconcile.
          for attempt in 1 2 3; do
            git push origin main && exit 0
            echo "push refused (attempt $attempt) — replaying onto the new tip"
            git fetch origin main
            git reset --hard origin/main
            for f in $reports; do [[ -f "$keep/$(basename "$f")" ]] && cp "$keep/$(basename "$f")" "$f"; done
            if [[ -z "$(git status --porcelain -- $reports)" ]]; then
              echo "the new tip already carries these reports — nothing to do."
              exit 0
            fi
            git add -- $reports 2>/dev/null || true
            git commit -m "bench: refresh HTTP_RESULTS ($today) [skip ci]"
          done
          echo "::error::could not push refreshed report after 3 attempts."
          echo "::error::If this is GH013, BENCH_PUSH_TOKEN's account is not in the"
          echo "::error::'Protect main' ruleset bypass list."
          exit 1
