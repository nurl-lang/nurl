name: http-bench

# Runs the HTTP + HTTPS peer-comparison benchmark — NURL vs Rust hyper vs
# Node, plaintext and over TLS — on a fixed `ubuntu-latest` runner and
# commits the refreshed report back to the repository:
#
#   bench/HTTP_RESULTS.md   fully generated by bench/run_http.sh (the
#                           environment block, the plaintext table and the
#                           TLS table). The script overwrites it every run,
#                           the same contract bench/RESULTS.md has with
#                           bench/bench.sh.
#
# Deliberately MANUAL for now: unlike bench.yml, there is no push/tag
# trigger. HTTP load numbers on a shared CI VM are far noisier than the
# single-process wall-clock suite (scheduling, co-tenant network jitter),
# so this is opt-in — you run it when you want a fresh runner-measured
# table, not on every merge. The commit-to-main mechanism is identical to
# bench.yml so the two behave the same once triggered.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # for committing the refreshed report to main

jobs:
  http-bench:
    name: NURL / Rust hyper / Node — HTTP + HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the results commit can be pushed onto the
          # upstream tip without a rejected non-fast-forward.
          fetch-depth: 0

      - name: Install build deps (clang + FFI libs + openssl)
        # Same FFI-lib block as bench.yml so the bootstrap path is
        # identical to a regular build. openssl generates the self-signed
        # TLS cert the HTTPS servers present. Node ships in the image.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            pkg-config \
            openssl \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Install Rust (stable, minimal profile)
        # The Rust peer's TLS path uses tokio-rustls, whose current
        # releases need a recent stable toolchain — rustup stable is well
        # ahead of that floor.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install oha (load generator)
        # Pinned to the version the report header records. --locked keeps
        # its dependency tree reproducible.
        run: cargo install oha --version 1.8.0 --locked

      - name: Record toolchain versions
        run: |
          clang --version | head -1
          rustc --version
          node --version
          "$HOME/.cargo/bin/oha" --version

      - name: Build nurlc (bootstrap fixed point + runtime.o)
        run: ./build.sh --no-tests

      - name: Run the HTTP + HTTPS benchmark
        env:
          # Read by run_http.sh and written into the report so the table
          # says where its numbers came from. The CPU / cores / memory are
          # measured by the script itself, so only the label is set here.
          BENCH_HOST_LABEL: GitHub Actions ubuntu-latest runner
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./bench/run_http.sh

      - name: Publish the report to the run summary
        if: always()
        run: |
          if [[ -f bench/HTTP_RESULTS.md ]]; then
            cat bench/HTTP_RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '`bench/HTTP_RESULTS.md` was not produced — the run failed before the report stage.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-bench-results-${{ github.run_id }}
          path: bench/HTTP_RESULTS.md
          retention-days: 90

      - name: Commit the refreshed report to main
        # Same mechanism as bench.yml's results commit: push straight to
        # main (a manual re-measure keeps the published table current),
        # bypassing the PR ruleset with BENCH_PUSH_TOKEN when present.
        env:
          GH_TOKEN: ${{ secrets.BENCH_PUSH_TOKEN || github.token }}
        run: |
          if git diff --quiet -- bench/HTTP_RESULTS.md; then
            echo "report unchanged — nothing to commit."
            exit 0
          fi

          today="$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # actions/checkout stores an Authorization header for GITHUB_TOKEN
          # in the local git config, and that header WINS over credentials
          # embedded in the remote URL. Drop it so the URL's token (the
          # bypass PAT, when set) is the one that authenticates.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          git fetch origin main
          git stash push -- bench/HTTP_RESULTS.md
          git checkout -B main origin/main
          git checkout stash@{0} -- bench/HTTP_RESULTS.md
          git stash drop

          # [skip ci] because this commit is one data file and nothing
          # else — no need to spin up the full CI matrix against unchanged
          # code. The report was produced by a completed benchmark run.
          git add bench/HTTP_RESULTS.md
          git commit -m "bench: refresh HTTP_RESULTS ($today) [skip ci]"

          keep="$(mktemp -d)"
          cp bench/HTTP_RESULTS.md "$keep/HTTP_RESULTS.md"

          # Another merge can land while the benchmark runs; replay the
          # file onto the new tip rather than failing — the report is a
          # pure overwrite, so there is nothing to reconcile.
          for attempt in 1 2 3; do
            git push origin main && exit 0
            echo "push refused (attempt $attempt) — replaying onto the new tip"
            git fetch origin main
            git reset --hard origin/main
            cp "$keep/HTTP_RESULTS.md" bench/HTTP_RESULTS.md
            if git diff --quiet -- bench/HTTP_RESULTS.md; then
              echo "the new tip already carries this report — nothing to do."
              exit 0
            fi
            git commit -am "bench: refresh HTTP_RESULTS ($today) [skip ci]"
          done
          echo "::error::could not push refreshed report after 3 attempts."
          echo "::error::If this is GH013, BENCH_PUSH_TOKEN's account is not in the"
          echo "::error::'Protect main' ruleset bypass list."
          exit 1
