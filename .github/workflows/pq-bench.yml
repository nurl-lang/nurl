name: pq-bench

# Runs the post-quantum crypto peer-comparison benchmark — pure-NURL
# stdlib vs pure-Rust RustCrypto: ML-KEM, ML-DSA, SLH-DSA and SHAKE128
# bulk throughput — on a fixed `ubuntu-latest` runner and publishes the
# refreshed report to the bench-data branch (tools/bench_data.sh):
#
#   bench/PQ_RESULTS.md   fully generated by bench/run_pq.sh (the
#                         environment block and every table). The script
#                         overwrites it every run, the same contract
#                         bench/HTTP_RESULTS.md has with run_http.sh.
#
# Deliberately MANUAL, like http-bench.yml: no push/tag trigger.
# Single-core crypto timings on a shared CI VM are steadier than HTTP
# load numbers, but co-tenant frequency/scheduling jitter is still real
# — so this is opt-in: run it when you want a fresh runner-measured
# table, not on every merge. The commit-to-main mechanism is identical
# to http-bench.yml so the two behave the same once triggered.
#
# The measurement itself is ~25 s per repetition x 3 repetitions per
# implementation; the whole job is dominated by the nurlc bootstrap
# build, not the benchmark.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # to publish the report to the bench-data branch

jobs:
  pq-bench:
    name: NURL / Rust — ML-KEM, ML-DSA, SLH-DSA
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: the report header's NURL version is
          # `git describe` (tools/version.sh).
          fetch-depth: 0

      - name: Install build deps (clang + FFI libs)
        # Same FFI-lib block as bench.yml so the bootstrap path is
        # identical to a regular build.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Install Rust (stable, minimal profile)
        # The RustCrypto PQ crates track recent stable; rustup stable is
        # well ahead of their floor.
        # rustup-init pinned by version and checksum, from the archive URL —
        # `curl https://sh.rustup.rs | sh` pipes whatever that endpoint serves
        # into a shell. The TOOLCHAIN stays `stable` on purpose: the point of
        # this column is what current stable Rust does, and the version it
        # resolved to is recorded in the run's toolchain-versions step.
        run: |
          RUSTUP_VER=1.29.1
          RUSTUP_SHA=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VER}/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Record toolchain versions
        run: |
          clang --version | head -1
          rustc --version

      - name: Build nurlc (bootstrap fixed point + runtime.o)
        run: ./build.sh --no-tests

      - name: Run the post-quantum benchmark
        env:
          # Read by run_pq.sh and written into the report so the table
          # says where its numbers came from. The CPU / cores / memory
          # are measured by the script itself, so only the label is set.
          BENCH_HOST_LABEL: GitHub Actions ubuntu-latest runner
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./bench/run_pq.sh

      - name: Publish the report to the run summary
        if: always()
        run: |
          if [[ -f bench/PQ_RESULTS.md ]]; then
            cat bench/PQ_RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '`bench/PQ_RESULTS.md` was not produced — the run failed before the report stage.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pq-bench-results-${{ github.run_id }}
          path: bench/PQ_RESULTS.md
          retention-days: 90

      - name: Publish the report to the bench-data branch
        # Measured numbers live on the bench-data branch, not on main
        # (tools/bench_data.sh, Agora #290): every push to main outside the
        # merge queue made the queue rebuild and re-run each group in flight.
        # Only a run of main's code publishes; a run of a branch leaves its
        # report in the run summary and the artifact.
        if: github.ref == 'refs/heads/main'
        run: |
          tools/bench_data.sh publish "bench: refresh PQ_RESULTS ($(date -u +%Y-%m-%d))" bench/PQ_RESULTS.md
