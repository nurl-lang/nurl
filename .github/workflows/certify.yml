name: certify

# Memory-safety certificates of programs (AGORA-1019, docs/dev/CERTIFICATE.md):
# nurl-cert (packages/nurl-cert, NURL) certifies every program of
# tools/ncore/certify/ through nurlc --emit-core, the translation and the
# kernel (for a program in C.Elab's subset, the kernel also builds the term:
# Elab.lean, which needs C.Elab), re-verifies each bundle, and its selftest
# tampers with a bundle in each of the ways verify must catch. Runs when a
# piece of that chain changes.

on:
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - '!formal/rules/**'
      - 'packages/nurl-cert/**'
      - 'tools/ncore/**'
      - 'compiler/nurlc.nu'
      - 'stdlib/runtime_core.c'
      - 'nurl.sh'
      - 'nurl.bat'
      - 'build.bat'
      - 'docs/dev/certificate.schema.json'
      - '.github/workflows/certify.yml'
  pull_request:
    paths:
      - 'formal/**'
      - '!formal/rules/**'
      - 'packages/nurl-cert/**'
      - 'tools/ncore/**'
      - 'compiler/nurlc.nu'
      - 'stdlib/runtime_core.c'
      - 'nurl.sh'
      - 'nurl.bat'
      - 'build.bat'
      - 'docs/dev/certificate.schema.json'
      - '.github/workflows/certify.yml'
  workflow_dispatch:

jobs:
  certify:
    name: certify programs, verify the bundles, tamper selftest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      # The image ci.yml's build jobs use (containers/ci/Dockerfile): clang,
      # zstd and the FFI libraries the toolchain build needs.
      image: nurllang/ci:ubuntu24-20261109
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (the release formal/lean-toolchain names, pinned by content)
        # As formal.yml: the release archive checked against its digest; no
        # elan. Bumping lean-toolchain means bumping both workflows.
        env:
          LEAN_VERSION: "4.35.0"
          LEAN_SHA256: "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d"
        run: |
          want="leanprover/lean4:v${LEAN_VERSION}"
          have="$(tr -d '[:space:]' < formal/lean-toolchain)"
          if [ "$have" != "$want" ]; then
            echo "formal/lean-toolchain says $have; this step pins $want: update LEAN_VERSION and LEAN_SHA256" >&2
            exit 1
          fi
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/lean.tar.zst \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          echo "${LEAN_SHA256}  /tmp/lean.tar.zst" | sha256sum -c -
          mkdir -p "$HOME/lean"
          tar --zstd -xf /tmp/lean.tar.zst -C "$HOME/lean"
          # Only lake and lean go on PATH: the archive's bin/ also has its
          # own clang, which must not stand in for the toolchain's when
          # build.sh compiles the runtime.
          mkdir -p "$HOME/leanbin"
          for t in lake lean; do
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$HOME/lean/lean-${LEAN_VERSION}-linux/bin/$t" > "$HOME/leanbin/$t"
            chmod +x "$HOME/leanbin/$t"
          done
          echo "$HOME/leanbin" >> "$GITHUB_PATH"
      - name: Build the checker's modules (C.Cert, C.Cert3, C.Elab and what they import)
        working-directory: formal
        run: lake build C.Cert C.Cert3 C.Elab
      - name: Build the toolchain
        run: ./build.sh --no-tests
      - name: Build nurl-cert
        env:
          NURL_STDLIB: ${{ github.workspace }}
        run: cd packages/nurl-cert && ../../nurl.sh src/main.nu ../../build/nurl-cert
      - name: The translator - fail closed, and the same bytes as tools/ncore/tolean.py
        env:
          NURL_CERT: ${{ github.workspace }}/build/nurl-cert
        run: packages/nurl-cert/tests/translate_test.sh
      - name: Certify and verify every certify program; the tamper selftest
        env:
          NURL_CERT: ${{ github.workspace }}/build/nurl-cert
        run: packages/nurl-cert/tests/nurl-cert_test.sh
      - name: elab in Lean builds the translator's term (AGORA-1029; scalar subset)
        env:
          NURL_STDLIB: ${{ github.workspace }}
        run: tools/ncore/elab_parity.sh
      - name: Dogfood - nurl-cert's own certificate (reported, not gated)
        # Whatever coverage the translation reaches on nurl-cert itself is
        # what the bundle says; a program it does not cover yet is
        # `unsupported`, with the reason in manifest.json.
        env:
          NURL_STDLIB: ${{ github.workspace }}
          NURL_CERT: ${{ github.workspace }}/build/nurl-cert
          NURL_FORMAL: ${{ github.workspace }}/formal
        run: |
          cd packages/nurl-cert
          ../../nurl.sh --certify src/main.nu ../../build/nurl-cert-self || echo "nurl-cert's certificate: exit $? (2 unsupported, 3 refused)"
          ../../build/nurl-cert verify ../../build/nurl-cert-self.cert --binary ../../build/nurl-cert-self
      - name: Keep nurl-cert's own bundle
        if: ${{ !cancelled() && hashFiles('build/nurl-cert-self.cert/manifest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nurl-cert-certificate
          path: build/nurl-cert-self.cert
          retention-days: 30
          if-no-files-found: error

  certify-windows:
    # The same chain on Windows (AGORA-1031): nurlc's records and core IR
    # are byte for byte the same as on Linux, Lean runs natively, and a
    # bundle made here verifies. A few programs, one of each verdict: the
    # whole corpus runs on Linux above.
    name: certify on Windows (accepted, refused, threads)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM/clang
        run: ./tools/install-llvm.ps1
        shell: pwsh
      - name: Install Lean (the release formal/lean-toolchain names, pinned by content)
        # As the Linux job, the Windows archive: GitHub's digest for
        # lean-4.35.0-windows.zip. Bumping lean-toolchain means bumping it.
        shell: bash
        env:
          LEAN_VERSION: "4.35.0"
          LEAN_SHA256: "5fc033e93e1a7bc59c5ebf311103d2c9cd18d4b3eddda4ffa3414e8adb0ef79e"
        run: |
          want="leanprover/lean4:v${LEAN_VERSION}"
          have="$(tr -d '[:space:]' < formal/lean-toolchain)"
          if [ "$have" != "$want" ]; then
            echo "formal/lean-toolchain says $have; this step pins $want: update LEAN_VERSION and LEAN_SHA256" >&2
            exit 1
          fi
          curl -fsSL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/lean.zip" \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-windows.zip"
          echo "${LEAN_SHA256}  $RUNNER_TEMP/lean.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/lean.zip" -d "$RUNNER_TEMP/lean"
          echo "$(cygpath -w "$RUNNER_TEMP/lean/lean-${LEAN_VERSION}-windows/bin")" >> "$GITHUB_PATH"
      - name: Build the checker's modules
        working-directory: formal
        shell: bash
        run: lake build C.Cert C.Cert3 C.Elab
      - name: Build the toolchain
        run: call build.bat --no-tests
        shell: cmd
      - name: Build nurl-cert
        shell: cmd
        run: |
          set NURL_STDLIB=%GITHUB_WORKSPACE%\
          cd packages\nurl-cert
          call ..\..\nurl.bat src\main.nu ..\..\build\nurl-cert
      - name: Certify and verify one program of each kind
        shell: bash
        run: |
          export NURL_STDLIB="$(cygpath -m "$GITHUB_WORKSPACE")"
          root="$NURL_STDLIB"
          out="$root/build/wincert"
          mkdir -p "$out"
          fail=0
          for want in "vec_push_len 0" "use_after_move_refused 3" "thread_spawned_with_a_number_capture 0"; do
            set -- $want
            rc=0
            build/nurl-cert.exe certify "tools/ncore/certify/$1.nu" --out "$out/$1.cert" \
              --nurlc "$root/build/nurlc.exe" --formal "$root/formal" || rc=$?
            if [ "$rc" != "$2" ]; then echo "FAIL: $1: certify exit $rc, expected $2"; fail=1; continue; fi
            build/nurl-cert.exe verify "$out/$1.cert" --formal "$root/formal" > "$out/$1.verify" 2>&1 \
              || { echo "FAIL: $1: verify"; cat "$out/$1.verify"; fail=1; }
          done
          exit $fail
