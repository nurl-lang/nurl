name: tls-bench

# Runs the TLS benchmark — NURL against Rust (rustls on aws-lc-rs, hyper,
# reqwest) on every cost a TLS 1.3 HTTP stack pays: full and resumed
# handshakes per group (X25519, P-256, X25519MLKEM768) and certificate
# (ECDSA P-256, RSA-2048) with server CPU per handshake split into crypto
# and the rest, unloaded handshake latency, the record layer on small
# keep-alive requests, bulk throughput per cipher suite (and NURL with
# kTLS), the client side (packages/http-client vs reqwest) and the
# primitives underneath — on a fixed `ubuntu-latest` runner, and commits
# the refreshed report back to the repository:
#
#   bench/tls_bench/TLS_RESULTS.md   fully generated by
#                                    bench/tls_bench/run_tls.sh; overwritten
#                                    every run, the same contract
#                                    bench/PQ_RESULTS.md has with run_pq.sh.
#
# Its first table is the focus list: every headline metric as NURL's
# share of Rust's, worst first, with what the gap is made of.
#
# Deliberately MANUAL, like pq-bench.yml and http-torture.yml: no
# push/tag trigger. About ten minutes of measurement plus the nurlc
# bootstrap and the cargo build. The runner's 4 vCPUs are split one for
# the server and three for the load generator (a TLS client costs about as
# much per handshake as the server); read pairs of cells — NURL and Rust
# on the same core in the same run — not single ones.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full (the real run, ~10 min of measurement) or smoke (~3 min, checks the pipeline)'
        required: false
        default: 'full'
      dims:
        description: 'Sections to run (space-separated subset of: prims handshake latency records bulk client)'
        required: false
        default: 'prims handshake latency records bulk client'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # for committing the refreshed report to main

jobs:
  tls-bench:
    name: NURL vs Rust — TLS handshakes, records, bulk, client
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the results commit can be pushed onto the
          # upstream tip without a rejected non-fast-forward.
          fetch-depth: 0

      - name: Install build deps (clang + FFI libs + openssl + cmake)
        # Same FFI-lib block as http-torture.yml so the bootstrap path is
        # identical to a regular build. cmake builds aws-lc-rs; openssl
        # makes the test certificates; python3 writes the report.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            pkg-config \
            openssl \
            python3 \
            curl \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Install Rust (stable, minimal profile)
        # rustup-init pinned by version and checksum, from the archive URL —
        # `curl https://sh.rustup.rs | sh` pipes whatever that endpoint serves
        # into a shell. The TOOLCHAIN stays `stable` on purpose: the point of
        # this column is what current stable Rust does, and the version it
        # resolved to is recorded in the report.
        run: |
          RUSTUP_VER=1.29.1
          RUSTUP_SHA=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VER}/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Prepare the kernel (kTLS, ephemeral ports)
        # The kTLS bulk row needs the `tls` module; without it the row
        # reports "kTLS engaged: no" rather than failing. The handshake
        # cells open a connection per request by the ten thousand.
        run: |
          sudo modprobe tls || echo "::warning::no tls kernel module — the kTLS row will be userspace"
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65000" net.ipv4.tcp_tw_reuse=1
          nproc

      - name: Build nurlc (bootstrap fixed point + runtime.o)
        run: ./build.sh --no-tests

      - name: Run the TLS benchmark
        env:
          MODE: ${{ github.event.inputs.mode }}
          DIMS: ${{ github.event.inputs.dims }}
          # Read by run_tls.sh and written into the report so the table
          # says where its numbers came from.
          BENCH_HOST_LABEL: GitHub Actions ubuntu-latest runner
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash bench/tls_bench/run_tls.sh

      - name: Publish the report to the run summary
        if: always()
        run: |
          if [[ -f bench/tls_bench/TLS_RESULTS.md ]]; then
            cat bench/tls_bench/TLS_RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '`bench/tls_bench/TLS_RESULTS.md` was not produced — the run failed before the report stage.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tls-bench-results-${{ github.run_id }}
          path: bench/tls_bench/TLS_RESULTS.md
          retention-days: 90

      - name: Commit the refreshed report to main
        # Same mechanism as pq-bench.yml's results commit: push straight
        # to main, bypassing the PR ruleset with BENCH_PUSH_TOKEN when
        # present. A smoke run is a pipeline check, not a measurement, and
        # is never committed.
        if: github.event.inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ secrets.BENCH_PUSH_TOKEN || github.token }}
        run: |
          f=bench/tls_bench/TLS_RESULTS.md
          git add -N "$f"
          if git diff --quiet -- "$f"; then
            echo "report unchanged — nothing to commit."
            exit 0
          fi

          today="$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # actions/checkout stores an Authorization header for GITHUB_TOKEN
          # in the local git config, and that header WINS over credentials
          # embedded in the remote URL. Drop it so the URL's token (the
          # bypass PAT, when set) is the one that authenticates.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          keep="$(mktemp -d)"
          cp "$f" "$keep/TLS_RESULTS.md"
          git reset -q -- "$f"
          git fetch origin main
          git checkout -f -B main origin/main
          cp "$keep/TLS_RESULTS.md" "$f"

          # [skip ci] because this commit is one data file and nothing
          # else. The report was produced by a completed benchmark run.
          git add "$f"
          git commit -m "bench: refresh TLS_RESULTS ($today) [skip ci]"

          # Another merge can land while the benchmark runs; replay the
          # file onto the new tip rather than failing — the report is a
          # pure overwrite, so there is nothing to reconcile.
          for attempt in 1 2 3; do
            git push origin main && exit 0
            echo "push refused (attempt $attempt) — replaying onto the new tip"
            git fetch origin main
            git reset --hard origin/main
            cp "$keep/TLS_RESULTS.md" "$f"
            git add "$f"
            if git diff --cached --quiet -- "$f"; then
              echo "the new tip already carries this report — nothing to do."
              exit 0
            fi
            git commit -m "bench: refresh TLS_RESULTS ($today) [skip ci]"
          done
          echo "::error::could not push refreshed report after 3 attempts."
          echo "::error::If this is GH013, BENCH_PUSH_TOKEN's account is not in the"
          echo "::error::'Protect main' ruleset bypass list."
          exit 1
