name: diag-t500v
# Agora #500 verification only; this branch is deleted after the run.
on:
  push:
    branches: [diag/t500-verify]
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          brew install llvm coreutils pkg-config sqlite zstd
          echo "CLANG=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
      - name: build
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/sqlite/lib/pkgconfig:/opt/homebrew/opt/zstd/lib/pkgconfig
        run: ./build.sh --no-tests
      - name: compile old and new test, printing worst_delay always
        run: |
          for t in new old; do
            src=compiler/tests/sched_accept_admission.nu; [ $t = old ] && src=tools/diag/saa_old.nu
            sed 's|? >= worst / y 2 {|? T {|' $src > tools/diag/saa_${t}_w.nu
            grep -c "? T {" tools/diag/saa_${t}_w.nu
            ./nurl.sh tools/diag/saa_${t}_w.nu saa_$t
          done
      - name: 60 runs each, idle, under 3 and 6 CPU hogs, and beside a corpus run
        run: |
          n=$(getconf _NPROCESSORS_ONLN); echo "cpus=$n"
          dist() { sort -n | uniq -c | awk '{printf " %s:%s", $2, $1}'; echo; }
          for hogs in 0 $n $((2*n)); do
            for h in $(seq 1 $hogs); do ( while :; do :; done ) & done
            for t in old new; do
              printf "hogs=%s %s worst_delay(value:count):" $hogs $t
              for i in $(seq 1 60); do ./saa_$t | sed -n 's/worst_delay=//p'; done | dist
            done
            kill $(jobs -p) 2>/dev/null; wait 2>/dev/null || true
          done
          # The CI shape: the corpus running with 3 jobs beside it.
          ( NURL_TEST_JOBS=3 compiler/tests/run_tests.sh > corpus.log 2>&1 ) &
          sleep 20
          for t in old new; do
            printf "corpus %s worst_delay(value:count):" $t
            for i in $(seq 1 60); do ./saa_$t | sed -n 's/worst_delay=//p'; done | dist
          done
          wait || true
