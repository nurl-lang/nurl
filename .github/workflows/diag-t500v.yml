name: diag-t500v
# Agora #500 verification only; this branch is deleted after the run.
on:
  push:
    branches: [diag/t500-verify]
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          brew install llvm coreutils pkg-config sqlite zstd
          echo "CLANG=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
      - name: build
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/sqlite/lib/pkgconfig:/opt/homebrew/opt/zstd/lib/pkgconfig
        run: ./build.sh --no-tests
      - name: compile the three-stamp test
        run: ./nurl.sh tools/diag/saa_three.nu saa3
      - name: the three-stamp test in a loop beside the full corpus (jobs=3)
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/sqlite/lib/pkgconfig:/opt/homebrew/opt/zstd/lib/pkgconfig
        run: |
          ( NURL_TEST_JOBS=3 compiler/tests/run_tests.sh > corpus.log 2>&1; echo done > corpus.done ) &
          i=0
          while [ ! -f corpus.done ]; do
            i=$((i+1))
            ./saa3 | tr '
' ' ' | sed -E 's/accepted=.*//' >> three.log; echo >> three.log
          done
          echo "runs=$i"
          echo "w_connect distribution:"; sed -nE 's/.*w_connect=([0-9]+).*//p' three.log | sort -n | uniq -c | awk '{printf " %s:%s", $2, $1}'; echo
          echo "w_arrival distribution:"; sed -nE 's/.*w_arrival=([0-9]+).*//p' three.log | sort -n | uniq -c | awk '{printf " %s:%s", $2, $1}'; echo
          echo "runs where either >= 32:"; awk '{ split($1,a,"="); split($2,b,"="); if (a[2]>=32 || b[2]>=32) print }' three.log
          grep -E "PASS [0-9]+ ·|sched_accept" corpus.log | head -5
