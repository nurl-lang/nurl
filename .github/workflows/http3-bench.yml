name: http3-bench

# Runs the HTTP/3 peer-comparison benchmark — NURL vs Rust quinn+h3 over
# QUIC, plus NURL's HTTP/2 and HTTP/1.1 on the same listener — on a fixed
# `ubuntu-latest` runner and commits the refreshed report back to the
# repository:
#
#   bench/HTTP3_RESULTS.md  fully generated by bench/run_http3.sh (the
#                           environment block, the HTTP/3 table, the
#                           three-protocol same-listener rows and the
#                           connection-setup rates). The script overwrites
#                           it every run — the same contract HTTP_RESULTS.md
#                           and HTTP3_RESULTS.md have with their scripts.
#
# The HTTP/1.1 (http-bench.yml) and HTTP/2 (http2-bench.yml) benchmarks are
# separate workflows and are not touched by this one; the three reports
# are meant to be read side by side.
#
# The load generator is h2load built with ngtcp2 + nghttp3 — the Ubuntu
# package cannot speak HTTP/3 — so the job builds nghttp2's own docker
# image (pinned to a release tag) and runs h2load from it.
#
# Deliberately MANUAL, like the other two: HTTP load numbers on a shared
# CI VM are noisy, so this is opt-in — run it when you want a fresh
# runner-measured table, not on every merge.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # for committing the refreshed report to main

jobs:
  http3-bench:
    name: NURL / Rust quinn+h3 — HTTP/3 (QUIC)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the results commit can be pushed onto the
          # upstream tip without a rejected non-fast-forward.
          fetch-depth: 0

      - name: Install build deps (clang + FFI libs + openssl)
        # Same FFI-lib block as http-bench.yml so the bootstrap path is
        # identical to a regular build. openssl generates the self-signed
        # TLS cert the servers present.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            pkg-config \
            openssl \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Install Rust (stable, minimal profile)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build h2load with HTTP/3 (nghttp2 v1.70.0 docker image)
        # nghttp2's own Dockerfile builds aws-lc + ngtcp2 + nghttp3 + nghttp2
        # (h2load --h3). Pinned to a release tag on both the clone and the
        # build argument so the generator is the same binary every run.
        run: |
          git clone --depth 1 -b v1.70.0 https://github.com/nghttp2/nghttp2.git /tmp/nghttp2
          docker build -t nghttp2-h3 -f /tmp/nghttp2/docker/Dockerfile \
            --build-arg NGHTTP2_BRANCH=v1.70.0 /tmp/nghttp2
          docker run --rm nghttp2-h3 h2load --version

      - name: Record toolchain versions
        run: |
          clang --version | head -1
          rustc --version
          docker run --rm nghttp2-h3 h2load --version

      - name: Build nurlc (bootstrap fixed point + runtime.o)
        run: ./build.sh --no-tests

      - name: Run the HTTP/3 benchmark
        env:
          BENCH_HOST_LABEL: GitHub Actions ubuntu-latest runner
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          H2LOAD_IMAGE: nghttp2-h3
        run: ./bench/run_http3.sh

      - name: Publish the report to the run summary
        if: always()
        run: |
          if [[ -f bench/HTTP3_RESULTS.md ]]; then
            cat bench/HTTP3_RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '`bench/HTTP3_RESULTS.md` was not produced — the run failed before the report stage.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http3-bench-results-${{ github.run_id }}
          path: bench/HTTP3_RESULTS.md
          retention-days: 90

      - name: Commit the refreshed report to main
        # Same mechanism as http-bench.yml's results commit: push straight
        # to main, bypassing the PR ruleset with BENCH_PUSH_TOKEN when
        # present.
        env:
          GH_TOKEN: ${{ secrets.BENCH_PUSH_TOKEN || github.token }}
        run: |
          if git diff --quiet -- bench/HTTP3_RESULTS.md; then
            echo "report unchanged — nothing to commit."
            exit 0
          fi

          today="$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # actions/checkout stores an Authorization header for GITHUB_TOKEN
          # in the local git config, and that header WINS over credentials
          # embedded in the remote URL. Drop it so the URL's token (the
          # bypass PAT, when set) is the one that authenticates.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          git fetch origin main
          git stash push -- bench/HTTP3_RESULTS.md
          git checkout -B main origin/main
          git checkout stash@{0} -- bench/HTTP3_RESULTS.md
          git stash drop

          # [skip ci]: one data file, produced by a completed benchmark run.
          git add bench/HTTP3_RESULTS.md
          git commit -m "bench: refresh HTTP3_RESULTS ($today) [skip ci]"

          keep="$(mktemp -d)"
          cp bench/HTTP3_RESULTS.md "$keep/HTTP3_RESULTS.md"

          # Another merge can land while the benchmark runs; replay the
          # file onto the new tip rather than failing — the report is a
          # pure overwrite, so there is nothing to reconcile.
          for attempt in 1 2 3; do
            git push origin main && exit 0
            echo "push refused (attempt $attempt) — replaying onto the new tip"
            git fetch origin main
            git reset --hard origin/main
            cp "$keep/HTTP3_RESULTS.md" bench/HTTP3_RESULTS.md
            if git diff --quiet -- bench/HTTP3_RESULTS.md; then
              echo "the new tip already carries this report — nothing to do."
              exit 0
            fi
            git commit -am "bench: refresh HTTP3_RESULTS ($today) [skip ci]"
          done
          echo "::error::could not push refreshed report after 3 attempts."
          echo "::error::If this is GH013, BENCH_PUSH_TOKEN's account is not in the"
          echo "::error::'Protect main' ruleset bypass list."
          exit 1
