name: Publish Webdocs

# Publishes the Fumadocs documentation site (webdocs/) to Cloudflare at
# https://docs.nurl-lang.org. Runs on every push to main that touches
# webdocs/ (or this workflow), and can also be triggered manually from the
# Actions tab (Run workflow).
#
# `pnpm run deploy` runs `next build && wrangler deploy` — Next.js's static
# export (`output: 'export'` in next.config.mjs) builds the site to `out/`,
# which `wrangler deploy` uploads as an assets-only Worker and attaches the
# docs.nurl-lang.org custom domain (see webdocs/wrangler.jsonc), same
# pattern the old VitePress site used. Search runs against a build-time
# Orama index fetched and queried client-side instead of a live API route
# (see webdocs' own migration notes, content/docs/fumadocs-migration.mdx).
#
# Requires two GitHub Actions repo secrets (shared with the other Cloudflare
# deploys):
#   CLOUDFLARE_API_TOKEN   — a token with Workers edit rights
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
# When the token is unset / still the REPLACE_ME placeholder (e.g. on forks)
# every step skips and the job is a green no-op.

on:
  push:
    branches: [main]
    paths:
      - 'webdocs/**'
      - '.github/workflows/webdocs-deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `secrets` can't be used in an `if:` directly, so derive a boolean in
    # job-level `env` (which may read secrets) and gate each step on it.
    env:
      DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN != 'REPLACE_ME' }}
    defaults:
      run:
        working-directory: webdocs
    steps:
      - if: env.DEPLOY_ENABLED == 'true'
        uses: actions/checkout@v4
      - if: env.DEPLOY_ENABLED == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - if: env.DEPLOY_ENABLED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webdocs/pnpm-lock.yaml
      - if: env.DEPLOY_ENABLED == 'true'
        run: pnpm install --frozen-lockfile
      # `deploy` = `next build && wrangler deploy`.
      - name: Deploy
        if: env.DEPLOY_ENABLED == 'true'
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
