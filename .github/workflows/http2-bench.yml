name: http2-bench

# Runs the HTTP/2 peer-comparison benchmark — NURL vs Rust hyper vs Node,
# cleartext (h2c prior knowledge) and over TLS (ALPN h2) — on a fixed
# `ubuntu-latest` runner and publishes the refreshed report to the
# bench-data branch (tools/bench_data.sh):
#
#   bench/HTTP2_RESULTS.md  fully generated by bench/run_http2.sh (the
#                           environment block, the h2c table, the TLS table
#                           and the HTTP/2-vs-HTTP/1.1 same-server rows).
#                           The script overwrites it every run — the same
#                           contract HTTP_RESULTS.md has with run_http.sh.
#
# The HTTP/1.1 benchmark (http-bench.yml → bench/HTTP_RESULTS.md) is a
# separate workflow and is not touched by this one; the two reports are
# meant to be read side by side.
#
# Deliberately MANUAL, like http-bench.yml: HTTP load numbers on a shared
# CI VM are noisy, so this is opt-in — run it when you want a fresh
# runner-measured table, not on every merge.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # to publish the report to the bench-data branch

jobs:
  http2-bench:
    name: NURL / Rust hyper / Node — HTTP/2 (h2c + TLS)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: the report header's NURL version is
          # `git describe` (tools/version.sh).
          fetch-depth: 0

      - name: Install build deps (clang + FFI libs + openssl)
        # Same FFI-lib block as http-bench.yml so the bootstrap path is
        # identical to a regular build. openssl generates the self-signed
        # TLS cert the servers present. Node ships in the image.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            pkg-config \
            openssl \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Install Rust (stable, minimal profile)
        # rustup-init pinned by version and checksum, from the archive URL —
        # `curl https://sh.rustup.rs | sh` pipes whatever that endpoint serves
        # into a shell. The TOOLCHAIN stays `stable` on purpose: the point of
        # this column is what current stable Rust does, and the version it
        # resolved to is recorded in the run's toolchain-versions step.
        run: |
          RUSTUP_VER=1.29.1
          RUSTUP_SHA=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VER}/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install oha (load generator)
        # Pinned to the version the report header records; its --http2 /
        # -p (streams per connection) flags drive the HTTP/2 cells.
        run: cargo install oha --version 1.8.0 --locked

      - name: Record toolchain versions
        run: |
          clang --version | head -1
          rustc --version
          node --version
          "$HOME/.cargo/bin/oha" --version

      - name: Build nurlc (bootstrap fixed point + runtime.o)
        run: ./build.sh --no-tests

      - name: Run the HTTP/2 benchmark
        env:
          BENCH_HOST_LABEL: GitHub Actions ubuntu-latest runner
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./bench/run_http2.sh

      - name: Publish the report to the run summary
        if: always()
        run: |
          if [[ -f bench/HTTP2_RESULTS.md ]]; then
            cat bench/HTTP2_RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '`bench/HTTP2_RESULTS.md` was not produced — the run failed before the report stage.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http2-bench-results-${{ github.run_id }}
          path: bench/HTTP2_RESULTS.md
          retention-days: 90

      - name: Publish the report to the bench-data branch
        # Measured numbers live on the bench-data branch, not on main
        # (tools/bench_data.sh, Agora #290): every push to main outside the
        # merge queue made the queue rebuild and re-run each group in flight.
        # Only a run of main's code publishes; a run of a branch leaves its
        # report in the run summary and the artifact.
        if: github.ref == 'refs/heads/main'
        run: |
          tools/bench_data.sh publish "bench: refresh HTTP2_RESULTS ($(date -u +%Y-%m-%d))" bench/HTTP2_RESULTS.md
