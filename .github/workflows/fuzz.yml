name: fuzz

# Continuous fuzzing — NOT a per-PR gate (it would slow every merge and its
# value is in breadth over time, not a single run). Runs weekly and on demand:
#   1. differential integer/float miscompile fuzzer (tools/fuzz/fuzz.sh,
#      FUZZ_GEN=int): generate a self-checking expression program + a Python
#      oracle, compile at -O0 and -O2, require both outputs == oracle.
#   2. differential STRUCTURAL fuzzer (FUZZ_GEN=struct, tools/fuzz/genprog.py):
#      whole programs over enums/match/closures/loops/defer/%Drop/ownership,
#      same oracle contract, plus an ASan+LSan leg on sampled seeds — leaks
#      and UAF in generated ownership traffic are findings even when stdout
#      matches.
#      The structural and integer legs also sample seeds onto wasm32-wasi
#      (packages/wasmbuilder + reference wasmtime) — a third independent
#      execution environment against the same oracle, catching
#      target-dependent codegen (32-bit pointers, i64 payload slots).
#   2b. INVERSE oracle (FUZZ_GEN=reject, tools/fuzz/genreject.py): programs
#      that are ownership violations by construction, crossed with every
#      context the language offers. The compiler must reject each one, with
#      the diagnostic that violation deserves. A missed rejection is the one
#      failure mode nothing else catches — the program compiles, runs, and
#      corrupts the heap.
#   3. mutational parser fuzzer (tools/fuzz/fuzz_parsers.sh): mutate seeds for
#      the untrusted-input parsers against an ASan+UBSan+LSan harness; any
#      crash / OOB / UB / leak / oversized allocation / hang is a finding.
#      Two legs: the data formats (x509/DER, CSR, PEM, cbor, msgpack, json,
#      yaml, xml, toml) by iteration count, and the network-facing protocol
#      parsers (HTTP/1.1 server + client, HTTP/2 + HPACK, HTTP/3 frames +
#      QPACK, TLS records / ClientHello / ServerHello / Certificate, WebSocket,
#      MQTT, multipart, URL/query/cookie) with a time budget per target.
# Any finding fails the run and uploads the reproducer inputs as artifacts.
#
# Findings are SHRUNK before they are filed: tools/fuzz/reduce.py deletes
# statements while the same failure survives, so the artifact carries a
# `*.min.nu` of a few dozen lines beside the full 150–400-line seed. The
# property is fingerprinted from the original failure (normalised error
# message / ASan report kind / the specific expectation that disagreed) so the
# reducer cannot drift onto an unrelated breakage of its own making.
#
# Every knob the legs take is a workflow_dispatch input. `seed_start` is the
# one worth moving: a weekly run pinned at seed 1 re-tests the same programs
# forever, while walking the start covers ground no run has seen.
#
# Every run also renders FUZZRESULTS.md (tools/fuzz/report.py) and publishes
# it to the bench-data branch (tools/bench_data.sh) — the same
# publish-the-evidence flow bench.yml uses for RESULTS.md — so the latest
# fuzzing status is always one link away. The curated findings log
# (tools/fuzz/FINDINGS.json) is source and stays on main.

on:
  schedule:
    - cron: '0 6 * * 1'          # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      diff_seeds:
        description: 'integer differential: number of seeds'
        default: '1500'
      struct_seeds:
        description: 'structural differential: number of seeds'
        default: '600'
      parser_iters:
        description: 'parser fuzzer (data formats): iterations per RNG seed'
        default: '4000'
      net_parser_minutes:
        description: 'parser fuzzer (network protocols): minutes per target'
        default: '4'
      # A weekly run that starts at seed 1 re-tests the same programs every
      # week. Moving the start walks the corpus into ground no run has
      # covered; keeping it pinned re-tests a range a finding came from.
      seed_start:
        description: 'first seed for both differential legs'
        default: '1'
      struct_stmts:
        description: 'structural: statements per program (breadth per seed)'
        default: '14'
      struct_depth:
        description: 'structural: expression depth'
        default: '3'
      san_every:
        description: 'sanitize every Nth structural seed (0 = off)'
        default: '5'
      wasm_every:
        description: 'run every Nth seed on wasm32-wasi (0 = off)'
        default: '5'
      reduce_tests:
        description: 'reducer budget per finding, in compiles (0 = no reduction)'
        default: '400'
      reject_seeds:
        description: 'inverse oracle: number of must-be-rejected programs'
        default: '400'
      reject_depth:
        description: 'inverse oracle: max nested contexts around the violation'
        default: '3'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write              # to publish FUZZRESULTS.md to the bench-data branch

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (clang + optional FFI libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config \
            libcurl4-openssl-dev libssl-dev libsqlite3-dev \
            libpq-dev zlib1g-dev libzstd-dev
          clang --version

      - name: Build toolchain
        run: ./build.sh --no-tests

      - name: Install zig + wasmtime (wasm differential leg)
        # zig carries its own wasi-libc and wasm-ld, so no wasi-sdk is
        # needed (same recipe release.yml uses for the bundled backend).
        run: |
          ZIG_VER=0.16.0
          ZIG_SHA=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          curl -fsSL "https://ziglang.org/download/${ZIG_VER}/zig-x86_64-linux-${ZIG_VER}.tar.xz" -o /tmp/zig.tar.xz
          echo "$ZIG_SHA  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig-toolchain"
          tar -xf /tmp/zig.tar.xz -C "$HOME/zig-toolchain" --strip-components=1
          echo "$HOME/zig-toolchain" >> "$GITHUB_PATH"
          "$HOME/zig-toolchain/zig" version
          # A pinned, checksum-verified release archive rather than
          # `curl https://wasmtime.dev/install.sh | bash`: that piped whatever
          # the script said that day straight into a shell, and installed
          # whatever version it chose, so a differential leg could change
          # oracle underneath a campaign without anything in the diff.
          WASMTIME_VER=v48.0.2
          WASMTIME_SHA=f2b0ad1ce9253f2f9a38793c2c42cd1cba4e90b27dc40d685eaf723dc8438d94
          WASMTIME_DIR="wasmtime-${WASMTIME_VER}-x86_64-linux"
          curl -fsSL --retry 5 -o /tmp/wasmtime.tar.xz \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VER}/${WASMTIME_DIR}.tar.xz"
          echo "$WASMTIME_SHA  /tmp/wasmtime.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.wasmtime/bin"
          tar -xf /tmp/wasmtime.tar.xz -C /tmp
          install -m755 "/tmp/${WASMTIME_DIR}/wasmtime" "$HOME/.wasmtime/bin/wasmtime"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          "$HOME/.wasmtime/bin/wasmtime" --version

      - name: Build wasmbuilder (shared by both differential legs)
        run: |
          ./nurl.sh packages/wasmbuilder/src/main.nu "$RUNNER_TEMP/wasmbuilder"
          echo "FUZZ_WASMBUILDER=$RUNNER_TEMP/wasmbuilder" >> "$GITHUB_ENV"

      - name: Differential miscompile fuzzer (integer)
        env:
          SEED_START: ${{ github.event.inputs.seed_start || '1' }}
          SEEDS: ${{ github.event.inputs.diff_seeds || '1500' }}
          WASM_EVERY: ${{ github.event.inputs.wasm_every || '5' }}
          REDUCE_TESTS: ${{ github.event.inputs.reduce_tests || '400' }}
        run: |
          FUZZ_WASM_EVERY=$(( WASM_EVERY == 0 ? 0 : WASM_EVERY * 2 )) \
          FUZZ_REDUCE_TESTS="$REDUCE_TESTS" \
          FUZZ_SUMMARY="$RUNNER_TEMP/fuzz-summaries/int.json" \
            ./tools/fuzz/fuzz.sh "$SEED_START" "$SEEDS"

      - name: Differential miscompile fuzzer (structural + sanitizer leg)
        if: success() || failure()          # run even if the int leg found something
        env:
          SEED_START: ${{ github.event.inputs.seed_start || '1' }}
          SEEDS: ${{ github.event.inputs.struct_seeds || '600' }}
          STMTS: ${{ github.event.inputs.struct_stmts || '14' }}
          DEPTH: ${{ github.event.inputs.struct_depth || '3' }}
          SAN_EVERY: ${{ github.event.inputs.san_every || '5' }}
          WASM_EVERY: ${{ github.event.inputs.wasm_every || '5' }}
          REDUCE_TESTS: ${{ github.event.inputs.reduce_tests || '400' }}
        run: |
          FUZZ_GEN=struct FUZZ_SAN_EVERY="$SAN_EVERY" FUZZ_WASM_EVERY="$WASM_EVERY" \
          FUZZ_REDUCE_TESTS="$REDUCE_TESTS" \
          FUZZ_SUMMARY="$RUNNER_TEMP/fuzz-summaries/struct.json" \
            ./tools/fuzz/fuzz.sh "$SEED_START" "$SEEDS" "$STMTS" "$DEPTH"

      - name: Inverse oracle (programs the compiler MUST reject)
        if: success() || failure()
        # The other legs emit VALID programs and ask whether the answer is
        # right. This one emits ownership violations by construction and asks
        # whether they are caught — the question a borrow checker is actually
        # judged on, and the only one whose failures are silent (the program
        # compiles, runs, and corrupts the heap). No sanitizer or wasm leg:
        # nothing here is meant to run.
        env:
          SEED_START: ${{ github.event.inputs.seed_start || '1' }}
          SEEDS: ${{ github.event.inputs.reject_seeds || '400' }}
          DEPTH: ${{ github.event.inputs.reject_depth || '3' }}
        run: |
          FUZZ_GEN=reject \
          FUZZ_SUMMARY="$RUNNER_TEMP/fuzz-summaries/reject.json" \
            ./tools/fuzz/fuzz.sh "$SEED_START" "$SEEDS" 0 "$DEPTH"

      - name: Parser fuzzer (ASan + UBSan)
        if: success() || failure()
        # Two RNG seeds for a bit of breadth; each builds the harness once and
        # runs N mutated inputs. 8s per-input timeout catches hangs.
        env:
          FUZZ_FORMATS: x509,csr,pem,cbor,msgpack,json,yaml,xml,toml
        run: |
          iters="${{ github.event.inputs.parser_iters || '4000' }}"
          FUZZ_SUMMARY="$RUNNER_TEMP/fuzz-summaries/parsers-1.json" \
            ./tools/fuzz/fuzz_parsers.sh 1 "$iters" 8
          FUZZ_SUMMARY="$RUNNER_TEMP/fuzz-summaries/parsers-2.json" \
            ./tools/fuzz/fuzz_parsers.sh 2 "$iters" 8

      - name: Network parser fuzzer (ASan + UBSan, time-budgeted)
        if: success() || failure()
        # The parsers a remote peer feeds: each target gets the same number
        # of minutes (an iteration count would starve the socket targets,
        # which run a loopback connection — a TLS handshake for `tls` — per
        # input), four side by side on the runner's four cores. The RNG
        # seed walks with the run number so each week covers new inputs; it
        # is printed, and a finding reproduces from its saved input alone.
        env:
          MINUTES: ${{ github.event.inputs.net_parser_minutes || '4' }}
          FUZZ_FORMATS: http1,h2,tls,tlscli,tlscert,ws,http1resp,mqtt,hpack,h2frame,qpack,h3frame,multipart,urlish
        run: |
          FUZZ_MINUTES="$MINUTES" FUZZ_JOBS=4 \
          FUZZ_SUMMARY="$RUNNER_TEMP/fuzz-summaries/parsers-net.json" \
            ./tools/fuzz/fuzz_parsers.sh "${{ github.run_number }}" 0 8

      - name: Render FUZZRESULTS.md
        if: always()
        run: |
          python3 tools/fuzz/report.py "$RUNNER_TEMP"/fuzz-summaries/*.json
          cat FUZZRESULTS.md

      - name: Upload reproducers on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: tools/fuzz/failures/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish the results to the bench-data branch
        # Measured numbers live on the bench-data branch, not on main
        # (tools/bench_data.sh, Agora #290): every push to main outside the
        # merge queue made the queue rebuild and re-run each group in flight.
        # Only a run of main's code publishes; a run of a branch leaves its
        # report in the run summary and the artifact.
        # always(): a fuzz run that found something still publishes its
        # report, which is how the finding gets seen.
        if: always() && github.ref == 'refs/heads/main'
        run: |
          tools/bench_data.sh publish "fuzz: refresh FUZZRESULTS.md ($(date -u +%Y-%m-%d))" FUZZRESULTS.md
