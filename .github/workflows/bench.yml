name: bench

# Runs the whole benchmark suite — 20 benchmarks in NURL, C and Rust, 15 of
# them also in Node and Python (bench/manifest.tsv) — on a fixed
# `ubuntu-latest` runner and commits the result back to the repository:
#
#   bench/results/latest.json   machine-readable; webdocs' build step
#                               (tools/gen-bench-table.mjs) renders the
#                               landing page's table straight from it, so
#                               the site's numbers are whatever this
#                               workflow last measured
#   bench/RESULTS.md            the same run for humans, including the
#                               compile-time and correctness tables the
#                               web page deliberately leaves out
#
# The numbers are runner numbers: a shared 2-vCPU VM is slower and noisier
# than a workstation. That is the point — they are reproducible, anyone
# can re-run this workflow on the same spec, and a regression shows up as
# a commit-level diff instead of going unnoticed.
#
# Closes the falsifiability gap flagged in the external critic / TODO
# Tier 1.2: the headline numbers used to come from one specific machine
# with no way for a reader to check them.

on:
  # Any commit on main that touches the benchmark corpus, the compiler or
  # the runtime re-measures AND commits the refreshed numbers. Keeping main
  # continuously current is what makes a release tag correct by
  # construction: the alternative — measuring at the tag — cannot work,
  # because a tag is immutable and the suite finishes long after it is cut.
  #
  # This does not re-trigger itself: the results files are excluded from the
  # paths filter below. The cost is that runner noise (a few per cent
  # run-to-run) puts a diff in latest.json on most merges, so read a single
  # diff as noise and a sustained shift as a regression.
  push:
    branches: [main]
    # Release tags: every vX.Y.Z also refreshes the committed numbers, so
    # a release always ships with a table measured at exactly that tag.
    # (GitHub does not evaluate the paths filter for tag pushes, so the
    # filter below only narrows the branch runs.)
    tags: ['v*']
    paths:
      - 'bench/**'
      # The results files are what this workflow itself commits back —
      # excluded so a results merge doesn't spin up another full run.
      - '!bench/results/**'
      - '!bench/RESULTS.md'
      - '!bench/RESULTS-x*.md'
      - 'compiler/**'
      - 'stdlib/**'
      - '.github/workflows/bench.yml'

  # Manual runs also commit the refreshed numbers — for re-measuring
  # between releases (runner microarchitecture drift, toolchain bumps,
  # noise-floor changes) without waiting for the next tag.
  #
  # `scale` is the workload multiplier, BENCH_SCALE in every NURL, C and
  # Rust source (the same knob wasm-bench.yml has). 1 is the published
  # contract and the only value push and tag runs use. Any other N writes
  # RESULTS-xN.md and results/xN.json beside the x1 report — NURL / C /
  # Rust only, since the Node and Python peers have no multiplier — and
  # never replaces the table the landing page renders.
  workflow_dispatch:
    inputs:
      scale:
        description: 'Workload multiplier N (1 = the published contract). N≠1 writes RESULTS-xN.md beside the x1 report, NURL/C/Rust only.'
        required: false
        default: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # for committing the refreshed results to main

jobs:
  bench:
    name: 20 benchmarks × NURL / C / Rust (+ Node / Python)
    runs-on: ubuntu-latest
    # The suite is bounded by its slowest language, not by NURL: several
    # of the u64 kernels take tens of seconds under CPython and Node
    # BigInt. bench.sh keeps that finite by giving a slow cell fewer
    # repetitions (its --budget-ms), but the matrix still needs room.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the results commit can be pushed onto the
          # upstream tip without a rejected non-fast-forward.
          fetch-depth: 0

      - name: Install build deps (clang + FFI libs)
        # Same FFI-lib block as ci.yml so the bootstrap path is identical
        # to a regular build. Node and Python ship in the runner image.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Install Rust (stable, minimal profile)
        # rustup-init pinned by version and checksum, from the archive URL —
        # `curl https://sh.rustup.rs | sh` pipes whatever that endpoint serves
        # into a shell. The TOOLCHAIN stays `stable` on purpose: the point of
        # this column is what current stable Rust does, and the version it
        # resolved to is recorded in the run's toolchain-versions step.
        run: |
          RUSTUP_VER=1.29.1
          RUSTUP_SHA=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VER}/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Record toolchain versions
        run: |
          clang --version | head -1
          rustc --version
          node --version
          python3 --version

      - name: Build nurlc (bootstrap fixed point + runtime.o)
        run: ./build.sh --no-tests

      - name: Resolve the workload scale and its report files
        # The scale reaches the shell through the environment, never spliced
        # into the script text. Push and tag runs have no inputs, so they
        # fall through to 1. x1 writes the published RESULTS.md /
        # latest.json; any other N its own RESULTS-xN.md / xN.json
        # (bench.sh picks the same names), so the x1 table is never
        # replaced by a scaled one.
        env:
          SCALE: ${{ inputs.scale }}
        run: |
          SCALE="${SCALE:-1}"
          if [[ ! "$SCALE" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::scale must be a positive integer below 10^9, got '$SCALE'"
            exit 1
          fi
          if [[ "$SCALE" == 1 ]]; then
            md=bench/RESULTS.md; json=bench/results/latest.json
          else
            md="bench/RESULTS-x$SCALE.md"; json="bench/results/x$SCALE.json"
          fi
          {
            echo "BENCH_SCALE=$SCALE"
            echo "REPORT_MD=$md"
            echo "REPORT_JSON=$json"
          } >> "$GITHUB_ENV"

      - name: Run the suite
        env:
          # Both are read by bench.sh and land in the results file, so the
          # published table can say where its numbers came from.
          # Name the environment only. The core count, memory and CPU model
          # are measured by bench.sh and land in the results file, so a
          # hardcoded "2-vCPU / 7 GiB" here would eventually contradict them
          # — as it did the first time this ran, on a runner reporting 4.
          BENCH_HOST_LABEL: GitHub Actions ubuntu-latest runner
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # A row whose implementations disagree makes bench.sh exit
        # non-zero: the timings would be comparing different computations.
        # bench.sh also reads BENCH_SCALE from the environment; passing it
        # explicitly keeps the command line in the log self-describing.
        run: ./bench/bench.sh --timeout 300 --scale "$BENCH_SCALE"

      - name: Physical-floor check (chaincheck)
        # Every serial-chain row must run no faster than its dependency
        # chain's hardware minimum — a cell below that line means a
        # compiler shortcut the recurrence and the row is no longer
        # measuring what its blurb claims. GitHub's Azure VMs expose no
        # PMU, so this runs in wall-clock mode: measured time must be
        # >= iterations x floor-cycles at 6 GHz, a clock no shipping
        # CPU sustains. Publishing a table with an impossible number in
        # it is worse than failing the run.
        run: ./bench/chaincheck.sh

      - name: Publish the report to the run summary
        # So the numbers are readable in the Actions UI without
        # downloading an artifact or waiting for the site to publish.
        if: always()
        run: |
          if [[ -f "$REPORT_MD" ]]; then
            cat "$REPORT_MD" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "\`$REPORT_MD\` was not produced — the run failed before the report stage." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results as a workflow artifact
        # Always uploaded — this is how push-triggered runs surface their
        # numbers without committing them.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_id }}
          path: |
            ${{ env.REPORT_JSON }}
            ${{ env.REPORT_MD }}
          retention-days: 90

      - name: Commit the refreshed results to main
        # Every triggering event commits: merges to main keep the numbers
        # current, so a release tag already carries them.
        #
        # Committed straight to main, not routed through a PR. The PR
        # detour is what broke the published table: on a `v*` tag this
        # workflow and the site deploy start together, the deploy checks
        # out the TAG, and a tag can never contain results measured after
        # it was cut. The numbers landed on main minutes-to-hours later
        # and nothing redeployed, so nurl-lang.org kept publishing the
        # previous release's table.
        #
        # main carries a ruleset requiring pull requests, so this push
        # needs an actor allowed to bypass it: set BENCH_PUSH_TOKEN to a
        # PAT whose account is in the ruleset's bypass list. Without it
        # the push is declined with GH013 and this step fails loudly —
        # which is the honest outcome, because a silent fallback is
        # exactly how the table went stale unnoticed.
        env:
          GH_TOKEN: ${{ secrets.BENCH_PUSH_TOKEN || github.token }}
        run: |
          # a xN report may be new: add it before asking whether it changed
          git add -N -- "$REPORT_JSON" "$REPORT_MD"
          if git diff --quiet -- "$REPORT_JSON" "$REPORT_MD"; then
            echo "results unchanged — nothing to commit."
            exit 0
          fi
          scale_tag=""
          [[ "$BENCH_SCALE" == 1 ]] || scale_tag=" x$BENCH_SCALE"

          today="$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # actions/checkout stores an Authorization header for GITHUB_TOKEN
          # in the local git config, and that header WINS over credentials
          # embedded in the remote URL. Leaving it in place is why the first
          # run of this step still pushed as github-actions[bot] — and was
          # refused with GH013 — despite BENCH_PUSH_TOKEN being set. Drop it
          # so the URL's token is the one that authenticates.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # A tag build has a detached HEAD; commit onto main explicitly so
          # the results land where the site reads them from.
          # Carry the measured files across the switch to main outside the
          # worktree: a xN report is untracked, which `git stash` would
          # leave behind.
          git fetch origin main
          keep_pre="$(mktemp -d)"
          cp "$REPORT_JSON" "$keep_pre/report.json"
          cp "$REPORT_MD" "$keep_pre/report.md"
          git reset -q -- "$REPORT_JSON" "$REPORT_MD"
          git checkout -f -B main origin/main
          mkdir -p "$(dirname "$REPORT_JSON")"
          cp "$keep_pre/report.json" "$REPORT_JSON"
          cp "$keep_pre/report.md" "$REPORT_MD"

          # [skip ci] because this commit is two data files and nothing
          # else. ci.yml and windows-tests.yml have no paths filter, so
          # every results commit would otherwise fire the three required
          # checks — one of them a FreeBSD VM — plus the Windows suite,
          # against code that did not change. bench.yml itself already
          # excludes the results files from its own paths filter, so there
          # was never a loop; there was a second full CI round per merge,
          # which is pure waste. The numbers were produced by a run that
          # passed the correctness gate and chaincheck before committing.
          git add -- "$REPORT_JSON" "$REPORT_MD"
          git commit -m "bench: refresh measured numbers$scale_tag ($today) [skip ci]"

          # Keep the measured files OUTSIDE the worktree for the replay
          # below. Stashing them cannot work there: by that point they are
          # committed, so `git stash push -- <paths>` finds nothing to save,
          # leaves no stash@{0}, and the replay silently drops the run's
          # results instead of publishing them.
          keep="$(mktemp -d)"
          cp "$REPORT_JSON" "$keep/report.json"
          cp "$REPORT_MD" "$keep/report.md"

          # The suite takes tens of minutes; another merge can land in that
          # window. Replay the two files onto the new tip rather than failing
          # — results are a pure overwrite, so there is nothing to reconcile.
          #
          # Replay means: keep the files, move to the new tip, commit afresh.
          # `commit --amend` here would rewrite the tip commit that arrived
          # while we ran, which the remote then refuses as a non-fast-forward
          # — the retry loop's own first version did exactly that and turned
          # one refusal into three.
          for attempt in 1 2 3; do
            git push origin main && exit 0
            echo "push refused (attempt $attempt) — replaying onto the new tip"
            git fetch origin main
            git reset --hard origin/main
            cp "$keep/report.json" "$REPORT_JSON"
            cp "$keep/report.md" "$REPORT_MD"
            git add -- "$REPORT_JSON" "$REPORT_MD"
            if git diff --cached --quiet -- "$REPORT_JSON" "$REPORT_MD"; then
              echo "the new tip already carries these numbers — nothing to do."
              exit 0
            fi
            git commit -m "bench: refresh measured numbers$scale_tag ($today) [skip ci]"
          done
          echo "::error::could not push refreshed results after 3 attempts."
          echo "::error::If this is GH013, BENCH_PUSH_TOKEN's account is not in the"
          echo "::error::'Protect main' ruleset bypass list (currently: Repository admin)."
          exit 1
