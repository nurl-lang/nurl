name: bench

# Runs the whole benchmark suite — 15 benchmarks × 5 languages (NURL, C,
# Rust, Node, Python) — on a fixed `ubuntu-latest` runner and commits the
# result back to the repository:
#
#   bench/results/latest.json   machine-readable; nurlweb's publish step
#                               (tools/gen-bench-table.mjs) renders the
#                               landing page's table straight from it, so
#                               the site's numbers are whatever this
#                               workflow last measured
#   bench/RESULTS.md            the same run for humans, including the
#                               compile-time and correctness tables the
#                               web page deliberately leaves out
#
# The numbers are runner numbers: a shared 2-vCPU VM is slower and noisier
# than a workstation. That is the point — they are reproducible, anyone
# can re-run this workflow on the same spec, and a regression shows up as
# a commit-level diff instead of going unnoticed.
#
# Closes the falsifiability gap flagged in the external critic / TODO
# Tier 1.2: the headline numbers used to come from one specific machine
# with no way for a reader to check them.

on:
  # Source-change runs: any commit on main that touches the benchmark
  # corpus, the compiler or the runtime. Uploads an artifact but does NOT
  # commit results back — that would be a commit storm during active
  # development, and would re-trigger this workflow on every push.
  push:
    branches: [main]
    # Release tags: every vX.Y.Z also refreshes the committed numbers, so
    # a release always ships with a table measured at exactly that tag.
    # (GitHub does not evaluate the paths filter for tag pushes, so the
    # filter below only narrows the branch runs.)
    tags: ['v*']
    paths:
      - 'bench/**'
      - 'compiler/**'
      - 'stdlib/**'
      - '.github/workflows/bench.yml'

  # Manual runs also commit the refreshed numbers — for re-measuring
  # between releases (runner microarchitecture drift, toolchain bumps,
  # noise-floor changes) without waiting for the next tag.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # for pushing the refreshed-results branch
  pull-requests: write     # for opening the results PR (also needs the org
                           # Actions policy to allow PR creation, or a PAT
                           # in BENCH_PR_TOKEN — see the PR step)

jobs:
  bench:
    name: 15 benchmarks × NURL / C / Rust / Node / Python
    runs-on: ubuntu-latest
    # The suite is bounded by its slowest language, not by NURL: several
    # of the u64 kernels take tens of seconds under CPython and Node
    # BigInt. bench.sh keeps that finite by giving a slow cell fewer
    # repetitions (its --budget-ms), but the matrix still needs room.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the results commit can be pushed onto the
          # upstream tip without a rejected non-fast-forward.
          fetch-depth: 0

      - name: Install build deps (clang + FFI libs)
        # Same FFI-lib block as ci.yml so the bootstrap path is identical
        # to a regular build. Node and Python ship in the runner image.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Install Rust (stable, minimal profile)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Record toolchain versions
        run: |
          clang --version | head -1
          rustc --version
          node --version
          python3 --version

      - name: Build nurlc (bootstrap fixed point + runtime.o)
        run: ./build.sh --no-tests

      - name: Run the suite
        env:
          # Both are read by bench.sh and land in the results file, so the
          # published table can say where its numbers came from.
          # Name the environment only. The core count, memory and CPU model
          # are measured by bench.sh and land in the results file, so a
          # hardcoded "2-vCPU / 7 GiB" here would eventually contradict them
          # — as it did the first time this ran, on a runner reporting 4.
          BENCH_HOST_LABEL: GitHub Actions ubuntu-latest runner
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # A row whose five implementations disagree makes bench.sh exit
        # non-zero: the timings would be comparing different computations.
        run: ./bench/bench.sh --timeout 300

      - name: Physical-floor check (chaincheck)
        # Every serial-chain row must run no faster than its dependency
        # chain's hardware minimum — a cell below that line means a
        # compiler shortcut the recurrence and the row is no longer
        # measuring what its blurb claims. GitHub's Azure VMs expose no
        # PMU, so this runs in wall-clock mode: measured time must be
        # >= iterations x floor-cycles at 6 GHz, a clock no shipping
        # CPU sustains. Publishing a table with an impossible number in
        # it is worse than failing the run.
        run: ./bench/chaincheck.sh

      - name: Publish the report to the run summary
        # So the numbers are readable in the Actions UI without
        # downloading an artifact or waiting for the site to publish.
        if: always()
        run: |
          if [[ -f bench/RESULTS.md ]]; then
            cat bench/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '`bench/RESULTS.md` was not produced — the run failed before the report stage.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results as a workflow artifact
        # Always uploaded — this is how push-triggered runs surface their
        # numbers without committing them.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_id }}
          path: |
            bench/results/latest.json
            bench/RESULTS.md
          retention-days: 90

      - name: Open a pull request with the refreshed results
        # Manual runs and release tags only; see the trigger comment above.
        #
        # This opens a PR rather than pushing to main, because main carries a
        # repository ruleset that requires one ("Changes must be made through
        # a pull request" + 3 required checks). A direct `git push` from here
        # is declined with GH013 — which is how the first scheduled-style run
        # of this workflow failed. Pushing a *new branch* is allowed, so the
        # results reach main the same way every other change does.
        #
        # Token order of preference:
        #   1. BENCH_PR_TOKEN secret (a PAT) — needed because the org-level
        #      Actions policy currently forbids the built-in GITHUB_TOKEN
        #      from creating PRs at all ("Resource not accessible by
        #      integration", the way run 30226327087 failed), and flipping
        #      that policy needs an org admin. A PAT also makes the PR
        #      trigger the required checks, so --auto can complete.
        #   2. The built-in token — works if an org admin has enabled
        #      "Allow GitHub Actions to create and approve pull requests";
        #      required checks then stay "expected" and the PR waits for a
        #      human, which is visible rather than silent.
        # If PR creation fails anyway, DON'T fail the run: the results
        # branch is already pushed and the artifact uploaded — print the
        # one-click compare URL into the step summary instead. A red run
        # over a missing convenience-PR reads as "the benchmarks failed",
        # which is worse than the missing PR.
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.BENCH_PR_TOKEN || github.token }}
        run: |
          if git diff --quiet -- bench/results/latest.json bench/RESULTS.md; then
            echo "results unchanged — nothing to open."
            exit 0
          fi

          today="$(date -u +%Y-%m-%d)"
          branch="bench-results/${today}-${{ github.run_id }}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add bench/results/latest.json bench/RESULTS.md
          git commit -m "bench: refresh measured numbers ($today)"
          git push -u origin "$branch"

          if gh pr create --base main --head "$branch" \
            --title "bench: refresh measured numbers ($today)" \
            --body "$(cat <<BODY
          Automated refresh from [\`bench.yml\` run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          All 15 benchmarks passed the correctness gate — every row's five implementations printed the same result — before any of them was timed, and the chaincheck physical-floor gate passed after the suite. The full report, including compile times and the process-start-up floor, is in the run summary and in \`bench/RESULTS.md\` below.

          Merging this updates what nurl-lang.org publishes: \`tools/gen-bench-table.mjs\` renders \`bench/results/latest.json\` into the landing page's table at the next deploy.
          BODY
          )"; then
            gh pr merge --auto --squash "$branch" \
              || echo "auto-merge not available — the PR is open and waiting for a review."
          else
            url="${{ github.server_url }}/${{ github.repository }}/compare/main...${branch}?expand=1"
            echo "::warning::PR creation was refused (org Actions policy?). The results branch IS pushed — open the PR here: $url"
            {
              echo "## Results branch pushed, PR creation refused"
              echo
              echo "The token cannot create pull requests (org-level Actions policy)."
              echo "Open it with one click: $url"
              echo
              echo "To make this automatic: add a \`BENCH_PR_TOKEN\` PAT secret, or have an"
              echo "org admin enable *Allow GitHub Actions to create and approve pull requests*."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
