name: bench

# Runs the whole benchmark suite — 15 benchmarks × 5 languages (NURL, C,
# Rust, Node, Python) — on a fixed `ubuntu-latest` runner and commits the
# result back to the repository:
#
#   bench/results/latest.json   machine-readable; nurlweb's publish step
#                               (tools/gen-bench-table.mjs) renders the
#                               landing page's table straight from it, so
#                               the site's numbers are whatever this
#                               workflow last measured
#   bench/RESULTS.md            the same run for humans, including the
#                               compile-time and correctness tables the
#                               web page deliberately leaves out
#
# The numbers are runner numbers: a shared 2-vCPU VM is slower and noisier
# than a workstation. That is the point — they are reproducible, anyone
# can re-run this workflow on the same spec, and a regression shows up as
# a commit-level diff instead of going unnoticed.
#
# Closes the falsifiability gap flagged in the external critic / TODO
# Tier 1.2: the headline numbers used to come from one specific machine
# with no way for a reader to check them.

on:
  # Source-change runs: any commit on main that touches the benchmark
  # corpus, the compiler or the runtime. Uploads an artifact but does NOT
  # commit results back — that would be a commit storm during active
  # development, and would re-trigger this workflow on every push.
  push:
    branches: [main]
    paths:
      - 'bench/**'
      - 'compiler/**'
      - 'stdlib/**'
      - '.github/workflows/bench.yml'

  # Manual run + weekly drift check both commit the refreshed numbers, so
  # the published table stays fresh even when nothing in the source moved
  # (runner microarchitecture drift, toolchain bumps, noise-floor changes).
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'    # Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # for committing the refreshed results back

jobs:
  bench:
    name: 15 benchmarks × NURL / C / Rust / Node / Python
    runs-on: ubuntu-latest
    # The suite is bounded by its slowest language, not by NURL: several
    # of the u64 kernels take tens of seconds under CPython and Node
    # BigInt. bench.sh keeps that finite by giving a slow cell fewer
    # repetitions (its --budget-ms), but the matrix still needs room.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the results commit can be pushed onto the
          # upstream tip without a rejected non-fast-forward.
          fetch-depth: 0

      - name: Install build deps (clang + FFI libs)
        # Same FFI-lib block as ci.yml so the bootstrap path is identical
        # to a regular build. Node and Python ship in the runner image.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev

      - name: Install Rust (stable, minimal profile)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Record toolchain versions
        run: |
          clang --version | head -1
          rustc --version
          node --version
          python3 --version

      - name: Build nurlc (bootstrap fixed point + runtime.o)
        run: ./build.sh --no-tests

      - name: Run the suite
        env:
          # Both are read by bench.sh and land in the results file, so the
          # published table can say where its numbers came from.
          BENCH_HOST_LABEL: GitHub Actions ubuntu-latest (2-vCPU / 7 GiB)
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # A row whose five implementations disagree makes bench.sh exit
        # non-zero: the timings would be comparing different computations.
        run: ./bench/bench.sh --timeout 300

      - name: Publish the report to the run summary
        # So the numbers are readable in the Actions UI without
        # downloading an artifact or waiting for the site to publish.
        if: always()
        run: |
          if [[ -f bench/RESULTS.md ]]; then
            cat bench/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '`bench/RESULTS.md` was not produced — the run failed before the report stage.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results as a workflow artifact
        # Always uploaded — this is how push-triggered runs surface their
        # numbers without committing them.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_id }}
          path: |
            bench/results/latest.json
            bench/RESULTS.md
          retention-days: 90

      - name: Commit refreshed results
        # Manual / scheduled runs only; see the trigger comment above.
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          if git diff --quiet -- bench/results/latest.json bench/RESULTS.md; then
            echo "results unchanged — nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add bench/results/latest.json bench/RESULTS.md
          git commit -m "bench: refresh measured numbers ($(date -u +%Y-%m-%d))"
          git push
