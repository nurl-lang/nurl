name: release

# Build and publish the NURL toolchain (compiler + package manager +
# stdlib) as relocatable install packages whenever a `v*` tag is pushed.
#
# Targets:
#   - linux-x86_64-glibc   (ubuntu-latest, native)
#   - linux-arm64-glibc    (ubuntu-24.04-arm, native — free for public repos)
#   - windows-x86_64       (windows-latest, native)
#
# Each job assembles the prefix with tools/install-toolchain.{sh,bat}
# (relocatable shims) and packages it. The final `release` job attaches
# every archive + its .sha256 to the GitHub Release. The curl|sh front
# door (tools/get-nurl.sh / .ps1, served from nurl-lang.org) downloads
# these by target triple.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0); for a dry run without a real tag'
        required: true

permissions:
  contents: write    # create releases + upload assets

env:
  NURL_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ── Linux (x86_64 + arm64), native per-arch runners ──────────────────
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64-glibc
            runner: ubuntu-latest
          - target: linux-arm64-glibc
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (clang + FFI libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config \
            libcurl4-openssl-dev libssl-dev libsqlite3-dev \
            libpq-dev zlib1g-dev libzstd-dev
          clang --version

      - name: Build toolchain (nurlc + nurlpkg)
        run: |
          ./build.sh --no-tests
          ./tools/nurlpkg/build.sh

      # Bundle a self-contained zig so the installed toolchain can build
      # programs (and `nurlpkg install`) with no system clang and immune to
      # the box's LLVM version. zig 0.13 ships LLVM 18; keep it >= the clang
      # used above so `zig cc -flto` can read the shipped runtime.o bitcode.
      - name: Fetch bundled zig backend
        run: |
          ZIG_VER=0.13.0
          case "${{ matrix.target }}" in
            linux-x86_64-glibc) ZA=x86_64 ;;
            linux-arm64-glibc)  ZA=aarch64 ;;
            *) echo "no zig mapping for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          url="https://ziglang.org/download/${ZIG_VER}/zig-linux-${ZA}-${ZIG_VER}.tar.xz"
          echo "Downloading $url"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          mkdir -p vendor
          tar -xf /tmp/zig.tar.xz -C vendor
          mv "vendor/zig-linux-${ZA}-${ZIG_VER}" vendor/zig
          vendor/zig/zig version

      # The CI runner's glibc (2.39) is newer than many target boxes (e.g.
      # Raspberry Pi OS bullseye = 2.31), and glibc is not forward-compatible
      # — so a binary built here fails to start there with
      # `GLIBC_2.34 not found`. Relink the shipped nurlc + nurlpkg with the
      # bundled zig against an old glibc floor (zig provides the versioned
      # stubs), so they run on old distros too. Brings the floor to ~2.14.
      - name: Relink toolchain for old-glibc portability
        run: |
          case "${{ matrix.target }}" in
            linux-x86_64-glibc) A=x86_64 ;;
            linux-arm64-glibc)  A=aarch64 ;;
            *) echo "no arch mapping for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          NURL_BUNDLE_ZIG="$PWD/vendor/zig" ./tools/relink-toolchain-portable.sh "$A"

      - name: Assemble relocatable prefix
        run: NURL_HOME="$PWD/dist/nurl" NURL_BUNDLE_ZIG="$PWD/vendor/zig" ./tools/install-toolchain.sh

      - name: Smoke test the assembled toolchain
        run: |
          printf '$ `stdlib/core/io.nu`\n@ main \xe2\x86\x92 i { ( nurl_print `ok\\n` ) ^ 0 }\n' > /tmp/s.nu
          ./dist/nurl/bin/nurl /tmp/s.nu /tmp/s && /tmp/s

      - name: Package
        run: |
          PKG="nurl-${NURL_TAG}-${{ matrix.target }}.tar.gz"
          tar czf "$PKG" -C dist nurl
          sha256sum "$PKG" > "$PKG.sha256"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.PKG }}
            ${{ env.PKG }}.sha256
          if-no-files-found: error

  # ── Windows (native) ─────────────────────────────────────────────────
  # nurlpkg needs zlib (gunzip for registry tarballs). build.bat now wires
  # it up (issue #229) by detecting the vcpkg x64-windows-static install
  # below: it compiles runtime.c with -DNURL_HAVE_ZLIB, drops the
  # stdlib\runtime.z sentinel, and records the link fragment that
  # tools\nurlpkg\build.bat consumes. Still best-effort (continue-on-error)
  # until a `workflow_dispatch` dry run confirms the job is green; once it
  # is, drop continue-on-error here and add `windows` to the release job's
  # `needs`.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/clang
        run: choco install llvm -y --no-progress
        shell: pwsh

      - name: Install zlib + zstd (vcpkg, static)
        shell: pwsh
        # windows-latest ships vcpkg at C:\vcpkg, which build.bat probes.
        # compress.nu (which nurlpkg imports) declares both zlib and zstd
        # FFI, so nurlc needs both build-time sentinels. Static triplet so
        # the produced exes carry no zlib1.dll / zstd.dll dependency.
        run: vcpkg install zlib:x64-windows-static zstd:x64-windows-static

      - name: Build toolchain (nurlc + nurlpkg)
        shell: cmd
        run: |
          call build.bat --no-tests || exit /b 1
          call tools\nurlpkg\build.bat || exit /b 1

      - name: Assemble relocatable prefix
        shell: cmd
        run: |
          set "NURL_HOME=%CD%\dist\nurl"
          call tools\install-toolchain.bat

      - name: Package
        shell: pwsh
        run: |
          $pkg = "nurl-$env:NURL_TAG-windows-x86_64.zip"
          Compress-Archive -Path dist\nurl -DestinationPath $pkg
          (Get-FileHash $pkg -Algorithm SHA256).Hash.ToLower() + "  " + $pkg | Out-File "$pkg.sha256" -Encoding ascii
          "PKG=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            ${{ env.PKG }}
            ${{ env.PKG }}.sha256
          if-no-files-found: error

  # ── Publish the GitHub Release ───────────────────────────────────────
  release:
    # Publish once Linux succeeds; Windows is best-effort (above) and is
    # included automatically when it starts producing an archive.
    needs: [linux]
    runs-on: ubuntu-latest
    # Only publish for a real pushed tag, not a workflow_dispatch dry run.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NURL ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
