name: release

# Build and publish the NURL toolchain (compiler + package manager +
# stdlib) as relocatable install packages whenever a `v*` tag is pushed.
#
# Targets:
#   - linux-x86_64-glibc   (ubuntu-latest, native)
#   - linux-arm64-glibc    (ubuntu-24.04-arm, native — free for public repos)
#   - freebsd-x86_64       (FreeBSD 14.x in a vmactions VM)
#   - windows-x86_64       (windows-latest, native)
#
# Each job assembles the prefix with tools/install-toolchain.{sh,bat}
# (relocatable shims) and packages it. The final `release` job attaches
# every archive + its .sha256 to the GitHub Release. The curl|sh front
# door (tools/get-nurl.sh / .ps1, served from nurl-lang.org) downloads
# these by target triple.
#
# Three ways in, all publishing the same way:
#   - `git push origin vX.Y.Z` (RELEASING.md, the normal path);
#   - a release published in the GitHub UI, which creates the tag on the
#     server. That does not reliably raise a tag `push` event, so v0.77.0
#     came out with no archives at all; the `release: published` trigger
#     builds and attaches them to the release that was just made;
#   - workflow_dispatch with `publish` ticked: builds the EXISTING tag
#     `tag` (not the dispatching branch) and attaches the archives to its
#     release, creating it if needed. That is the repair for a release
#     that is missing assets. Without `publish` it stays a dry run that
#     builds the dispatching branch and uploads nothing.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0). With publish: an existing tag. Without: only names the dry-run archives.'
        required: true
      publish:
        description: 'Build the tag itself and attach the archives to its GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write    # create releases + upload assets

env:
  NURL_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  # What the build jobs check out: the tag for a publishing dispatch, else
  # the event's own commit (the tag for a push or release event, the
  # dispatching branch for a dry run).
  BUILD_REF: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) && format('refs/tags/{0}', inputs.tag) || github.sha }}

# A UI-made release can raise both `release` and a tag `push`: one run per
# tag at a time, the second one re-uploads over the first.
concurrency:
  group: release-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Gate: the tagged commit must already have green ci.yml and macos-tests.yml
  # Branch protection keeps `main` green, so a tag on a merged main commit
  # passes the ci.yml half. That half exists to catch a tag pushed to a
  # NON-main / untested SHA. It does NOT re-run the suite (that would be
  # redundant — ci.yml runs on every push/PR); it WAITS for the tagged
  # commit's runs to conclude and then requires success, because a tag is
  # normally pushed while those runs are still in flight. Skipped on
  # workflow_dispatch dry runs (they don't publish anyway). The commit
  # checked is the one the TAG names, resolved through the API, so a
  # publishing dispatch from `main` gates on the tag's commit and not on
  # main's head.
  #
  # macos-tests.yml is part of the gate (Agora #213). Pull requests run it
  # only when labelled `ci:macos`, because the macOS pool is often empty.
  # The release is where macOS is not optional: macOS ARM64 is tier 1 in
  # docs/PLATFORMS.md, and an archive-less platform is still a claim users
  # rely on. Its push run on the release commit has to finish green, or a
  # dispatched run on the tag (Actions → macos-tests → Run workflow → the
  # tag), before anything is published.
  verify-ci:
    name: verify tagged commit passed CI (ci + macOS)
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      # A tag ships what its CHANGELOG section says. A fragment still in
      # changes/unreleased/ at the tagged commit landed after the release PR
      # folded the others: it is in the tag but in no section of the log.
      # With the merge queue, a PR queued ahead of the release PR lands
      # first, and in 0.83.0 two did. Fold it into [X.Y.Z] and tag that
      # commit instead.
      - name: Check out the changelog
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            changes
            docs
            tools/fuzz/holes
      - name: Every change in the tag is in its CHANGELOG section, every open hole in LIMITATIONS
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          left="$(find changes/unreleased -name '*.md' ! -name README.md | sort)"
          if [ -n "$left" ]; then
            echo "::error::fragments not folded into [$v]: $(echo $left). Fold them (tools/changelog.py) and tag that commit."
            exit 1
          fi
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$v] section"; exit 1; }
          # The open-hole list in docs/LIMITATIONS.md is what
          # tools/fuzz/holes/open/t*.md say: no hole a release ships with goes
          # unlisted, and none closed is still listed.
          python3 tools/fuzz/holes/open_list.py --check
          # formal/RULES.md's change table is what formal/rules/t*.md say:
          # every ownership change the release ships has its row.
          python3 tools/formal_rules.py --check
      - name: Require successful ci.yml and macos-tests.yml runs for this SHA
        uses: actions/github-script@v7
        with:
          # A tag is normally pushed seconds after the release PR merges, so
          # the merge commit's runs are still QUEUED or RUNNING (and may not
          # even be listed yet) when this job starts. A single instantaneous
          # look therefore fails the gate on a race and skips the whole
          # release — which is exactly what happened to v0.13.0. Wait for
          # each workflow to reach a conclusion instead, then demand
          # success: the safety property (never publish an unverified
          # commit) is unchanged, only the impatience is gone.
          script: |
            const tag = process.env.NURL_TAG;
            if (!/^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$/.test(tag)) {
              core.setFailed(`'${tag}' is not a release tag (vX.Y.Z).`);
              return;
            }
            let ref;
            try {
              ({ data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: `tags/${tag}` }));
            } catch (e) {
              core.setFailed(`tag ${tag} does not exist: push it first.`);
              return;
            }
            let sha = ref.object.sha;
            if (ref.object.type === 'tag') {   // annotated: peel to the commit
              const { data: t } = await github.rest.git.getTag({
                owner: context.repo.owner, repo: context.repo.repo, tag_sha: sha });
              sha = t.object.sha;
            }
            core.info(`${tag} -> ${sha}`);
            // ci.yml takes ~40 min. macos-tests.yml has a 90 min job and
            // may queue for a runner first.
            const GATES = [
              { wf: 'ci.yml', deadline_min: 75 },
              { wf: 'macos-tests.yml', deadline_min: 150,
                again: `Run it on the tag (Actions → macos-tests → Run workflow → ` +
                       `${tag}) and re-run this job.` },
            ];
            const POLL_MS = 30 * 1000;
            const started = Date.now();
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const open = new Set(GATES.map(g => g.wf));

            while (open.size > 0) {
              const waited = Date.now() - started;
              for (const g of GATES) {
                if (!open.has(g.wf)) continue;
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: g.wf,
                  head_sha: sha,
                  per_page: 100,
                });
                if (runs.some(r => r.conclusion === 'success')) {
                  core.info(`${g.wf} is green for ${sha}.`);
                  open.delete(g.wf);
                  continue;
                }
                const pending = runs.filter(
                  r => r.status === 'queued' || r.status === 'in_progress');
                const seen = runs.map(r => r.status + '/' + r.conclusion).join(', ') || 'none';

                // Nothing running and nothing green: if a run has already
                // concluded non-success, fail now rather than burning the
                // deadline. A cancelled macOS run usually never got a
                // runner, so say how to get one. An empty list this early
                // is just the API not having indexed the push yet.
                if (pending.length === 0 && runs.length > 0) {
                  core.setFailed(
                    `${g.wf} did not pass for ${sha} (runs: ${seen}). ` +
                    (g.again || `Tag a commit whose CI is green.`));
                  return;
                }
                if (waited > g.deadline_min * 60 * 1000) {
                  core.setFailed(
                    `Timed out after ${Math.round(waited / 60000)} min waiting ` +
                    `for a ${g.wf} run for ${sha}. Runs seen: ${seen}. ` +
                    (g.again || ''));
                  return;
                }
                core.info(
                  `waiting for ${g.wf} on ${sha} — ${pending.length} run(s) ` +
                  `pending, ${Math.round(waited / 1000)}s elapsed…`);
              }
              if (open.size > 0) await sleep(POLL_MS);
            }
            core.info(`ci.yml and macos-tests.yml are green for ${sha} — proceeding.`);

  # ── Linux (x86_64 + arm64), native per-arch runners ──────────────────
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64-glibc
            runner: ubuntu-latest
          - target: linux-arm64-glibc
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Install build deps (clang + FFI libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config \
            libcurl4-openssl-dev libssl-dev libsqlite3-dev \
            libpq-dev zlib1g-dev libzstd-dev
          clang --version

      - name: Build toolchain (nurlc + nurlpkg)
        run: |
          ./build.sh --no-tests
          ./tools/nurlpkg/build.sh

      # Bundle a self-contained zig so the installed toolchain can build
      # programs (and `nurlpkg install`) with no system clang and immune to
      # the box's LLVM version. zig 0.16 ships LLVM 21; keep it >= the clang
      # used above so `zig cc -flto` can read the shipped runtime.o bitcode.
      - name: Fetch bundled zig backend
        # Pinned by VERSION and by CONTENT. This archive is unpacked into the
        # published release, so whatever it contains is what users install:
        # a version-pinned URL alone trusts whatever those bytes are on the
        # day the release runs. The two digests are ziglang.org's own, from
        # https://ziglang.org/download/index.json for 0.16.0. Bumping ZIG_VER
        # without bumping them fails the build, which is the point.
        run: |
          ZIG_VER=0.16.0
          case "${{ matrix.target }}" in
            linux-x86_64-glibc)
              ZA=x86_64
              ZIG_SHA=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 ;;
            linux-arm64-glibc)
              ZA=aarch64
              ZIG_SHA=ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17 ;;
            *) echo "no zig mapping for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          url="https://ziglang.org/download/${ZIG_VER}/zig-${ZA}-linux-${ZIG_VER}.tar.xz"
          echo "Downloading $url"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "$ZIG_SHA  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p vendor
          tar -xf /tmp/zig.tar.xz -C vendor
          mv "vendor/zig-${ZA}-linux-${ZIG_VER}" vendor/zig
          vendor/zig/zig version

      # The CI runner's glibc (2.39) is newer than many target boxes (e.g.
      # Raspberry Pi OS bullseye = 2.31), and glibc is not forward-compatible
      # — so a binary built here fails to start there with
      # `GLIBC_2.34 not found`. Relink the shipped nurlc + nurlpkg with the
      # bundled zig against an old glibc floor (zig provides the versioned
      # stubs), so they run on old distros too. Brings the floor to ~2.14.
      - name: Relink toolchain for old-glibc portability
        run: |
          case "${{ matrix.target }}" in
            linux-x86_64-glibc) A=x86_64 ;;
            linux-arm64-glibc)  A=aarch64 ;;
            *) echo "no arch mapping for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          NURL_BUNDLE_ZIG="$PWD/vendor/zig" ./tools/relink-toolchain-portable.sh "$A"

      - name: Assemble relocatable prefix
        run: NURL_HOME="$PWD/dist/nurl" NURL_BUNDLE_ZIG="$PWD/vendor/zig" ./tools/install-toolchain.sh

      - name: Smoke test the assembled toolchain
        run: |
          printf '$ `stdlib/core/io.nu`\n@ main \xe2\x86\x92 i { ( nurl_print `ok\\n` ) ^ 0 }\n' > /tmp/s.nu
          ./dist/nurl/bin/nurl /tmp/s.nu /tmp/s && /tmp/s

      - name: Package
        run: |
          PKG="nurl-${NURL_TAG}-${{ matrix.target }}.tar.gz"
          tar czf "$PKG" -C dist nurl
          sha256sum "$PKG" > "$PKG.sha256"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.PKG }}
            ${{ env.PKG }}.sha256
          if-no-files-found: error

  # ── FreeBSD (x86_64, in a VM) ────────────────────────────────────────
  # GitHub has no native FreeBSD runner, so build the toolchain inside a
  # real FreeBSD VM (same vmactions harness the CI freebsd job uses, now
  # proven green). FreeBSD base ships clang, openssl and zlib, so:
  #   * no bundled zig — install-toolchain.sh falls back to the base clang,
  #     which is exactly what `nurlpkg install <tool>` needs on the target;
  #   * no old-glibc relink — that is a glibc-only portability hack.
  # We add bash (build.sh), pkgconf and sqlite3 (lights up the SQLite FFI
  # sentinel). The shipped nurlc/nurlpkg stay libc-only via -Wl,--as-needed,
  # so the archive runs on any FreeBSD 14.x box; the get-nurl.sh smoke test
  # asserts that on install. Best-effort (continue-on-error) until a
  # workflow_dispatch dry run confirms the job is green; then drop it and
  # add `freebsd` to the release job's `needs`.
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Build + assemble + package toolchain on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          # The bootstrap self-compile (nurlc compiling nurlc.nu) is the
          # memory peak: it holds the whole 18k-line unit's IR + symbol
          # tables resident, and the peak grows with the compiler. Measured
          # ~13.2 GB RSS at this size (up from ~9.5 GB when this job was
          # added), so give the guest 14 GB and leave ~2 GB of the 16 GB
          # runner for the host + KVM. Raise this in step with the peak
          # rather than living 35 MB from the edge — this is exactly what
          # dropped the FreeBSD tarball from the v0.11.1 release (the leg
          # OOM'd at 13312 while ci.yml had already been bumped). KVM keeps
          # the guest near-native speed.
          mem: 14336
          cpu: 3
          # Forward the tag so the archive is named to match the others.
          envs: 'NURL_TAG'
          prepare: |
            pkg install -y bash pkgconf sqlite3
          run: |
            set -e
            clang --version
            ./build.sh --no-tests
            ./tools/nurlpkg/build.sh
            NURL_HOME="$PWD/dist/nurl" ./tools/install-toolchain.sh
            # Smoke: the assembled toolchain must build + run a trivial program.
            printf '$ `stdlib/core/io.nu`\n@ main \xe2\x86\x92 i { ( nurl_print `ok\\n` ) ^ 0 }\n' > /tmp/s.nu
            ./dist/nurl/bin/nurl /tmp/s.nu /tmp/s && /tmp/s
            PKG="nurl-${NURL_TAG}-freebsd-x86_64.tar.gz"
            tar czf "$PKG" -C dist nurl
            # FreeBSD base has `sha256 -q` (no coreutils sha256sum). get-nurl.sh
            # reads only field 1, but write the standard "<hash>  <file>" form.
            printf '%s  %s\n' "$(sha256 -q "$PKG")" "$PKG" > "$PKG.sha256"

      # The VM step rsyncs the workspace back to the host, so the archive
      # produced inside the guest is now present here for upload.
      - name: Resolve package name
        run: echo "PKG=nurl-${NURL_TAG}-freebsd-x86_64.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-x86_64
          path: |
            ${{ env.PKG }}
            ${{ env.PKG }}.sha256
          if-no-files-found: error

  # ── Windows (native) ─────────────────────────────────────────────────
  # nurlpkg needs zlib (gunzip for registry tarballs). build.bat now wires
  # it up (issue #229) by detecting the vcpkg x64-windows-static install
  # below: it compiles runtime.c with -DNURL_HAVE_ZLIB, drops the
  # stdlib\runtime.z sentinel, and records the link fragment that
  # tools\nurlpkg\build.bat consumes. A `workflow_dispatch` dry run on
  # branch fix/windows-zlib-lib-resolve (run 28044986105) is green — the
  # vcpkg zlib 1.3.2 static lib is `zs.lib`, now resolved by build.bat's
  # lib-name probe — so this job is no longer best-effort: a Windows break
  # now fails the run instead of being silently swallowed.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Install LLVM/clang
        run: choco install llvm -y --no-progress
        shell: pwsh

      - name: Install zlib + zstd (vcpkg, static)
        shell: pwsh
        # windows-latest ships vcpkg at C:\vcpkg, which build.bat probes.
        # compress.nu (which nurlpkg imports) declares both zlib and zstd
        # FFI, so nurlc needs both build-time sentinels. Static triplet so
        # the produced exes carry no zlib1.dll / zstd.dll dependency.
        run: vcpkg install zlib:x64-windows-static zstd:x64-windows-static

      # Bundle a self-contained zig, mirroring the Linux jobs. Windows
      # installs otherwise depend on a system LLVM for native builds, and
      # the wasmbuilder package needs zig's wasi-libc + wasm-ld for local
      # wasm32-wasi builds — bundling makes `nurlpkg install wasmbuilder`
      # work on a blank machine with no extra downloads.
      #
      # Fetched BEFORE the build: build.bat emits the MinGW-ABI
      # stdlib\runtime.mingw.o only when it can see a zig, and that
      # object is what the bundled zig links user programs against.
      # Without it the archive ships a zig that cannot link anything,
      # and the smoke test below would not catch it — this runner has
      # LLVM installed, so nurl.bat would quietly fall back to clang.
      - name: Fetch bundled zig backend
        shell: pwsh
        run: |
          $zigVer = "0.16.0"
          $url = "https://ziglang.org/download/$zigVer/zig-x86_64-windows-$zigVer.zip"
          Invoke-WebRequest $url -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath vendor
          Move-Item "vendor/zig-x86_64-windows-$zigVer" vendor/zig
          & vendor/zig/zig.exe version

      - name: Build toolchain (nurlc + nurlpkg)
        shell: cmd
        run: |
          call build.bat --no-tests || exit /b 1
          call tools\nurlpkg\build.bat || exit /b 1

      - name: Assemble relocatable prefix
        shell: cmd
        run: |
          set "NURL_HOME=%CD%\dist\nurl"
          set "NURL_BUNDLE_ZIG=%CD%\vendor\zig"
          call tools\install-toolchain.bat

      # The Linux legs smoke-test the assembled prefix; Windows never did,
      # which is how nurl.bat came to ship without ever using the zig it
      # bundles — every native build needed a system LLVM, and nothing
      # noticed because CI installs one. Build and RUN a program with the
      # assembled toolchain, from a directory whose name contains a space
      # so a quoting regression in the driver fails here rather than on a
      # user's machine.
      - name: Smoke test the assembled toolchain
        shell: pwsh
        run: |
          # A directory with a space in the name on purpose: the driver
          # builds its compiler command by string concatenation, and an
          # install path like C:\Users\First Last\.nurl\ is the normal
          # case, not the exotic one.
          $dir = "dist\smoke dir"
          New-Item -ItemType Directory -Path $dir | Out-Null
          # single-quoted here-string: NURL uses backticks for strings and
          # PowerShell would otherwise eat them as escapes
          $src = @'
          $ `stdlib/core/io.nu`
          @ main → i { ( nurl_print `ok` ) ^ 0 }
          '@
          ($src -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n" |
            Set-Content -Path "$dir\s.nu" -Encoding utf8NoBOM
          # The archive must carry the MinGW-ABI runtime, or the zig it
          # bundles cannot link a thing. Assert it directly: this runner
          # has LLVM, so nurl.bat would otherwise fall back to clang and
          # the smoke test would pass while shipping a broken zig path.
          if (-not (Test-Path "dist\nurl\stdlib\runtime.mingw.o")) {
            throw "archive has no stdlib\runtime.mingw.o — the bundled zig cannot link"
          }
          # Build BOTH ways from the assembled prefix: bundled zig (what a
          # machine without LLVM gets) and clang (what one with it gets).
          # They link different runtime objects, so a break in one says
          # nothing about the other.
          foreach ($mode in @("zig", "clang")) {
            if ($mode -eq "zig") { $env:NURL_ZIG = "$PWD\dist\nurl\zig\zig.exe" }
            else                 { $env:NURL_ZIG = "$PWD\does-not-exist.exe" }
            Remove-Item "$dir\s.exe" -ErrorAction SilentlyContinue
            & cmd /c "call dist\nurl\bin\nurl.bat `"$dir\s.nu`" `"$dir\s`""
            if ($LASTEXITCODE -ne 0) { throw "$mode : nurl.bat failed" }
            $out = & "$dir\s.exe"
            if ($LASTEXITCODE -ne 0) { throw "$mode : the built program failed" }
            if ($out -ne "ok") { throw "$mode : unexpected output: $out" }
            Write-Host "$mode OK"
          }

      - name: Package
        shell: pwsh
        run: |
          $pkg = "nurl-$env:NURL_TAG-windows-x86_64.zip"
          Compress-Archive -Path dist\nurl -DestinationPath $pkg
          (Get-FileHash $pkg -Algorithm SHA256).Hash.ToLower() + "  " + $pkg | Out-File "$pkg.sha256" -Encoding ascii
          "PKG=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            ${{ env.PKG }}
            ${{ env.PKG }}.sha256
          if-no-files-found: error

  # ── Publish the GitHub Release ───────────────────────────────────────
  release:
    # WAIT for every build job (incl. the slow FreeBSD VM and the Windows
    # native job) before publishing — listing only `linux` here previously let
    # this job race ahead and publish before the FreeBSD artifact was uploaded,
    # so the freebsd archive was silently dropped from the release. With all
    # three in `needs` + the `if` below, release runs after they all COMPLETE,
    # then attaches whatever each produced via the artifact glob.
    needs: [verify-ci, linux, freebsd, windows]
    runs-on: ubuntu-latest
    # verify-ci gates publishing on the tagged commit's CI being green; linux
    # gates on the primary artifact building. freebsd stays best-effort
    # (continue-on-error) and windows is a required-to-build job (its failure
    # reds the run) but neither is a hard publish gate — don't require their
    # `result`, just that they finished. `!cancelled()` lets us publish after a
    # best-effort job fails; still only for a real pushed tag, not a
    # workflow_dispatch dry run.
    # verify-ci runs only for a tag event or a publishing dispatch, so its
    # success is what says "this run publishes".
    if: ${{ !cancelled() && needs.verify-ci.result == 'success' && needs.linux.result == 'success' }}
    steps:
      # Checkout FIRST: actions/checkout cleans the workspace, which would
      # delete the downloaded artifacts if it ran after them. The release
      # job needs the tree for tools/check_release_artifacts.sh.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Sign archives with minisign
        # Detached minisign signatures over every archive, so `minisign -V` (or
        # nurl's pure-NURL verifier) can confirm a download came from the real
        # release key — not just that it matches a checksum served alongside it.
        # The passwordless secret key lives only in the MINISIGN_SECRET_KEY
        # secret. If the secret is unset (e.g. a fork), skip signing rather than
        # fail the release.
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "MINISIGN_SECRET_KEY not set — skipping signing." >&2
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          trap 'shred -u "$RUNNER_TEMP/minisign.key" 2>/dev/null || rm -f "$RUNNER_TEMP/minisign.key"' EXIT
          for f in artifacts/*.tar.gz artifacts/*.zip; do
            [ -e "$f" ] || continue
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f" \
              -c "nurl release $NURL_TAG" -t "nurl $NURL_TAG"
            echo "signed $f -> $f.minisig"
          done
          echo "RELEASE_SIGNED=1" >> "$GITHUB_ENV"

      - name: Verify the artifact set
        # The publish step attaches whatever the build jobs produced,
        # through a glob. RELEASING.md names four targets and calls
        # exactly one — FreeBSD — best-effort, so a Windows leg that
        # failed used to publish a release with no .zip and the one-line
        # PowerShell installer then 404s for that version. Fail here
        # instead, before anything is published, and check that every
        # archive carries the checksum (and signature) the installers
        # verify fail-closed.
        run: |
          ./tools/check_release_artifacts.sh artifacts "$NURL_TAG" \
            ${RELEASE_SIGNED:+--signed}

      - name: Publish release
        # An existing release for the tag (one made in the UI, or a repair
        # dispatch) is updated in place: its notes are kept, the title is
        # normalised to "NURL vX.Y.Z", the archives are attached, and a
        # same-named asset is replaced.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NURL_TAG }}
          name: NURL ${{ env.NURL_TAG }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.minisig
