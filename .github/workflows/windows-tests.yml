name: windows-tests

# Runs the FULL Windows path — build.bat bootstrap fixed point + the
# per-test golden corpus (compiler/tests/run_tests.ps1 against
# outputs-windows/) — on a real windows-latest runner.
#
# This is what backs docs/PLATFORMS.md's Windows tier: without this
# workflow the 447 Windows goldens were exercised only on a developer's
# machine. Runs on pushes to main (not per-PR: the Windows leg is the
# slowest runner and PRs are already gated by the Linux+FreeBSD corpus;
# a main breakage surfaces here within one push) and on demand.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_goldens:
        description: >-
          Regenerate compiler/tests/outputs-windows/ goldens on the runner
          (run_tests.ps1 -Update) and upload them as an artifact instead of
          gating. Download the artifact, review the diff, commit.
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM/clang
        # windows-latest ships a clang via Visual Studio, but pin the
        # LLVM one on PATH explicitly so build.bat's probe is stable.
        run: choco install llvm --no-progress -y
        shell: cmd

      # ── The DRIVER, which nothing else on Windows exercises ────────
      # Fetched BEFORE build.bat on purpose: build.bat only emits the
      # MinGW-ABI stdlib\runtime.mingw.o when it can see a zig, and
      # without that object nurl.bat falls back to clang and the whole
      # bundled-zig path silently goes untested — which is how it
      # reached a release with three undefined CRT symbols in it.
      # build.bat compiles the toolchain with clang; nurl.bat is what a
      # USER runs to build a program, and it was never under test here.
      # That is how it came to ship looking only for a system clang while
      # the archive bundled a zig it never used — CI installs LLVM, so the
      # clang path always worked. Fetch a zig and drive nurl.bat both
      # ways, from a directory whose name contains a space (the normal
      # install path is C:\Users\First Last\.nurl\).
      - name: Fetch zig (to exercise the bundled-compiler path)
        if: ${{ !inputs.update_goldens }}
        shell: pwsh
        run: |
          $zigVer = "0.13.0"
          $url = "https://ziglang.org/download/$zigVer/zig-windows-x86_64-$zigVer.zip"
          Invoke-WebRequest $url -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath vendor
          Move-Item "vendor/zig-windows-x86_64-$zigVer" vendor/zig

      - name: build.bat (bootstrap fixed point + Windows golden corpus)
        # pwsh 7 is preinstalled on windows-latest, so build.bat runs
        # run_tests.ps1; a missing pwsh now exits non-zero by design.
        if: ${{ !inputs.update_goldens }}
        run: call build.bat
        shell: cmd

      - name: nurl.bat builds and runs a program (zig, then clang)
        if: ${{ !inputs.update_goldens }}
        shell: pwsh
        run: |
          $dir = "smoke dir"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          # single-quoted here-string: NURL uses backticks for strings and
          # PowerShell would otherwise eat them as escapes
          # The import list is the REGRESSION: v0.27.0 shipped a
          # runtime.mingw.o that could not link std/net or ext/http
          # (clock_gettime / nanosleep / readlink and friends lived in
          # the MSVC-only compat tier), and a core/io-only smoke was
          # blind to it. Import the wide surface and call now_ms so the
          # clock path also RUNS on both ABIs.
          $src = @'
          $ `stdlib/core/io.nu`
          $ `stdlib/core/string.nu`
          $ `stdlib/core/vec.nu`
          $ `stdlib/std/time.nu`
          $ `stdlib/std/fs.nu`
          $ `stdlib/std/net.nu`
          $ `stdlib/std/process.nu`
          $ `stdlib/std/term.nu`
          $ `stdlib/std/path.nu`
          $ `stdlib/ext/http.nu`
          $ `stdlib/ext/env.nu`
          @ main → i {
          ? > ( now_ms ) 0 { ( nurl_print `ok` ) } { ( nurl_print `bad-clock` ) }
          ^ 0
          }
          '@
          ($src -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n" |
            Set-Content -Path "$dir\s.nu" -Encoding utf8NoBOM
          foreach ($mode in @("zig", "clang")) {
            if ($mode -eq "zig") { $env:NURL_ZIG = "$PWD\vendor\zig\zig.exe" }
            else                 { $env:NURL_ZIG = "$PWD\does-not-exist.exe" }
            Remove-Item "$dir\s.exe" -ErrorAction SilentlyContinue
            & cmd /c "call nurl.bat `"$dir\s.nu`" `"$dir\s`""
            if ($LASTEXITCODE -ne 0) { throw "$mode : nurl.bat failed" }
            $out = & "$dir\s.exe"
            if ($LASTEXITCODE -ne 0) { throw "$mode : the built program failed" }
            if ($out -ne "ok") { throw "$mode : unexpected output: $out" }
            Write-Host "$mode OK"
          }

      # ── Golden regeneration mode (workflow_dispatch only) ──────────
      # The Windows goldens can only be produced on Windows; this runner
      # IS the canonical environment. Build without tests, then rewrite
      # every golden and publish the tree for review + commit.
      - name: build.bat --no-tests (golden update mode)
        if: ${{ inputs.update_goldens }}
        run: call build.bat --no-tests
        shell: cmd

      - name: Regenerate Windows goldens
        if: ${{ inputs.update_goldens }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File compiler/tests/run_tests.ps1 -Update
        shell: cmd

      - name: Upload regenerated goldens
        if: ${{ inputs.update_goldens }}
        uses: actions/upload-artifact@v4
        with:
          name: outputs-windows
          path: compiler/tests/outputs-windows/
          if-no-files-found: error
