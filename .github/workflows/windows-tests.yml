name: windows-tests

# Runs the FULL Windows path — build.bat bootstrap fixed point + the
# per-test golden corpus (compiler/tests/run_tests.ps1 against
# outputs-windows/) — on a real windows-latest runner.
#
# This is what backs docs/PLATFORMS.md's Windows tier: without this
# workflow the 447 Windows goldens were exercised only on a developer's
# machine. Runs on pushes to main (not per-PR: the Windows leg is the
# slowest runner and PRs are already gated by the Linux+FreeBSD corpus;
# a main breakage surfaces here within one push) and on demand.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_goldens:
        description: >-
          Regenerate compiler/tests/outputs-windows/ goldens on the runner
          (run_tests.ps1 -Update) and upload them as an artifact instead of
          gating. Download the artifact, review the diff, commit.
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM/clang
        # windows-latest ships a clang via Visual Studio, but pin the
        # LLVM one on PATH explicitly so build.bat's probe is stable.
        run: choco install llvm --no-progress -y
        shell: cmd

      - name: build.bat (bootstrap fixed point + Windows golden corpus)
        # pwsh 7 is preinstalled on windows-latest, so build.bat runs
        # run_tests.ps1; a missing pwsh now exits non-zero by design.
        if: ${{ !inputs.update_goldens }}
        run: call build.bat
        shell: cmd

      # ── Golden regeneration mode (workflow_dispatch only) ──────────
      # The Windows goldens can only be produced on Windows; this runner
      # IS the canonical environment. Build without tests, then rewrite
      # every golden and publish the tree for review + commit.
      - name: build.bat --no-tests (golden update mode)
        if: ${{ inputs.update_goldens }}
        run: call build.bat --no-tests
        shell: cmd

      - name: Regenerate Windows goldens
        if: ${{ inputs.update_goldens }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File compiler/tests/run_tests.ps1 -Update
        shell: cmd

      - name: Upload regenerated goldens
        if: ${{ inputs.update_goldens }}
        uses: actions/upload-artifact@v4
        with:
          name: outputs-windows
          path: compiler/tests/outputs-windows/
          if-no-files-found: error
