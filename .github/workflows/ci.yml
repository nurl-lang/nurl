name: ci

# Closes ROADMAP §6 / IMPROVEMENTS.md Tier D #2 (critic v0.9.0).
# The local gate (./build.sh + run_san_tests.sh) has been the pre-1.0
# review tool; this workflow lifts it to PR-level so every branch tip
# is exercised on Ubuntu out of the box.

on:
  push:
    branches: [main, Improvements]
  pull_request:
    branches: [main]
  # The merge queue (Agora #136): main's ruleset can require the queue,
  # which tests main + the queued PRs together and merges exactly the
  # commit it tested. The required checks (build + corpus, FreeBSD,
  # ASan + UBSan) all live in this workflow, so this is the only
  # workflow that has to answer a merge_group event. A group always runs
  # everything (see `changes`).
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Cancel an older in-flight run when a new commit lands on the same ref.
# On main a run is never cancelled part-way (Agora #251): 20 of 35 main
# runs used to be cancelled by the next merge, a quarter of all ci.yml
# job-minutes thrown away, and the commit left untested. A main run that
# is in progress finishes; GitHub keeps only the newest pending one behind
# it. A PR's older run is still cancelled by its next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: classify changed paths
    runs-on: ubuntu-latest
    # In the merge queue, every class runs. A group is several PRs on top
    # of a main that moved since they were tested, so the queue is no
    # place to save minutes by path: running too much is always correct
    # there, and running too little is not.
    #
    # On a push to main, nothing runs when the merge queue already tested
    # the commit. The queue lands exactly the commit its merge_group run
    # tested (same sha), so a second full run of it is pure cost: it used
    # a third of ci.yml's runner time and held slots of the 20-job limit
    # that queued PRs waited for. release.yml's verify-ci accepts the
    # merge_group run, since it looks up ci.yml runs by sha. A push that did not come
    # through the queue (none should) still runs everything.
    permissions:
      contents: read
      pull-requests: read
      actions: write
    outputs:
      code: ${{ github.event_name == 'merge_group' && 'true' || steps.queued.outputs.tested == 'true' && 'false' || steps.code.outputs.code }}
      webdocs: ${{ github.event_name == 'merge_group' && 'true' || steps.queued.outputs.tested == 'true' && 'false' || steps.filter.outputs.webdocs }}
      compiler: ${{ github.event_name == 'merge_group' && 'true' || steps.queued.outputs.tested == 'true' && 'false' || steps.filter.outputs.compiler }}
      # The platform and sanitizer jobs (FreeBSD, ASan/UBSan, the
      # sanitizer corpus, the three unikernel jobs) take 88 of a PR run's
      # 123 job-minutes. The merge queue runs them anyway, on the combined
      # commit that lands, so a PR runs them only when labelled `ci:full`
      # (add the label, then push). A PR's own run keeps the build, the
      # corpus and the gates: the fast signal, about 35 job-minutes. A
      # skipped required check counts as passed, so the PR can still join
      # the queue. Pushes and the queue always run everything.
      full: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    steps:
      # The merge queue rebuilds its groups whenever one fails or main moves,
      # and deletes the old group branches. Their ci.yml runs go on,
      # though: each is a full run (~123 job-minutes) whose result nothing
      # reads, and it holds slots of the 20-job limit that the new groups
      # wait for. On 2026-10-31, three to five of them were running at once
      # after every rebuild. A new group's run cancels the queue runs whose
      # branch is gone: only a 404 for the branch counts, so an API error
      # cancels nothing.
      - name: Cancel queue runs whose group the queue dropped
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          for s in queued in_progress; do
            gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&status=$s&per_page=100" \
              --jq '.workflow_runs[] | "\(.id) \(.head_branch)"' || true
          done | while read -r id ref; do
            [ "$id" = "$SELF" ] && continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/git/ref/heads/$ref" || echo 000)"
            if [ "$code" = 404 ]; then
              echo "::notice::cancelled run $id: its queue group $ref is gone"
              gh api -X POST "repos/$REPO/actions/runs/$id/cancel" --silent || true
            fi
          done
      - name: Did the merge queue already test this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?event=merge_group&head_sha=${{ github.sha }}" --jq '.total_count' 2>/dev/null || echo 0)"
          if [ "${n:-0}" -gt 0 ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "::notice::the merge queue tested ${{ github.sha }} (ci.yml merge_group run); this push runs nothing"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        uses: actions/checkout@v4
      # Docs-only PRs (webdocs/**) skip the compiler jobs below and run
      # webdocs-build instead. The skip is an `if:` on each job rather than
      # workflow-level `paths-ignore` because skipped jobs still satisfy
      # branch-protection required checks (freebsd is required), while a
      # path-filtered workflow that never starts would leave a docs-only PR
      # blocked forever. A PR touching both classes runs everything.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'merge_group'
        with:
          filters: |
            webdocs:
              - 'webdocs/**'
              - 'bench/results/latest.json'
              - 'tools/get-nurl.sh'
              - 'tools/get-nurl.ps1'
              - 'tools/gen-site-facts.sh'
              - 'tools/gen-bench-table.mjs'
              - 'tools/gen-contributors.mjs'
              - '.github/workflows/webdocs-deploy.yml'
            # The self-compile leak gate (in the sanitizers job) runs when
            # the compiler source itself changes — that is what owns the
            # allocations it is asserting about — or when the gate script
            # changes, so a change to the gate is exercised by its own PR.
            compiler:
              - 'compiler/nurlc.nu'
              - 'compiler/nurlc_lastgood.*'
              - 'stdlib/runtime*.c'
              - 'tools/leakgate.sh'
              - 'tools/tests/test_compiler_cleanup.py'
              - 'tools/tests/test_string_argument_ownership.py'
              - 'tools/tests/test_arithmetic_safety.py'
              - 'compiler/tests/enum_tree_drop.nu'
              - 'compiler/tests/nested_field_store.nu'
      # `code` is everything outside the webdocs paths, outside formal/
      # (the memory-model proof, which nothing is compiled from) and
      # other than CHANGELOG.md: a PR whose only change is the changelog
      # (resolving one of its frequent conflicts with main, or wording
      # an entry) builds and tests nothing, so it skips the compiler
      # jobs as a docs-only PR does. A merge of main into a PR still runs
      # them when the PR changes code, since the paths are measured
      # against the PR's base, not the previous push. It is
      # its own step because a list of negations needs
      # predicate-quantifier `every` — under the default `some` a file
      # matches when it escapes ANY one exclusion, so every change counted
      # as code — and the quantifier would turn the positive lists above
      # into "matches all of them".
      - uses: dorny/paths-filter@v3
        id: code
        if: github.event_name != 'merge_group'
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!webdocs/**'
              - '!bench/results/latest.json'
              - '!tools/get-nurl.sh'
              - '!tools/get-nurl.ps1'
              - '!tools/gen-site-facts.sh'
              - '!tools/gen-bench-table.mjs'
              - '!tools/gen-contributors.mjs'
              - '!.github/workflows/webdocs-deploy.yml'
              - '!formal/**'
              - '!CHANGELOG.md'
              - '!changes/**'

  # Files every pull request used to edit by hand, and so conflict over
  # (Agora #211, #212): the hole-probe table and the changelog. Both are
  # now generated from per-change files. This job fails a PR that edits
  # them by hand or leaves them stale. It needs no toolchain and runs in
  # seconds, so it runs on every event, docs-only PRs included.
  shared-files:
    name: shared files are generated (map.tsv, changelog fragments)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: formal/corpus/map.tsv matches the probes' `// map:` lines
        run: python3 tools/fuzz/holes/map.py --check
      - name: changelog fragments are well formed; [Unreleased] holds none
        run: python3 tools/changelog.py check
      - name: formal/BLUEPRINT.md's counts, module DAG and index are the sources'
        run: node webdocs/scripts/gen-formal-data.mjs --check

  runner-controls:
    name: compiler runner fault-injection controls
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Editor launcher controls
        run: node tools/tests/test_vscode_launcher.cjs
      - name: Playground and demo scripts parse
        # A syntax error in nurlapi/static/index.html stops the whole
        # playground script: no examples, status stuck on "checking...".
        run: python3 tools/check_static_js.py
      - name: POSIX and PowerShell runner controls
        shell: bash
        run: |
          NURL_TEST_PWSH=$(command -v pwsh)
          export NURL_TEST_PWSH
          python3 tools/tests/test_compiler_runners.py
          python3 tools/tests/test_git_hooks.py
      - name: Release artifact-set controls
        # The gate the release workflow runs before publishing. It needs
        # no toolchain — it reads a directory of archives — so it belongs
        # here rather than behind the compiler build.
        shell: bash
        run: python3 tools/tests/test_release_artifacts.py
      - name: Hole-probe gate verdict controls
        # tools/fuzz/holes/check.sh against a stand-in nurl.sh: a build
        # that failed without a compile error, a sanitizer build with no
        # binary and a run past its limit are UNCHECKED, never rejected or
        # clean (Agora #232). No toolchain.
        shell: bash
        run: python3 tools/tests/test_holes_check.py
      - name: TLS benchmark per-CPU-family report controls
        # bench/tls_bench/gen_tls_results.py keeps each runner CPU
        # family's latest tls-bench run and refuses a run that does not say
        # which CPU and which NURL kernels produced it (Agora #112). Pure
        # Python over fixture runs, no toolchain.
        shell: bash
        run: python3 tools/tests/test_tls_bench_report.py
      - name: Generated RSA-2048 ADX kernels are current
        # stdlib/runtime_core.c carries tools/gen_rsa_adx16.py's output
        # between markers; a hand edit or a stale block fails here.
        shell: bash
        run: python3 tools/gen_rsa_adx16.py --check

  installer-controls:
    # tools/get-nurl.sh is classed with the web docs (nurl-lang.org serves
    # it), so an installer-only PR runs no `code` job: these controls run
    # for either class. They need python3, curl and tar, serve a release
    # over file:// and stand in for GitHub, and take seconds.
    name: installer controls (latest tag, unpack)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.webdocs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The latest tag resolves when the GitHub API answers 403
        run: python3 tools/tests/test_installer_latest.py
      - name: An install never leaves the prefix without a toolchain
        run: python3 tools/tests/test_installer_unpack.py

  build-failure-controls:
    name: required tools fail the complete build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: nurllang/ci:ubuntu24-20260821
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject broken formatter and package-manager builds
        run: python3 tools/tests/test_build_failures.py
      - name: Retain failure-control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-controls
          path: build/build-failure-controls/

  mingw-cross:
    name: Windows cross runtime links against msvcrt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # This C-runtime gate needs no NURL build. Keep package installation
      # outside the compiler container's budget; the dated CI image has no
      # MinGW. Hosted runners may already have it. A missing prerequisite
      # after installation fails explicitly instead of letting the gate skip.
      # The packages are cached. The runner's Azure mirror stalled on them
      # (2 min per 6 MB package, 115 MB in all) four times on 2026-10-27,
      # and the old 4-minute budget cancelled the gate each time. A cache hit
      # installs the .debs it holds with no network. A miss downloads once,
      # trying archive.ubuntu.com before the Azure mirror, under a cold-path
      # budget, and saves them.
      - name: Restore the MinGW packages
        uses: actions/cache@v4
        with:
          path: ~/mingw-debs
          key: mingw-debs-ubuntu-24.04-gcc-mingw-w64-x86-64-v1
      - name: Ensure the distro MinGW toolchain
        timeout-minutes: 10
        run: |
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null; then
            if ls ~/mingw-debs/*.deb >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends ~/mingw-debs/*.deb
            else
              if [ -f /etc/apt/apt-mirrors.txt ]; then
                { printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\n'; cat /etc/apt/apt-mirrors.txt; } | sudo tee /etc/apt/apt-mirrors.txt.new >/dev/null
                sudo mv /etc/apt/apt-mirrors.txt.new /etc/apt/apt-mirrors.txt
              fi
              sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update --error-on=any
              sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends --download-only gcc-mingw-w64-x86-64
              mkdir -p ~/mingw-debs
              cp /var/cache/apt/archives/*.deb ~/mingw-debs/
              sudo apt-get install -y --no-install-recommends ~/mingw-debs/*.deb
            fi
          fi
          command -v x86_64-w64-mingw32-gcc
      - name: Compile and link the whole runtime against msvcrt
        run: ./tools/check_mingw_cross.sh

  # build-test is split in three jobs that run at once (Agora #251, part 2):
  # as one job it ran 34 min p50 and was CI's critical path. build-corpus is
  # ./build.sh itself (the bootstrap fixed point and the test corpus);
  # build-gates and build-gates-2 build the toolchain with --no-tests
  # (~1.6 min) and run every gate that used to follow it, in the same order.
  # The required check keeps its name: `build-test` below is that check,
  # and it passes only when all three parts did.
  build-corpus:
    name: "build + bootstrap fixed point + test corpus (build.sh)"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 20, not 15. The job was measured at 13m28s before the two
    # diagnostic gates below joined it, and the first run with them was
    # cancelled at 15m03s — in the h2spec gate, long after the new steps
    # had passed. A cancelled run reads as infrastructure trouble rather
    # than as a gate saying no, which is the worst failure mode a gate
    # can have, so the budget moves rather than the coverage. Watch this
    # number: the job grows with the corpus, and the next thing added
    # here should come with a measurement, not a hope.
    # 30, not 20: by v0.67.0 the job ran 15–19 min (18m36s on #1143) and
    # a rerun was cancelled at exactly 20:00 in the nurl-cov gate.
    # 45, not 30: on 2026-10-29 it passed in 28m53s (run 3047) and was then
    # cancelled at 30:00 on #1294 and on main's push run 3049, both in
    # the network-deadline gate with every earlier step green. The hole
    # corpus and the test corpus grew by about 100 entries that day.
    timeout-minutes: 45
    container:
      # containers/ci/Dockerfile — clang/llvm, the FFI dev libraries,
      # qemu + grub for the unikernel gates, gdb, zstd, and zig at
      # /opt/zig, all pre-installed. Exists because the runner pool's
      # apt mirror degraded repeatedly (2026-08-19) and every job whose
      # first step was `apt-get update` burned its whole timeout there.
      # Pin the DATED tag; :latest is never referenced from CI.
      image: nurllang/ci:ubuntu24-20260821
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: clang --version | head -1

      - name: ./build.sh (stage1 ≡ stage2 fixed point + run_tests.sh)
        # build.sh itself prints the final line "BUILD SUCCESS &
        # TESTS PASSED" only when the bootstrap fixed point holds
        # AND the test corpus baseline matches. Any failure surfaces
        # the relevant diff so we don't need extra grep here.
        run: ./build.sh

      - name: Named types defined before they are parameters (LLVM 23)
        # LLVM 18 resolves a forward reference to a named struct anywhere
        # in a module; LLVM 23 (the macOS job's Homebrew clang) rejects one
        # used as a parameter type before its `%T = type` line ("invalid
        # type for function argument"). Checks every module the corpus
        # just emitted, so this runner's older clang still catches it.
        run: python3 tools/check_ir_type_order.py "$(ls -td build/tests/run.* | head -1)"/*.ll

      - name: Retain complete build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/logs/

  build-gates:
    name: "build gates: probes, controls, packaging"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The gates of the old single job (see build-corpus above). Measure
    # before raising this: the next gate added here comes with a time.
    timeout-minutes: 30
    container:
      # containers/ci/Dockerfile — clang/llvm, the FFI dev libraries,
      # qemu + grub for the unikernel gates, gdb, zstd, and zig at
      # /opt/zig, all pre-installed. Exists because the runner pool's
      # apt mirror degraded repeatedly (2026-08-19) and every job whose
      # first step was `apt-get update` burned its whole timeout there.
      # Pin the DATED tag; :latest is never referenced from CI.
      image: nurllang/ci:ubuntu24-20260821
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: clang --version | head -1

      - name: Build the toolchain (the corpus runs in build-corpus)
        run: ./build.sh --no-tests

      - name: Soundness hole probes (every one rejected, or clean under ASan/LSan)
        # tools/fuzz/holes: each probe is a way safe code once broke the
        # memory guarantee (docs/MEMORY.md §6.6). The compiler must reject
        # it, or its program must run clean under the sanitizers; the exit
        # status is the number that still compile and fault. Measured at
        # 19 s for the 129 probes of the pre-production hardening.
        run: ./tools/fuzz/holes/check.sh

      - name: Enum ownership across compiled modules
        run: |
          NURL_SPLIT=4 NURL_SPLIT_MIN=1 ./nurl.sh compiler/tests/sink_enum_owned.nu build/sink-owned-split
          ./build/sink-owned-split

      - name: Driver paths through split lowering
        run: python3 tools/tests/test_driver_paths.py

      - name: nurl upgrade finds the latest release when the GitHub API answers 403
        # stdlib/ext/update_check.nu reads the tag from github.com's
        # releases/latest redirect and asks the rate-limited API once, as
        # the fallback (Agora #218). A stand-in curl, no network.
        run: python3 tools/tests/test_update_check_latest.py

      - name: NURL_SAN=1 never builds through the bundled zig
        # zig cc has no ASan runtime: it drops -fsanitize=address and
        # exits 0. A sanitized build must use a clang with compiler-rt,
        # or fail, never publish an uninstrumented binary. Runs the real
        # zig at /opt/zig/zig too.
        run: python3 tools/tests/test_sanitizer_toolchain.py

      - name: Consistent source snapshots during compilation
        run: python3 tools/tests/test_compiler_source_snapshot.py

      - name: NURL and C function linkage boundaries
        run: python3 tools/tests/test_function_linkage.py

      - name: Protobuf differential wire and schema tests
        run: |
          python3 -m pip install --target /tmp/protobuf-oracle protobuf==7.36.1
          PYTHONPATH=/tmp/protobuf-oracle python3 tools/tests/test_protobuf.py

      - name: gRPC interoperability, malformed peers and full duplex
        run: |
          python3 -m pip install --target /tmp/grpc-oracle -r packages/gRPC/tests/requirements.txt
          PYTHONPATH=/tmp/grpc-oracle python3 tools/tests/test_grpc.py

      - name: Declaration and statement forms (reject, or emit main)
        # One invariant over many spellings: a source that still declares
        # '@ main' either fails to compile or defines main. Nine parser
        # defects shared the shape this catches — an ad-hoc token skip
        # that ran past the end of a declaration and swallowed the next
        # one, silently.
        run: python3 tools/tests/test_declaration_forms.py

      - name: Installed LSP and source stream controls
        run: |
          ./tools/nurl-lsp/build.sh
          python3 tools/tests/test_lsp_toolchain.py
          python3 tools/tests/test_source_io.py
          python3 tools/tests/test_stream_io.py
          python3 tools/tests/test_formatter.py
          bash compiler/tests/lsp_rename_smoke.sh

      - name: Signed registry identities and installed ecosystem
        timeout-minutes: 10
        run: |
          python3 tools/tests/test_registry_identity.py
          python3 tools/tests/test_tool_publication.py
          python3 tools/tests/test_package_runners.py
          python3 tools/tests/test_resolver.py
          ./tools/nurlpkg/test-install-tool.sh

      - name: self-compile peak-RSS gate
        # Peak memory to compile the compiler is its existential
        # scaling liability (critic M1) — the FreeBSD job already runs
        # a hand-sized VM because of it. This turns the number into a
        # budget so the PR that regresses it is the one that fails.
        run: ./tools/memgate.sh

      - name: dead-function elimination gate
        # The corpus proves the pass never drops a LIVE function — that
        # would be an undefined symbol at link time. It cannot see the
        # other half: a pass that decided everything was reachable stays
        # green everywhere while costing nothing but wall clock, which
        # is exactly the bug an off-by-one in the block scanner caused
        # during development. This asserts unreachable code is gone AND
        # the indirect routes (dyn vtable thunks, `% Drop`, closures,
        # generic monomorphs) survive. Costs ~1 s.
        run: ./tools/dcegate.sh

      - name: examples corpus frontend gate
        # Frontend-compiles every examples/ + bench/ + duo/ program.
        # Examples have rotted silently twice (immutability-migration
        # misses in gameboy + c64) because nothing compiled them on
        # PR; this catches parse/type/import regressions without
        # linking or running anything.
        run: ./tools/check_examples.sh

      - name: documentation examples compile
        # Every ```nurl block in docs/*.md, docs/stdlib/*.md, README.md
        # and the package READMEs, wrapped into a program and run through
        # `nurlc --check`; a block annotated expect-error must be rejected
        # with that diagnostic, so the docs and the messages they quote
        # cannot drift apart. MEMORY.md §2.11 had sat uncompilable (no vec
        # import) because nothing compiled it. The controls prove the
        # wrapping and the annotations.
        run: |
          ./tools/check_doc_examples.sh
          python3 tools/tests/test_doc_examples.py

      - name: stdlib symbol-collision gate
        # NURL's flat namespace makes two stdlib modules that define the
        # same top-level @ name collide when a program imports both (link
        # error, or a silent link-order-dependent pick — the __u32 /
        # __free_str_vec class). Assert every stdlib @-function name is
        # globally unique.
        run: ./tools/check_stdlib_symbols.sh

      - name: errno is re-derived on every access (fiber migration)
        # A fiber resumes on any worker thread; errno's `const` accessor
        # lets the optimiser reuse one thread's errno address across a
        # park. The runtime routes every access through a volatile
        # function pointer; this compiles it to IR and requires that no
        # other function calls __errno_location directly.
        run: ./tools/check_errno_fiber_safe.sh

      - name: borrow-checker side tables are written through the walk logs
        # bck_loop's fixpoint (agora #210) stops once a walk of the body
        # changes no state and no fact in g_bck; the facts it sees are the
        # ones bck_put / bck_add_word / bck_add note. A direct write could
        # end a loop's analysis a walk too early.
        run: ./tools/check_bck_writes.sh

      - name: nolibc covers every libc symbol the runtime core calls
        # unikernel/nolibc/ exists to supply exactly the libc surface of
        # stdlib/runtime_core.c — a hand-synced pair, and this repo's
        # history says those drift silently (install.sh, builtins.nu, the
        # runtime_sources list). Compile the core, list what it still
        # needs, require nolibc to define all of it. A new libc call in
        # the runtime then fails in the PR that adds it, not at boot in
        # Track B months later. Takes about a second.
        run: ./tools/check_nolibc_symbols.sh

      - name: nolibc + runtime_bare unit gates (differentials, fuzz, schedule, deadlock)
        # Differentials against glibc, not "it didn't crash": every
        # mem*/str* over all alignments and lengths, %f/%e/%g at every
        # precision, every libm entry in ULPS over the ranges where a
        # libm actually breaks, and an allocator fuzzer that keeps a
        # pattern in each live block (ASan cannot supervise an allocator
        # it replaced). Plus the cooperative scheduler: its SCHEDULE
        # asserted as a trace string, and the negative half — four
        # deadlocks, a stack overflow, a guard-page write and a refusing
        # entropy source, each of which must END THE PROCESS in bounded
        # time rather than hang.
        run: ./unikernel/tests/run_unit_tests.sh

      - name: runtime-builtins doc module in sync with the compiler preamble
        # stdlib/core/builtins.nu is the hand-written, nurl_api-indexed
        # documentation of the pre-registered C-runtime surface
        # (nurl_str_float, nurl_println, …). Its authoritative list is
        # the __emit_rt_decl preamble in compiler/nurlc.nu; assert the
        # two agree in both directions so discovery never lies.
        run: ./tools/check_builtins_doc.sh

      - name: served installers match the canonical ones
        # webdocs/public/install.{sh,ps1} are copies of tools/get-nurl.*
        # made by webdocs' build step, and they are what nurl-lang.org
        # actually serves. They drifted once already: the fix that stopped
        # an upgrade from wiping the prefix (registry token, models/,
        # every installed tool) sat in tools/ for weeks while the website
        # kept handing out the destructive version.
        run: ./tools/check_installer_sync.sh

      - name: Downloaded tools are pinned by content
        # A version-pinned URL says what was asked for, not what came back.
        # The release job unpacks a downloaded zig INTO the published archive,
        # so those bytes reach users; two benchmark jobs took their reference
        # runtime from `curl … | bash`, which can change between runs of a
        # number we publish. Every such download now carries a checksum, and
        # this keeps the next one from arriving without.
        run: python3 tools/check_pinned_downloads.py

      - name: Windows goldens not stale (they are checked on main, not per-PR)
        # outputs-windows/ is a parallel corpus and windows-tests.yml runs
        # on pushes to main, so a PR that adds assertions updates outputs/
        # and the Windows copy silently keeps the old expectation — the
        # break lands on main, on whoever pushes next. float_extra went
        # seven lines stale in July and reported FAIL weeks later. The
        # shape (Windows missing lines, adding none) is detectable here,
        # without a Windows machine.
        run: ./tools/check_windows_goldens.sh

      - name: Windows golden twins carry this PR's changes (change-based, exact)
        # The state-based check above cannot see line MUTATIONS: the MCP
        # dual-era change rewrote result lines, the stale twins diffed
        # with both < and > lines — indistinguishable from a legitimate
        # platform difference — and the break landed on main. The exact
        # rule needs the change: a golden touched by this PR whose twin
        # was byte-identical BEFORE it (platform-independent output)
        # must keep the twin identical. The pre-commit hook auto-copies;
        # this is the same rule for whoever skipped the hook.
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}" || true
          ./tools/check_golden_twins.sh "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}"

      - name: package imports resolve once installed (no packages/… self-imports, every deps/ import declared)
        # In this repo every build runs from the root, so a
        # `$ \`packages/<name>/src/x.nu\`` import resolves and every test
        # passes. Installed from the registry the package lands under
        # deps/<name>/src/ and that path does not exist — torchpt 0.1.0
        # shipped that way and was uninstallable from the day it was
        # published. Likewise a `deps/<x>/…` import whose package is not
        # in [dependencies] compiles here, where the deps/ symlink exists,
        # and fails for every registry install — objdet 0.4.4 passed CI
        # that way and was stopped only by the publish gate. No in-repo
        # test can catch either; this can. The controls prove the rules.
        run: |
          ./tools/check_package_imports.sh
          python3 tools/tests/test_package_imports.py

      - name: package entry points compile (as an installed consumer compiles them)
        # Nothing compiled packages/ on a PR, so a compiler that grew
        # stricter (the frozen-Arc and closure-capture rules) broke
        # lingbot-map, map-anything, onnx, yoloe, objdet and benchmark
        # with nothing red. Every src/main.nu and src/<name>.nu goes
        # through `nurlc --check` from a scratch deps/ layout, in
        # parallel (~1.5 min); an entry needing an optional native
        # library this build lacks is skipped. The controls prove the
        # entry selection and the verdicts.
        run: |
          python3 tools/check_package_entries.py
          python3 tools/tests/test_package_entries.py

      - name: a package's --version matches its manifest
        # `cli_new prog about VERSION` takes the version as a string
        # literal; nothing derives it from nurl.toml, so the two drift
        # the moment a release bumps one and forgets the other. anomaly
        # shipped 0.5.3 and 0.5.4 while `anomaly --version` kept saying
        # 0.5.2 — found only by installing the published package and
        # running the binary, which is two releases too late and cannot
        # be corrected (a version can be yanked, never replaced).
        run: ./tools/check_package_version_strings.sh

      - name: every tracked path can be checked out on Windows
        # CON, PRN, AUX, NUL, COM1-9 and LPT1-9 are DOS device names at
        # every directory, in any case, with any extension — so
        # `boot/con.c`, the obvious name for a console, is a path git
        # REFUSES to check out on Windows. The Windows job then dies at
        # its checkout step, before the change has run, with a log that
        # says `invalid path` and nothing about why. This gate reports
        # it here, on Linux, naming the file and the rule. Same class:
        # reserved characters, trailing dots or spaces, and paths that
        # differ only in case.
        run: ./tools/check_windows_paths.sh

  build-gates-2:
    name: "build gates: formatting, diagnostics, tooling, protocols, codecs, coverage"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The gates of the old single job (see build-corpus above). Measure
    # before raising this: the next gate added here comes with a time.
    timeout-minutes: 30
    container:
      # containers/ci/Dockerfile — clang/llvm, the FFI dev libraries,
      # qemu + grub for the unikernel gates, gdb, zstd, and zig at
      # /opt/zig, all pre-installed. Exists because the runner pool's
      # apt mirror degraded repeatedly (2026-08-19) and every job whose
      # first step was `apt-get update` burned its whole timeout there.
      # Pin the DATED tag; :latest is never referenced from CI.
      image: nurllang/ci:ubuntu24-20260821
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: clang --version | head -1

      - name: Build the toolchain (the corpus runs in build-corpus)
        run: ./build.sh --no-tests

      - name: nurlfmt --check (canonical-form gate)
        # Every first-party .nu file must be in canonical nurlfmt
        # form. build.sh above already produced build/nurlfmt, so
        # this is a cheap in-memory reformat-and-compare with no
        # extra compilation. bench/ is excluded — those .nu files are
        # recorded model outputs from the generation-accuracy study
        # and must keep the exact bytes the model emitted.
        #
        # compiler/tests/nurlfmt_idempotent.sh (fmt is a fixed point, and
        # nurlc(fmt(x)) == nurlc(x)) does NOT run here, on purpose: once
        # this step passes, every file it covers is canonical, fmt(x) is
        # x byte for byte, and both of its invariants hold trivially —
        # in CI it could only ever report a false failure (agora #263:
        # it reported 63, all a path difference). It finds something on
        # a tree that is not canonical yet: run it while changing the
        # formatter, against the old tree, BEFORE the repo-wide --write
        # pass, to show that pass changes no IR.
        run: ./compiler/tests/nurlfmt_check.sh

      - name: strict-arity gate (the n-ary '&'/'|' trap)
        # `? & a b c d { then } { else }` reads as a four-way AND and is
        # not one: `&` is BINARY, so `c` and `d` become the bare
        # then/else values and the two blocks run as plain statements.
        # The conditional logic is wrong and the compiler still emits a
        # working binary, so nothing downstream can notice. nurlc warns
        # by default and errors under --strict-arity; this runs the
        # strict compiler over the whole first-party tree. Its first run
        # found examples/audio_sparcles2.nu culling every particle on
        # every frame, which is the class of bug it exists to stop.
        run: ./tools/check_strict_arity.sh

      - name: diagnostic-coverage gate (does anything print this?)
        # Every `die` / `warn` site in the compiler against the corpus:
        # which messages does some test actually make it print? A message
        # nothing prints is a message nobody has read, and the wording of
        # a diagnostic is most of its value — `tools/diag_coverage_baseline.txt`
        # ratchets on message IDENTITY, so a rewrite counts as new.
        #
        # It ran only by hand until this step, and that is exactly how
        # fourteen diagnostics added in one hardening round reached main
        # with nothing printing any of them. It was also three and a half
        # minutes of one-process-per-file; it is thirty seconds in
        # parallel, which is what makes it affordable here.
        run: NURL_CHECK_JOBS=4 ./tools/check_diag_coverage.sh

      - name: diagnostic anchor gate (where does it point?)
        # The other half of the same question: a precise message against
        # the wrong line is worse than a vague one against the right
        # line. Reads the committed goldens and reports any diagnostic
        # anchored on a line that is nothing but closing delimiters, or
        # with a caret past the end of the line it echoes.
        run: ./tools/check_diag_anchor.sh

      - name: diagnostic type-spelling gate (NURL types, not LLVM's)
        # A message that interpolated a type's lowering told the reader
        # '{ i1, i64 }' where they wrote '?i', 'i64*' for '*i', '%Fruit'
        # for 'Fruit'. Reads the committed goldens' error/warning lines.
        run: ./tools/check_diag_nurl_types.sh

      - name: nurl-mcp over stdio (inline source, formal/ docs, stdlib root)
        # The local MCP server as an agent drives it: inline source is
        # named by its `filename` in every diagnostic (never a temp path),
        # check/build/run/fmt work on it, nurl_docs serves formal/ and its
        # probe table, stdlib names resolve, nothing is left in $TMPDIR.
        run: ./packages/nurl-mcp/tests/stdio_test.sh

      - name: playground MCP end to end (native builds)
        # nurlapi built from this checkout, run against the repo's own
        # compiler/stdlib/docs, and driven over REST and /mcp: the
        # diagnostics contract (every class lands in nurlc_errors, named
        # by the caller's filename), traversal refusal, nurl_api package
        # index, nurl_docs formal/, roadmap sections. Wasm and unikernel
        # builds are covered by the image (they need wasi-sdk and qemu).
        run: ./nurlapi/e2e_local.sh

      - name: metamorphic diagnostic-coverage gate
        # The same semantic situation, written N ways, must get the same
        # verdict from the checker. Every August 2026 borrow-checker fix
        # was one shape — the check asked its question at one spelling
        # and missed the others — so the spellings are enumerated and
        # `known_gaps.json` (now empty) is the baseline: a NEW gap, or a
        # control that starts being rejected, fails here. It ran only by
        # hand until this step, which meant a stale baseline entry could
        # sit in the file claiming a hole that had already been fixed
        # and, worse, would have absorbed the regression if it came back.
        # Two seconds, and it uses the build/nurlc from ./build.sh above.
        run: ./tools/metamorph/spellings.py

      - name: trait declaration-order and method ABI gate
        run: ./tools/metamorph/trait_order.py

      # Safe Vec element access (vec_at / vec_put / vec_get) must cost what
      # a raw-pointer loop costs: instruction counts, so it cannot flake.
      # Skips itself where perf cannot count instructions.
      - name: safe Vec access at raw-pointer cost
        run: ./tools/vec_parity.sh

      - name: CRC-32 gate (two code paths, one answer)
        # std/deflate computes CRC-32 bitwise below 512 bytes and with a
        # Sarwate table above it — the table costs 2048 steps to build and
        # only pays for itself on a real payload, so both paths ship. Two
        # paths are two chances to disagree, with a gzip member, a tar
        # archive or a database block riding on the answer. This checks
        # every length across the threshold, and chained updates, against
        # python3's zlib.crc32.
        run: ./tools/crc32_gate.sh

      - name: Absolute TCP and TLS write deadlines under backpressure
        run: |
          ./nurl.sh tools/net_write_deadline.nu build/net_write_deadline
          python3 tools/tests/test_net_write_deadline.py
          ./nurl.sh tools/net_duplex_probe.nu build/net_duplex_probe
          python3 tools/tests/test_net_duplex.py
          ./nurl.sh tools/net_key_update.nu build/net_key_update
          python3 tools/tests/test_net_key_update.py
          # Nagle off on both ends of every TCP connection (TCP_NODELAY
          # read back from the kernel) — the connect side once lacked it.
          ./nurl.sh tools/net_nodelay.nu build/net_nodelay
          build/net_nodelay

      - name: RSA-PSS signing against OpenSSL (CRT and plain exponent)
        # std/rsa.nu signs on std/rsa_mont.nu: CRT with blinded half-width
        # exponents when the key carries its factors, one full-width
        # exponentiation otherwise. With a fixed salt PSS is deterministic,
        # so both paths must produce the same bytes, and OpenSSL must
        # verify them — 1024 to 4096 bits, PKCS#1 and PKCS#8 keys.
        run: |
          ./nurl.sh -O2 tools/rsa_sign_gate.nu build/rsa_sign_gate
          python3 tools/tests/test_rsa_sign.py

      - name: DEFLATE, gzip and zlib framing against reference codecs
        run: |
          ./nurl.sh tools/compress_gate.nu build/compress_gate
          python3 tools/tests/test_compress_framing.py

      - name: XXH64 gate (against the reference implementation)
        # std/hash_xxh64 is what a Zstandard frame checksum is. Its four
        # code paths — the 32-byte striped loop and the 8/4/1-byte tails —
        # plus a seed that enters the accumulators asymmetrically cannot
        # be covered by one length, so this walks every length across the
        # boundaries under four seeds and checks each digest against the
        # reference C implementation via python3's `xxhash`.
        run: |
          python3 -m pip install --quiet --break-system-packages xxhash || true
          ./tools/xxh64_gate.sh

      - name: Zstandard gate (both directions, against the zstd CLI)
        # std/zstd is a format implementation, so the only meaningful
        # oracle is the implementation everyone else uses. The reference
        # CLI compresses a corpus chosen to force each branch — random
        # bytes, one repeated byte, text, entropy that shifts halfway,
        # matches 200 kB apart, and every length from 0 to 300 — at every
        # level, with and without checksums and content sizes, in 1 kB
        # blocks, in long-distance mode, concatenated, and behind
        # skippable frames; every frame must decode byte-identically.
        # Then the direction reverses: our frames must satisfy `zstd -t`
        # and decode back through `zstd -d`. Finally 600 mutated frames
        # must be REFUSED without a crash or a hang, and resident size
        # must stay flat across hundreds of round trips.
        run: |
          ./tools/zstd_gate.sh --quick

      - name: HTTP-server per-request leak gate
        # Builds the leakcheck HTTP server with ASan+LSan and fails on ANY
        # leak across 21 HTTP/1.1 + 31 HTTP/2 requests. Uses the normal
        # build/nurlc from ./build.sh above — NURL_SAN=1 instruments only
        # the server, not the compiler (whose process-lifetime arenas would
        # otherwise dominate the report).
        run: ./tools/leakcheck/run.sh

      - name: Install h2spec 2.6.0 (HTTP/2 conformance suite)
        # Pinned release binary, checksum-verified. It is a Go 1.12 build
        # whose TLS client speaks TLS 1.2 unless GODEBUG=tls13=1 — the gate
        # script sets that for the TLS runs (the pure server is 1.3-only).
        run: |
          curl -sSL -o /tmp/h2spec.tgz \
            https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          echo "157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318  /tmp/h2spec.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/h2spec.tgz -C "$HOME/.local/bin" h2spec
          "$HOME/.local/bin/h2spec" --version

      - name: "HTTP/2 conformance gate (h2spec: TLS+ALPN, h2c, shared plaintext port)"
        # h2spec 146/146 (+147/147 strict) against the HttpApp TLS listener
        # and the HTTP/2-only example; 145/146 on the plaintext port shared
        # with HTTP/1.1, where the one pinned failure (§3.5/2, invalid
        # preface → HTTP/1.1 400) is the designed behaviour of a
        # dual-protocol port. curl then confirms the negotiated protocol.
        # Every check greps the positive totals line, so an h2spec that
        # could not connect fails rather than passes.
        run: H2SPEC="$HOME/.local/bin/h2spec" ./tools/h2spec_gate.sh

      - name: Install h3spec 0.1.13 (QUIC + HTTP/3 conformance suite)
        # Pinned release binary (a static Haskell build), checksum-verified.
        run: |
          curl -sSL -o "$HOME/.local/bin/h3spec" \
            https://github.com/kazu-yamamoto/h3spec/releases/download/v0.1.13/h3spec-linux-x86_64
          echo "b5f8eddd968cb195d1e3e7698d33fa141d6b2ad56153089d89928ac0fdee28bf  $HOME/.local/bin/h3spec" | sha256sum -c -
          chmod +x "$HOME/.local/bin/h3spec"
          "$HOME/.local/bin/h3spec" -v

      - name: "HTTP/3 conformance gate (h3spec: QUIC transport, HTTP/3, QPACK; Alt-Svc on the TCP side)"
        # h3spec 49/49 (34 QUIC-transport + 15 HTTP/3/QPACK error cases)
        # against the HttpApp TLS listener, which serves HTTP/3 on the same
        # port over UDP; then curl --http2 / --http1.1 must carry
        # alt-svc: h3=":port". Every check greps the positive totals line,
        # so an h3spec that could not reach the server fails rather than
        # passes. The docker curl-http3 end-to-end request is local-only
        # (no HTTP/3 curl on the runner) and reports SKIP here.
        run: H3SPEC="$HOME/.local/bin/h3spec" ./tools/h3spec_gate.sh

      - name: DWARF debug-info gate
        # The plain corpus never builds with --debug, so it can't catch a
        # broken !DI emission. This builds the --debug regression
        # (dwarf_closure_drop, the -O2 inliner crash) plus the gdb
        # behavioural checks; gdb makes the source-level asserts run too.
        run: ./tools/dwarf_test.sh

      - name: NURL line and branch coverage
        # Assert real counts, including missed branches and accumulated runs;
        # accepting --coverage or merely linking is not evidence of coverage.
        run: python3 tools/tests/test_driver_coverage.py

      - name: Template line coverage (minimum 96.3%)
        # Initial baseline: 747/776 lines. Reuse this job's toolchain;
        # nurl-cov rebuilds the three tests at -O0 with --no-dce.
        timeout-minutes: 2
        env:
          NURL_STDLIB: ${{ github.workspace }}
          NURL_CC: ${{ github.workspace }}/nurl.sh
        run: |
          cd packages/nurl-cov
          ../../nurl.sh -O0 src/main.nu ../../build/nurl-cov
          cd ../template
          ../../build/nurl-cov run --work ../../build/template-coverage \
            --no-color --fail-under 96.3 --html ../../build/template-coverage.html

      - name: Retain template coverage report
        if: ${{ !cancelled() && hashFiles('build/template-coverage.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: template-coverage
          path: build/template-coverage.html
          retention-days: 7
          if-no-files-found: error

  build-test:
    name: build + bootstrap fixed point + test corpus
    needs: [changes, build-corpus, build-gates, build-gates-2]
    # Skipped exactly when its parts are (a docs-only change), so the
    # required check reads as satisfied then, as before. Otherwise it waits
    # for all three and fails unless every one succeeded.
    if: ${{ always() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: build.sh and both gate jobs passed
        env:
          CORPUS: ${{ needs.build-corpus.result }}
          GATES: ${{ needs.build-gates.result }}
          GATES2: ${{ needs.build-gates-2.result }}
        run: |
          echo "build-corpus=$CORPUS build-gates=$GATES build-gates-2=$GATES2"
          [ "$CORPUS" = success ] && [ "$GATES" = success ] && [ "$GATES2" = success ]

  unikernel-nolibc:
    name: "unikernel: the corpus with no libc"
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: nurllang/ci:ubuntu24-20260821
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Two gates, and they are different questions. The first asks
    # whether the ordinary test corpus still runs with no libc linked —
    # 450 programs against their existing goldens, which is what keeps
    # the freestanding twin honest without a hypervisor in the loop.
    # The second boots the result under QEMU and asks whether it still
    # does with no operating system either: the boot path, the UART,
    # the memory map, the TSC, the virtio-net device, DHCP, and a
    # server that answers a client on the host.
    #
    # Neither was watched by CI until now, and both are exactly the
    # shape this repo has been bitten by twice — a gate that exists on
    # a developer's machine is a gate that drifts.
    #
    # The unikernel gates are three jobs, not one: they are independent,
    # and in sequence they were the longest job in this workflow (~24 min,
    # most of it single-threaded QEMU/TCG on a four-core runner). Each
    # job builds the compiler itself (~1 min) instead of passing it
    # along as an artifact — cheaper than an upload/download round trip
    # and nothing to keep in sync.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the compiler
        run: ./build.sh --no-tests

      - name: The corpus, with no libc at all
        # A FAIL here is a nolibc or runtime_bare bug: the program
        # linked and ran and disagreed with the golden the hosted build
        # produces. NEEDS-* columns are not failures — they are work
        # that has not been done or, for the third-party libraries a
        # unikernel never links, work that never will be.
        run: ./unikernel/run_nolibc_tests.sh

      - name: Fetch cloud-hypervisor (the other PVH loader)
        # 4.5 MB static binary, fetched BEFORE the unit gates because
        # one of them (hypervisor_gate) uses it. It boots the SAME
        # artifact QEMU does — both read the PVH note — so this is the
        # cheapest possible check that the image is not secretly a QEMU
        # image. Whether it actually boots depends on the runner having
        # /dev/kvm; the gate reports which half it ran.
        run: |
          curl -fsSL --retry 5 -o /tmp/cloud-hypervisor \
            https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/v46.0/cloud-hypervisor-static
          echo "00b5cf2976847d2f21d2b7266038c8fc40bd14f2a542115055e9e214867edc9e  /tmp/cloud-hypervisor" | sha256sum -c -
          sudo install -m755 /tmp/cloud-hypervisor /usr/local/bin/cloud-hypervisor
          # The runner HAS /dev/kvm and denies the job user access to it
          # (group kvm). Granting it turns the gate's boot half from a
          # skip into a real boot on a real hypervisor — which is the
          # whole point of the phase. `|| true`: on a runner without the
          # device the gate skips and says so.
          sudo chmod 0666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm 2>/dev/null || echo "no /dev/kvm on this runner"

      - name: nolibc + runtime_bare unit gates
        run: ./unikernel/tests/run_unit_tests.sh

  unikernel-qemu:
    name: "unikernel: the guest under QEMU (x86-64, RISC-V, AArch64)"
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: nurllang/ci:ubuntu24-20260821
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the compiler
        run: ./build.sh --no-tests

      - name: The guest, under QEMU
        # TCG, because a runner may or may not have /dev/kvm and the
        # boot path must be covered either way. Slower, identical
        # otherwise — except for the TSC frequency, which no leaf
        # reports there, so run_qemu.sh states it on the kernel command
        # line the way the plan says the host states the epoch.
        # NURL_ZIG: two gates need a wasm link through wasmbuilder,
        # which resolves zig from this variable — swarm_gate.sh (the
        # coordinator compiles a kernel) and wasmc_gate.sh (nurlc.nu
        # becomes nurlc.wasm). Without it both SKIP loudly and the
        # in-process wasm engine goes ungated.
        #
        # wasmc_gate.sh and swarm_gate.sh run in unikernel-appliance
        # instead (NURL_QEMU_SKIP_APPLIANCE); this job keeps the boot
        # path, the devices and the network demos.
        env:
          NURL_ZIG: /opt/zig/zig
          NURL_QEMU_SKIP_APPLIANCE: "1"
        run: ./unikernel/run_qemu_tests.sh

      - name: runtime.c compiles for every playground cross target
        # The playground image warms stdlib/runtime.<target>.o for six
        # zig targets at docker-build time (nurlapi/Dockerfile), two of
        # them Mach-O — an object format nothing else in this workflow
        # assembles. The v0.35.0 deploy found that out: the AArch64
        # fiber switch's adrp/:lo12: pair is ELF spelling, and the
        # release tag was the first build to feed it to a Mach-O
        # assembler. Compile the same file for the same targets here,
        # so the next such mismatch fails the PR instead of the deploy.
        run: |
          set -eux
          for t in x86_64-macos-none aarch64-macos-none \
                   x86_64-linux-musl aarch64-linux-musl \
                   aarch64-linux-gnu.2.31 riscv64-linux-musl; do
            /opt/zig/zig cc -target "$t" -O2 -c stdlib/runtime.c -o /tmp/rt-gate.o
          done

      - name: The guest, on the THIRD architecture
        # …including the entropy gate: this ISA has no instruction for
        # randomness, so the RISC-V guest drives a virtio-rng device
        # and the gate checks both halves — real bytes with the device,
        # a refusal BY NAME without it.
        # RISC-V, QEMU's virt board with OpenSBI underneath. The third
        # port is the one that proves the second was not a coincidence:
        # by now the per-architecture surface is four files and a
        # linker script, and everything above it is the same code
        # running against the same hosted goldens.
        env:
          NURL_ZIG: /opt/zig/zig
        run: ./unikernel/run_qemu_riscv64_tests.sh

      - name: The guest, on the OTHER architecture
        # The claim the aarch64 port makes is that nothing above the
        # bottom edge changed: the same corpus programs against the same
        # hosted goldens, plus the device demos, on QEMU's virt board.
        # A second architecture is what turns "portable" from a design
        # intention into a measured property.
        env:
          NURL_ZIG: /opt/zig/zig
        run: ./unikernel/run_qemu_arm64_tests.sh

  unikernel-appliance:
    name: "unikernel: nurlc.wasm and the swarm appliance in the guest"
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: nurllang/ci:ubuntu24-20260821
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the compiler
        run: ./build.sh --no-tests

      - name: The compiler itself, as wasm, in the guest
        # nurlc.wasm compiles corpus programs inside the machine; the IR
        # must be byte-identical to the native compiler's. Needs zig for
        # the wasm link (wasmbuilder) and SKIPS loudly without it.
        env:
          NURL_ZIG: /opt/zig/zig
        run: ./unikernel/tests/wasmc_gate.sh

      - name: The swarm-mcp appliance (B10)
        # The hosted package boots as the guest, joins the census through
        # the relay leg and answers an expression task and a compiled-wasm
        # task. swarm_gate.sh builds the guest image and the host node
        # concurrently.
        env:
          NURL_ZIG: /opt/zig/zig
        run: ./unikernel/tests/swarm_gate.sh

      - name: Deterministic simulation (build_nolibc.sh --sim)
        # The no-libc runtime with a virtual clock, seeded entropy and a
        # seeded schedule (agora #260): each program prints its hosted
        # golden under five seeds, repeats itself byte for byte under
        # one, explores (where it has a choice to make, seeds give
        # different schedules), and simulates more time than it takes.
        # Here rather than beside the no-libc corpus: that job already
        # spends most of its 20 minutes on the corpus.
        run: ./unikernel/run_sim_tests.sh

  freebsd:
    name: FreeBSD (build + bootstrap fixed point + tests, in a VM)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # GitHub has no native FreeBSD runners, so run a real FreeBSD VM inside
    # the Linux runner (QEMU). This builds nurlc/nurlpkg, checks the
    # self-hosting fixed point, and runs the test corpus on genuine
    # FreeBSD — the gate that would have caught the fiber-runtime gap
    # (async fibers silently no-op'd on FreeBSD). The base system ships
    # clang, openssl and zlib, so those FFI tests build; we add bash
    # (build.sh), pkgconf and sqlite3 so the SQLite FFI corpus actually
    # runs natively on FreeBSD. libpq and libcurl are left out — postgres
    # needs a live server (its live test skips anyway) and the offline
    # http tests use the no-backend path; both classes self-skip via the
    # sentinel-aware harness when their lib is absent.
    #
    # Promoted to a hard gate 2026-06-27 after a confirmed-green run on main
    # (run 28295173147): a FreeBSD failure now fails CI. Add `freebsd` to the
    # branch-protection required-check set so it blocks merges too.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + bootstrap + test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          # The bootstrap self-compile (nurlc compiling nurlc.nu) is the
          # memory peak: it holds the whole 18k-line unit's IR + symbol
          # tables resident, and the peak grows with the compiler. Measured
          # ~13.2 GB RSS at this size (up from ~9.5 GB when this job was
          # added), so give the guest 14 GB and leave ~2 GB of the 16 GB
          # runner for the host + KVM. Raise this in step with the peak
          # rather than living 35 MB from the edge. KVM keeps it near-native.
          mem: 14336
          cpu: 3
          prepare: |
            pkg install -y bash pkgconf sqlite3
          run: |
            clang --version
            ./build.sh
            ./tools/check_examples.sh

  sanitizers:
    name: AddressSanitizer + UndefinedBehaviorSanitizer
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # The whole-corpus run is sanitizers-corpus below, sharded: in one
    # job with these controls it took ~21 min (the corpus 12-14 of
    # them) and set the workflow's wall time. This job is the --san
    # build plus the targeted controls, ~8 min.
    timeout-minutes: 25
    container:
      image: nurllang/ci:ubuntu24-20260821
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ./build.sh --san (instrumented bootstrap)
        # --no-tests so the standard runner does not run with the
        # sanitised runtime; run_san_tests.sh below is the
        # sanitiser-aware corpus driver.
        run: ./build.sh --san --no-tests

      - name: Retain sanitized build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-build-logs
          path: build/logs/

      - name: Parser fuzz harness smoke (every target runs, briefly)
        # The weekly fuzz run (fuzz.yml) is the only other place the
        # parser harness runs, so a change that breaks the harness goes
        # unseen until then: the thread crossing check (agora #121) made
        # every socket target abort at thread_spawn before its parser read
        # a byte, and the fuzzer counted each abort as a finding. Three
        # seconds per target, four side by side, behind the harness build
        # (~40 s), on a fixed seed so a PR sees the same first inputs; any
        # finding fails the job (the input is kept in tools/fuzz/failures/).
        # Here, not in build-test: that job runs close to its 30-minute
        # limit, and this one has room.
        run: FUZZ_MINUTES=0.05 FUZZ_JOBS=4 ./tools/fuzz/fuzz_parsers.sh 1 0 8

      - name: Instrumented installed LSP and compiler stdin controls
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: use_stacks=0
        run: |
          NURL_SAN=1 ./tools/nurl-lsp/build.sh
          python3 tools/tests/test_lsp_toolchain.py

      - name: Instrumented formatter ownership and CLI controls
        run: NURL_SAN=1 python3 tools/tests/test_formatter.py

      - name: Windows process encoder memory and error controls
        run: python3 tools/tests/test_windows_process.py EncoderControls

      - name: Instrumented protobuf interoperability and malformed input
        run: |
          python3 -m pip install --target /tmp/protobuf-oracle protobuf==7.36.1
          PYTHONPATH=/tmp/protobuf-oracle NURL_SAN=1 python3 tools/tests/test_protobuf.py
          LSAN_DETECT_LEAKS=1 ./compiler/tests/run_san_tests.sh protobuf return_paths try_statement_effect inout_forward

      - name: Instrumented gRPC interoperability and connection cleanup
        run: |
          python3 -m pip install --target /tmp/grpc-oracle -r packages/gRPC/tests/requirements.txt
          PYTHONPATH=/tmp/grpc-oracle NURL_SAN=1 python3 tools/tests/test_grpc.py

      - name: Instrumented registry identity and trust controls
        run: |
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 LSAN_OPTIONS=use_stacks=0 NURL_SAN=1 python3 tools/tests/test_registry_identity.py
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 LSAN_OPTIONS=use_stacks=0 python3 tools/tests/test_tool_publication.py
          LSAN_DETECT_LEAKS=1 ./compiler/tests/run_san_tests.sh fs_atomic
          python3 tools/tests/test_package_runners.py
          NURL_SAN=1 python3 tools/tests/test_resolver.py
          NURL_SAN=1 ./nurl.sh compiler/tests/registry_trust.nu build/registry-trust-leaks
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ./build/registry-trust-leaks
          NURL_SAN=1 ./nurl.sh compiler/tests/resolver_registry.nu build/resolver-registry-leaks
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ./build/resolver-registry-leaks

      - name: Enum payload representation and sink ownership
        run: LSAN_DETECT_LEAKS=1 ./compiler/tests/run_san_tests.sh enum_nested_tag_payload sink_enum_owned sink_contract_names sink_callable_shadow sink_rebind_owned

      - name: Temporaries a callee lends back
        run: LSAN_DETECT_LEAKS=1 ./compiler/tests/run_san_tests.sh lend_back_temps ownership_results_and_temps

      - name: Publication gate resource cleanup
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: use_stacks=0
        run: |
          python3 tools/tests/test_registry_identity.py \
            RegistryIdentityTest.test_publish_requires_installed_compiler \
            RegistryIdentityTest.test_publish_requires_toolchain_root \
            RegistryIdentityTest.test_publish_reports_compiler_launch_failure \
            RegistryIdentityTest.test_publish_compiler_paths_are_literal_arguments \
            RegistryIdentityTest.test_publish_uses_default_installed_toolchain \
            RegistryIdentityTest.test_publish_drift_check_refuses_failed_index

      - name: Generated-code sanitizer detection controls
        run: python3 tools/sanitizer_controls.py

      - name: WASI rewriter LLVM types and leak control
        run: python3 tools/tests/test_wasi_ir.py

      - name: Source arithmetic domains and recovery
        run: python3 tools/tests/test_arithmetic_safety.py

      - name: compiler leak gate (self-compile, drop graph, nested stores)
        # Runs only when compiler/nurlc.nu (or the gate itself) changed: that
        # source owns the allocations this asserts about. The regression
        # inputs also exercise paths absent from the self-compile.
        #
        # The July 2026 ownership campaign took `nurlc compiler/nurlc.nu` from
        # 2,793,226 leaked allocations / 33.4 MB to ZERO (peak RSS 115.9 ->
        # 18.5 MB). Nothing in CI was watching while those leaks accumulated
        # one unowned helper at a time, and leak freedom decays the same way.
        # ANY LeakSanitizer report fails this — there is no budget to raise,
        # unlike the RSS gate. ASan/UBSan findings in the same run fail too.
        if: needs.changes.outputs.compiler == 'true'
        run: ./tools/leakgate.sh

      - name: panic journal nested-scope and owner-model controls
        run: python3 tools/tests/test_panic_journal.py

      - name: string argument address and ownership controls
        run: python3 tools/tests/test_string_argument_ownership.py

      - name: Instrumented NURL and C function linkage boundaries
        run: python3 tools/tests/test_function_linkage.py

      - name: rejected-source compiler leak gate (all rejection goldens)
        run: python3 tools/tests/test_compiler_cleanup.py

      - name: metamorphic reclamation gate (§7.2, runtime axis)
        # The compile-verdict classes run in the build-gates job; this one
        # cannot, because its verdict is an LSan RUN rather than anything
        # nurlc says. The panic-unwind journal is a runtime mechanism:
        # the same abandoned allocation, spelled N ways inside a recover
        # extent, must be reclaimed in all of them — an arm, a match arm,
        # a loop body, a nested extent, a second extent after the first.
        # It needs the sanitized runtime the --san build above produced,
        # and it SKIPS loudly rather than silently passing without one.
        #
        # It runs with use_stacks=0, as the corpus step below does: with
        # the default an allocation whose only owner is a live `main`
        # frame reads as "still reachable", and a deliberately-leaking
        # control passed.
        run: ./tools/metamorph/spellings.py --class panic-reclaim

  sanitizers-corpus:
    name: ASan + UBSan + LSan corpus (shard ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # Each shard is the --san build (~3 min) plus half the corpus.
    timeout-minutes: 25
    strategy:
      # One shard's sanitizer report must not cancel the other's: both
      # halves are worth reading on the same push.
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: nurllang/ci:ubuntu24-20260821
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ./build.sh --san (instrumented bootstrap)
        run: ./build.sh --san --no-tests

      - name: ASan + UBSan + LSan corpus
        # The whole corpus, leak check on (run_san_tests.sh's default):
        # a leak fails like a use-after-free does. This replaced a curated
        # leak-pinned list once an LSan run over every test came back
        # clean — the "process-lifetime arenas" and "brevity tests" that
        # were expected to leak did not, and the three leaks it did find
        # were compiler bugs. Runs with use_stacks=0 (see the runner): a
        # dead frame still holding a pointer must not hide a real leak.
        # Tests that exist only to reach one path of the COMPILER under
        # the leak check still matter here — select_basic is the only
        # input that compiles a `select`, net_* hold the sans-IO stack to
        # the unikernel's no-process-exit standard, async_* catch a fiber
        # that leaks its stack mapping — they are simply part of the run.
        #
        # Sharded round-robin over the sorted test names
        # (NURL_SAN_SHARD); the shards together are the whole corpus.
        env:
          NURL_SAN_SHARD: ${{ matrix.shard }}/2
        run: ./compiler/tests/run_san_tests.sh

  webdocs-build:
    name: web docs build (fumadocs)
    needs: changes
    if: needs.changes.outputs.webdocs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Build-checks the Fumadocs (Next.js) site so a docs PR can't merge with a
    # broken build (bad MDX/frontmatter, broken TypeScript, page-tree errors)
    # and then fail in webdocs-deploy.yml after landing on main. Build only —
    # the OpenNext/Cloudflare adapt-and-deploy step stays in
    # webdocs-deploy.yml, post-merge.
    defaults:
      run:
        working-directory: webdocs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webdocs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: next build
        run: pnpm run build

# nurlfmt --check now runs as a step in the build-gates job above
# (after the examples gate). The repo-wide `nurlfmt --write` pass that
# canonicalised the tree landed alongside it, so the gate the README
# pins is live: every first-party .nu file must be canonical to merge.
# Closes critic v0.9.0 Tier D #2.
