name: ci

# Closes ROADMAP §6 / IMPROVEMENTS.md Tier D #2 (critic v0.9.0).
# The local gate (./build.sh + run_san_tests.sh) has been the pre-1.0
# review tool; this workflow lifts it to PR-level so every branch tip
# is exercised on Ubuntu out of the box.

on:
  push:
    branches: [main, Improvements]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an older in-flight run when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      webdocs: ${{ steps.filter.outputs.webdocs }}
      compiler: ${{ steps.filter.outputs.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Docs-only PRs (webdocs/**) skip the compiler jobs below and run
      # webdocs-build instead. The skip is an `if:` on each job rather than
      # workflow-level `paths-ignore` because skipped jobs still satisfy
      # branch-protection required checks (freebsd is required), while a
      # path-filtered workflow that never starts would leave a docs-only PR
      # blocked forever. A PR touching both classes runs everything.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            webdocs:
              - 'webdocs/**'
            code:
              - '!webdocs/**'
            # The self-compile leak gate (in the sanitizers job) runs when
            # the compiler source itself changes — that is what owns the
            # allocations it is asserting about — or when the gate script
            # changes, so a change to the gate is exercised by its own PR.
            compiler:
              - 'compiler/nurlc.nu'
              - 'tools/leakgate.sh'

  build-test:
    name: build + bootstrap fixed point + test corpus
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps (clang + optional FFI libs)
        # The optional dev packages let the FFI sentinel checks
        # (stdlib/runtime.<lib>) light up so the corresponding ext/
        # modules build. With any of these missing, the affected
        # FFI calls return their *_Other / *_Unsupported variant
        # instead of breaking the build.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev
          clang --version

      - name: ./build.sh (stage1 ≡ stage2 fixed point + run_tests.sh)
        # build.sh itself prints the final line "BUILD SUCCESS &
        # TESTS PASSED" only when the bootstrap fixed point holds
        # AND the test corpus baseline matches. Any failure surfaces
        # the relevant diff so we don't need extra grep here.
        run: ./build.sh

      - name: self-compile peak-RSS gate
        # Peak memory to compile the compiler is its existential
        # scaling liability (critic M1) — the FreeBSD job already runs
        # a hand-sized VM because of it. This turns the number into a
        # budget so the PR that regresses it is the one that fails.
        run: ./tools/memgate.sh

      - name: dead-function elimination gate
        # The corpus proves the pass never drops a LIVE function — that
        # would be an undefined symbol at link time. It cannot see the
        # other half: a pass that decided everything was reachable stays
        # green everywhere while costing nothing but wall clock, which
        # is exactly the bug an off-by-one in the block scanner caused
        # during development. This asserts unreachable code is gone AND
        # the indirect routes (dyn vtable thunks, `% Drop`, closures,
        # generic monomorphs) survive. Costs ~1 s.
        run: ./tools/dcegate.sh

      - name: examples corpus frontend gate
        # Frontend-compiles every examples/ + bench/ + duo/ program.
        # Examples have rotted silently twice (immutability-migration
        # misses in gameboy + c64) because nothing compiled them on
        # PR; this catches parse/type/import regressions without
        # linking or running anything.
        run: ./tools/check_examples.sh

      - name: stdlib symbol-collision gate
        # NURL's flat namespace makes two stdlib modules that define the
        # same top-level @ name collide when a program imports both (link
        # error, or a silent link-order-dependent pick — the __u32 /
        # __free_str_vec class). Assert every stdlib @-function name is
        # globally unique.
        run: ./tools/check_stdlib_symbols.sh

      - name: nolibc covers every libc symbol the runtime core calls
        # unikernel/nolibc/ exists to supply exactly the libc surface of
        # stdlib/runtime_core.c — a hand-synced pair, and this repo's
        # history says those drift silently (install.sh, builtins.nu, the
        # runtime_sources list). Compile the core, list what it still
        # needs, require nolibc to define all of it. A new libc call in
        # the runtime then fails in the PR that adds it, not at boot in
        # Track B months later. Takes about a second.
        run: ./tools/check_nolibc_symbols.sh

      - name: nolibc + runtime_bare unit gates (differentials, fuzz, schedule, deadlock)
        # Differentials against glibc, not "it didn't crash": every
        # mem*/str* over all alignments and lengths, %f/%e/%g at every
        # precision, every libm entry in ULPS over the ranges where a
        # libm actually breaks, and an allocator fuzzer that keeps a
        # pattern in each live block (ASan cannot supervise an allocator
        # it replaced). Plus the cooperative scheduler: its SCHEDULE
        # asserted as a trace string, and the negative half — four
        # deadlocks, a stack overflow, a guard-page write and a refusing
        # entropy source, each of which must END THE PROCESS in bounded
        # time rather than hang.
        run: ./unikernel/tests/run_unit_tests.sh

      - name: runtime-builtins doc module in sync with the compiler preamble
        # stdlib/core/builtins.nu is the hand-written, nurl_api-indexed
        # documentation of the pre-registered C-runtime surface
        # (nurl_str_float, nurl_println, …). Its authoritative list is
        # the __emit_rt_decl preamble in compiler/nurlc.nu; assert the
        # two agree in both directions so discovery never lies.
        run: ./tools/check_builtins_doc.sh

      - name: served installers match the canonical ones
        # nurlweb/public/install.{sh,ps1} are copies of tools/get-nurl.*
        # made by a MANUAL npm script, and they are what nurl-lang.org
        # actually serves. They drifted once already: the fix that stopped
        # an upgrade from wiping the prefix (registry token, models/,
        # every installed tool) sat in tools/ for weeks while the website
        # kept handing out the destructive version.
        run: ./tools/check_installer_sync.sh

      - name: Windows goldens not stale (they are checked on main, not per-PR)
        # outputs-windows/ is a parallel corpus and windows-tests.yml runs
        # on pushes to main, so a PR that adds assertions updates outputs/
        # and the Windows copy silently keeps the old expectation — the
        # break lands on main, on whoever pushes next. float_extra went
        # seven lines stale in July and reported FAIL weeks later. The
        # shape (Windows missing lines, adding none) is detectable here,
        # without a Windows machine.
        run: ./tools/check_windows_goldens.sh

      - name: Windows golden twins carry this PR's changes (change-based, exact)
        # The state-based check above cannot see line MUTATIONS: the MCP
        # dual-era change rewrote result lines, the stale twins diffed
        # with both < and > lines — indistinguishable from a legitimate
        # platform difference — and the break landed on main. The exact
        # rule needs the change: a golden touched by this PR whose twin
        # was byte-identical BEFORE it (platform-independent output)
        # must keep the twin identical. The pre-commit hook auto-copies;
        # this is the same rule for whoever skipped the hook.
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha || github.event.before }}" || true
          ./tools/check_golden_twins.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: no packages/… self-imports (breaks registry installs)
        # In this repo every build runs from the root, so a
        # `$ \`packages/<name>/src/x.nu\`` import resolves and every test
        # passes. Installed from the registry the package lands under
        # deps/<name>/src/ and that path does not exist — torchpt 0.1.0
        # shipped that way and was uninstallable from the day it was
        # published. No in-repo test can catch it; this can.
        run: ./tools/check_package_imports.sh

      - name: nurlfmt --check (canonical-form gate)
        # Every first-party .nu file must be in canonical nurlfmt
        # form. build.sh above already produced build/nurlfmt, so
        # this is a cheap in-memory reformat-and-compare with no
        # extra compilation. bench/ is excluded — those .nu files are
        # recorded model outputs from the generation-accuracy study
        # and must keep the exact bytes the model emitted. The
        # repo-wide --write pass that made this pass also keeps
        # nurlfmt IR-transparent (compiler/tests/nurlfmt_idempotent.sh).
        run: ./compiler/tests/nurlfmt_check.sh

      - name: HTTP-server per-request leak gate
        # Builds the leakcheck HTTP server with ASan+LSan and fails on ANY
        # leak across 21 requests. Uses the normal build/nurlc from ./build.sh
        # above — NURL_SAN=1 instruments only the server, not the compiler
        # (whose process-lifetime arenas would otherwise dominate the report).
        run: ./tools/leakcheck/run.sh

      - name: DWARF debug-info gate
        # The plain corpus never builds with --debug, so it can't catch a
        # broken !DI emission. This builds the --debug regression
        # (dwarf_closure_drop, the -O2 inliner crash) plus the gdb
        # behavioural checks; gdb makes the source-level asserts run too.
        run: |
          sudo apt-get install -y --no-install-recommends gdb
          ./tools/dwarf_test.sh

  unikernel:
    name: unikernel (no libc, and then no operating system)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Two gates, and they are different questions. The first asks
    # whether the ordinary test corpus still runs with no libc linked —
    # 450 programs against their existing goldens, which is what keeps
    # the freestanding twin honest without a hypervisor in the loop.
    # The second boots the result under QEMU and asks whether it still
    # does with no operating system either: the boot path, the UART,
    # the memory map, the TSC, the virtio-net device, DHCP, and a
    # server that answers a client on the host.
    #
    # Neither was watched by CI until now, and both are exactly the
    # shape this repo has been bitten by twice — a gate that exists on
    # a developer's machine is a gate that drifts.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang binutils qemu-system-x86 curl

      - name: Build the compiler
        run: ./build.sh --no-tests

      - name: The corpus, with no libc at all
        # A FAIL here is a nolibc or runtime_bare bug: the program
        # linked and ran and disagreed with the golden the hosted build
        # produces. NEEDS-* columns are not failures — they are work
        # that has not been done or, for the third-party libraries a
        # unikernel never links, work that never will be.
        run: ./unikernel/run_nolibc_tests.sh

      - name: nolibc + runtime_bare unit gates
        run: ./unikernel/tests/run_unit_tests.sh

      - name: The guest, under QEMU
        # TCG, because no runner has /dev/kvm. Slower, identical
        # otherwise — except for the TSC frequency, which no leaf
        # reports there, so run_qemu.sh states it on the kernel command
        # line the way the plan says the host states the epoch.
        run: ./unikernel/run_qemu_tests.sh

  freebsd:
    name: FreeBSD (build + bootstrap fixed point + tests, in a VM)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # GitHub has no native FreeBSD runners, so run a real FreeBSD VM inside
    # the Linux runner (QEMU). This builds nurlc/nurlpkg, checks the
    # self-hosting fixed point, and runs the test corpus on genuine
    # FreeBSD — the gate that would have caught the fiber-runtime gap
    # (async fibers silently no-op'd on FreeBSD). The base system ships
    # clang, openssl and zlib, so those FFI tests build; we add bash
    # (build.sh), pkgconf and sqlite3 so the SQLite FFI corpus actually
    # runs natively on FreeBSD. libpq and libcurl are left out — postgres
    # needs a live server (its live test skips anyway) and the offline
    # http tests use the no-backend path; both classes self-skip via the
    # sentinel-aware harness when their lib is absent.
    #
    # Promoted to a hard gate 2026-06-27 after a confirmed-green run on main
    # (run 28295173147): a FreeBSD failure now fails CI. Add `freebsd` to the
    # branch-protection required-check set so it blocks merges too.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + bootstrap + test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          # The bootstrap self-compile (nurlc compiling nurlc.nu) is the
          # memory peak: it holds the whole 18k-line unit's IR + symbol
          # tables resident, and the peak grows with the compiler. Measured
          # ~13.2 GB RSS at this size (up from ~9.5 GB when this job was
          # added), so give the guest 14 GB and leave ~2 GB of the 16 GB
          # runner for the host + KVM. Raise this in step with the peak
          # rather than living 35 MB from the edge. KVM keeps it near-native.
          mem: 14336
          cpu: 3
          prepare: |
            pkg install -y bash pkgconf sqlite3
          run: |
            clang --version
            ./build.sh
            ./tools/check_examples.sh

  sanitizers:
    name: AddressSanitizer + UndefinedBehaviorSanitizer
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps (clang + optional FFI libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsqlite3-dev \
            libpq-dev \
            zlib1g-dev \
            libzstd-dev
          clang --version

      - name: ./build.sh --san (instrumented bootstrap)
        # --no-tests so the standard runner does not run with the
        # sanitised runtime; run_san_tests.sh below is the
        # sanitiser-aware corpus driver.
        run: ./build.sh --san --no-tests

      - name: self-compile leak gate (LSan) — hard, zero tolerance
        # Runs only when compiler/nurlc.nu (or the gate itself) changed: that
        # source owns the allocations this asserts about. Reuses the --san
        # build above, so the whole gate costs ~3 s.
        #
        # The July 2026 ownership campaign took `nurlc compiler/nurlc.nu` from
        # 2,793,226 leaked allocations / 33.4 MB to ZERO (peak RSS 115.9 ->
        # 18.5 MB). Nothing in CI was watching while those leaks accumulated
        # one unowned helper at a time, and leak freedom decays the same way.
        # ANY LeakSanitizer report fails this — there is no budget to raise,
        # unlike the RSS gate. ASan/UBSan findings in the same run fail too.
        if: needs.changes.outputs.compiler == 'true'
        run: ./tools/leakgate.sh

      - name: ASan + UBSan corpus
        # Leak detection is opt-in via LSAN_DETECT_LEAKS=1; NURL has
        # several process-lifetime globals (g_str_pool, g_sym_arena)
        # that are intentionally never freed. The non-leak ASan +
        # UBSan signal is what catches actual codegen bugs.
        run: ./compiler/tests/run_san_tests.sh

      - name: leak-pinned tests (LSan)
        # The whole corpus can't run leak-on — the compiler's process-lifetime
        # arenas (g_str_pool, g_sym_arena) and the brevity tests leak by design
        # — so gate the curated leak-clean set under LSAN_DETECT_LEAKS=1. Reuses
        # the --san build above; run_san_tests.sh exits non-zero on any LSan hit.
        # loop_drop_reclaim + recover_unwind pin the loop-body `% Drop` fix (a
        # loop-local Drop value is now dropped each iteration, not leaked).
        # defer_drop_reclaim + defer_scoped + defer_ret_transfer pin the
        # defer-vs-auto-drop fix (a `;` defer used to disable every owned
        # drop in the function; scoped defers emitted invalid IR).
        # net_tcpstack is the layer where the connection TABLE lives, so
        # it is the one that can leak a Tcb: a connection reclaimed on
        # RST, on FIN, or by the TIME_WAIT timer takes three different
        # paths out, and each has to return the same allocation.
        # net_socket adds the fd table on top of it — an fd outlives the
        # connection it named (FIN, then TIME_WAIT) and a connection
        # outlives its fd, so the two lifetimes have to be reclaimed
        # independently and neither may take the other's allocation with
        # it.
        # net_inet + net_frames + net_dhcp pin the sans-IO net stack's
        # manual-handle discipline (§7.4): per-iteration Vec frees in a
        # 65k-datagram sweep, String results from the address formatters,
        # and the ARP cache's owned entry table. That stack is destined
        # for a unikernel, where there is no process exit to sweep up
        # after a leak — so it is held leak-clean from its first commit.
        # The async_* set pins the fiber runtime now that it switches
        # through runtime_ctx.c instead of swapcontext: a fiber that ends
        # leaks its 68 KB stack mapping and its control block if the DONE
        # handoff is got wrong, and a missed switch annotation surfaces
        # here as an ASan stack overflow — both signals belong on a hard
        # gate, not only in the plain corpus. async_chan and async_mn
        # rejoin it here: their closures escape through `spawn`, so the
        # envs were theirs to free under §7.4 all along, and they now do.
        # closure_env_escape_loop pins §7.4 from the consumer's side —
        # it frees an escaped env by hand, exactly as the contract says a
        # consumer must, so the gate catches either way that can break:
        # the compiler freeing it too (a double free, not a leak) or the
        # program losing the ability to free it at all.
        # select_basic is here for what it makes the COMPILER do: it is
        # the only test in the corpus that compiles a `select`, so it is
        # the only input under which gen_select runs at all. The
        # self-compile gate cannot cover that path — nurlc.nu contains no
        # select — and a leak lived there unseen because of it. This step
        # leak-checks nurlc's own compile as well as the program's run,
        # so pinning the one test that reaches that code closes the hole.
        run: |
          LSAN_DETECT_LEAKS=1 ./compiler/tests/run_san_tests.sh \
            struct_nested_field_drop arm_local_drop arm_local_trailing_drop \
            recover_unwind loop_drop_reclaim closure_env_reclaim closure_env_binding \
            ternary_slice_owned match_slice_owned arm_assign_tail_drop \
            defer_drop_reclaim defer_scoped defer_ret_transfer \
            net_inet net_frames net_dhcp net_stack net_tcp net_tcp_fuzz \
            net_tcpstack net_socket \
            virtq_split free_suffix_query closure_env_escape_loop \
            ctx_switch async_basic async_chan async_mn async_sleep \
            select_basic

  webdocs-build:
    name: web docs build (fumadocs)
    needs: changes
    if: needs.changes.outputs.webdocs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Build-checks the Fumadocs (Next.js) site so a docs PR can't merge with a
    # broken build (bad MDX/frontmatter, broken TypeScript, page-tree errors)
    # and then fail in webdocs-deploy.yml after landing on main. Build only —
    # the OpenNext/Cloudflare adapt-and-deploy step stays in
    # webdocs-deploy.yml, post-merge.
    defaults:
      run:
        working-directory: webdocs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webdocs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: next build
        run: pnpm run build

# nurlfmt --check now runs as a step in the build-test job above
# (after the examples gate). The repo-wide `nurlfmt --write` pass that
# canonicalised the tree landed alongside it, so the gate the README
# pins is live: every first-party .nu file must be canonical to merge.
# Closes critic v0.9.0 Tier D #2.
