allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@fumadocs/base-ui@16.14.0'
  - fumadocs-core@16.14.0
  - fumadocs-mdx@15.2.1
# Security floors for transitive dependencies (advisories published
# 2026-09-30 / 2026-09-14): wrangler > miniflare > undici, and
# eslint > minimatch > brace-expansion. Each stays on its major.
overrides:
  undici@>=7.0.0 <7.29.1: ^7.29.1
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
# braces (GHSA-vfj7-8cjw-p6xm, deeply nested patterns → stack exhaustion)
# has no fixed release: every micromatch 4 depends on braces ^3.0.3, the
# latest. It is reached only through eslint-config-next → fast-glob, which
# expands this repo's own lint globs — no untrusted pattern reaches it, and
# nothing of it ships in the site. Drop this once a fixed braces exists.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
