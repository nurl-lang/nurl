<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Manager · anomaly</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c2230; --border: #2a3242;
    --fg: #e6edf3; --muted: #8b98a9; --accent: #4c9aff; --accent2: #6ee7b7;
    --danger: #ff6b6b; --warn: #f6c344; --ok: #56d364; --radius: 10px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
         font-size: 14px; line-height: 1.5; }
  a { color: var(--accent); text-decoration: none; }
  header { display: flex; align-items: center; gap: 20px; padding: 14px 24px;
           background: var(--panel); border-bottom: 1px solid var(--border);
           position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header h1 .logo { width: 22px; height: 22px; vertical-align: -5px; margin-right: 8px; }
  header .brand { color: var(--accent2); font-family: var(--mono); }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; }
  nav a:hover { background: var(--panel2); color: var(--fg); }
  nav a.active { background: var(--accent); color: #06122b; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  .stat { display: flex; gap: 18px; color: var(--muted); font-size: 13px; }
  .stat b { color: var(--fg); font-variant-numeric: tabular-nums; }
  button, .btn { font-family: var(--sans); font-size: 13px; border: 1px solid var(--border);
          background: var(--panel2); color: var(--fg); padding: 6px 12px; border-radius: 8px;
          cursor: pointer; transition: .12s; font-weight: 500; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06122b; }
  button.danger { color: var(--danger); }
  button.danger:hover { border-color: var(--danger); background: rgba(255,107,107,.1); }
  button.small, .btn.small { padding: 3px 8px; font-size: 12px; }
  input[type=text], input[type=number], select {
    font-family: var(--mono); font-size: 13px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
             color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--border);
             font-weight: 600; background: var(--panel2); }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border);
             font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel2); }
  tbody tr.selected { background: rgba(76,154,255,.08); }
  .name { font-family: var(--mono); font-weight: 600; color: var(--fg); cursor: pointer; }
  .name:hover { color: var(--accent); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
          font-weight: 600; border: 1px solid var(--border); }
  .pill.trained { color: var(--ok); border-color: rgba(86,211,100,.4); background: rgba(86,211,100,.08); }
  .pill.warming { color: var(--warn); border-color: rgba(246,195,68,.4); background: rgba(246,195,68,.08); }
  .actions { display: flex; gap: 6px; justify-content: flex-end; }
  .muted { color: var(--muted); }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty svg { opacity: .3; }
  /* detail drawer */
  /* A centred panel, not a side sheet: the versions table and the fine-tune
     report want the width. Below 900px it falls back to the full viewport. */
  .drawer { position: fixed; top: 3vh; left: 50%; height: 94vh; width: min(1120px, 96vw);
            background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
            z-index: 40; transform: translate(-50%, 24px); opacity: 0; pointer-events: none;
            transition: transform .2s ease, opacity .2s ease; overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .drawer.open { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  @media (max-width: 900px) {
    .drawer { top: 0; height: 100vh; width: 100vw; border-radius: 0; border: none; }
  }
  .drawer-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px;
                 border-bottom: 1px solid var(--border); position: sticky; top: 0;
                 background: var(--panel); z-index: 1; border-radius: 14px 14px 0 0; }
  .drawer-head h2 { margin: 0; font-size: 15px; font-family: var(--mono); }
  .alias-in { flex: 1; min-width: 120px; font-family: var(--sans); font-size: 13px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 9px; }
  .alias-in:focus { outline: none; border-color: var(--accent); }
  .drawer-body { padding: 20px; }
  .drawer-close { margin-left: auto; }
  .section { margin-bottom: 22px; }
  .section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
                color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-family: var(--mono); word-break: break-word; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono); font-size: 12px; background: var(--panel2);
          border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
  .chip .t { color: var(--accent2); }
  .vwrap { overflow-x: auto; }
  .vtable { width: 100%; font-size: 12px; }
  .vtable th, .vtable td { padding: 5px 6px; text-align: right; white-space: nowrap; }
  .vtable th:first-child, .vtable td:first-child { text-align: left; font-family: var(--mono); }
  .vtable input[type=number] { width: 78px; padding: 3px 6px; font-size: 12px; text-align: right; }
  .vtable input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }
  .vtable tr.off td:first-child { color: var(--muted); }
  .vtable td.dim { color: var(--muted); }
  .section-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
  .section-head h3 { margin: 0; }
  .section-head .spacer, .actions .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 11.5px; margin: 8px 0 0; line-height: 1.45; }
  textarea { width: 100%; min-height: 240px; font-family: var(--mono); font-size: 12px;
             background: var(--bg); color: var(--fg); border: 1px solid var(--border);
             border-radius: 8px; padding: 10px; resize: vertical; line-height: 1.45; }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea.bad { border-color: var(--danger); }
  details.adv { border: 1px solid var(--border); border-radius: var(--radius);
                background: var(--panel2); padding: 0; }
  details.adv > summary { cursor: pointer; padding: 10px 14px; font-size: 12px;
                          font-weight: 600; color: var(--muted); list-style: none; }
  details.adv > summary::-webkit-details-marker { display: none; }
  details.adv > summary::before { content: "\25B8 "; color: var(--accent); }
  details.adv[open] > summary::before { content: "\25BE "; }
  details.adv > summary:hover { color: var(--fg); }
  .adv-body { padding: 0 14px 14px; }
  /* Generated metadata editor: one row per leaf, nested groups indented. */
  .adv-tabs { display: flex; gap: 4px; margin: 0 0 10px; }
  .adv-tabs .tab { font-size: 11.5px; padding: 4px 10px; }
  .adv-tabs .tab.on { border-color: var(--accent); color: var(--fg); }
  .advg { margin: 0 0 10px; }
  .advg.sub { margin: 6px 0 6px 12px; padding-left: 10px;
              border-left: 1px solid var(--border); }
  .advg-h { font-family: var(--mono); font-size: 11.5px; color: var(--muted);
            margin: 0 0 4px; }
  .advf { display: flex; align-items: center; gap: 10px; padding: 2px 0; }
  .advf > span { flex: 0 0 46%; font-family: var(--mono); font-size: 11.5px;
                 color: var(--fg); overflow-wrap: anywhere; }
  .advf > input[type=text] { flex: 1; min-width: 0; }
  .ae-grid { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: 13px;
             margin-bottom: 12px; }
  .ae-grid dt { color: var(--muted); }
  .ae-grid dd { margin: 0; font-family: var(--mono); word-break: break-word; }
  .ae-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .ae-form .field input { width: 130px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: var(--muted); margin-right: 6px; vertical-align: 1px; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--warn); }
  .sched-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .field input { width: 110px; }
  /* Help glyphs and the collapsible explainer: every alert-affecting
     control says which way to move it. */
  .q { display: inline-block; width: 14px; height: 14px; line-height: 14px; text-align: center;
       border-radius: 50%; border: 1px solid var(--border); color: var(--muted); font-size: 10px;
       font-weight: 700; cursor: help; vertical-align: 1px; font-family: var(--sans);
       text-transform: none; letter-spacing: 0; }
  .q:hover { border-color: var(--accent); color: var(--accent); }
  details.help { margin-top: 8px; font-size: 12px; color: var(--muted); }
  details.help > summary { cursor: pointer; color: var(--accent); font-weight: 500; }
  details.help p { margin: 6px 0 0; line-height: 1.5; }
  .small-lbl { font-size: 11.5px; }
  .section-head select { padding: 3px 8px; font-size: 12px; }
  .cal-note { font-size: 12px; color: var(--muted); margin: 0 0 8px; min-height: 18px; }
  .cal-note b { color: var(--fg); }
  .vtable input[type=text] { width: 68px; padding: 3px 6px; font-size: 12px; text-align: right; }
  .ft-table { margin-top: 10px; }
  .field .unit { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .field .unit input { width: 80px; }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
              padding-bottom: 7px; cursor: pointer; }
  label.chk input { accent-color: var(--accent); }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 30;
              opacity: 0; pointer-events: none; transition: opacity .2s; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  /* toasts */
  #toasts { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex;
            flex-direction: column; gap: 10px; }
  .toast { background: var(--panel2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
           padding: 12px 16px; border-radius: 8px; min-width: 240px; max-width: 380px;
           box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: slidein .2s; font-size: 13px; }
  .toast.ok { border-left-color: var(--ok); }
  .toast.err { border-left-color: var(--danger); }
  .toast .th { font-weight: 600; margin-bottom: 2px; }
  @keyframes slidein { from { transform: translateX(30px); opacity: 0; } }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--border);
          border-top-color: var(--accent); border-radius: 50%; animation: rot .7s linear infinite;
          vertical-align: -2px; }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1><img class="logo" src="/favicon.svg" alt=""><span class="brand">anomaly</span> · Model Manager</h1>
  <nav>
    <a href="/modelmanager.html" class="active">Models</a>
    <a href="/modeltrainer.html">Trainer</a>
    <a href="/visualize.html">Visualize</a>
    <a href="/anomalies.html">Anomalies</a>
  </nav>
</header>

<main>
  <div class="toolbar">
    <button class="primary" onclick="load()">↻ Refresh</button>
    <label class="muted" style="display:flex;align-items:center;gap:6px;font-size:13px;">
      <input type="checkbox" id="auto"> auto (5s)
    </label>
    <div class="spacer"></div>
    <div class="stat">
      <span><b id="statCount">0</b> models</span>
      <span>min pts <b id="statMin">–</b></span>
      <span>default max pts <b id="statMax">–</b></span>
    </div>
  </div>

  <table id="tbl">
    <thead>
      <tr>
        <th>Model</th>
        <th>Status</th>
        <th style="text-align:right" title="Points in the ring now — the newest max_data_points are kept. The lifetime count follows when the oldest have been evicted.">Stored</th>
        <th style="text-align:right" title="Features the model scores on (one-hot and calendar columns included), frozen at the last train; before that, the columns it has seen">Features</th>
        <th>Created</th>
        <th>Last trained</th>
        <th>Versions</th>
        <th style="text-align:right">Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">
    <div style="font-size:15px;margin-bottom:6px">No models yet</div>
    <div>Feed data via the <a href="/modeltrainer.html">Trainer</a> or <code>POST /detect/&lt;model&gt;</code>.</div>
  </div>
</main>

<div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="dTitle">model</h2>
    <input id="dAlias" class="alias-in" placeholder="add a nickname" title="A display name for this model. The model's real name never changes.">
    <button class="small" id="dAliasSave" onclick="saveAlias()">Save</button>
    <button class="small drawer-close" onclick="closeDrawer()">✕ Close</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
</div>

<div id="toasts"></div>

<script src="/auth.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let MODELS = {};      // name -> meta
let SELECTED = null;
let autoTimer = null;

function toast(msg, kind, title) {
  const t = document.createElement("div");
  t.className = "toast " + (kind || "");
  t.innerHTML = (title ? '<div class="th">' + esc(title) + "</div>" : "") + esc(msg);
  $("toasts").appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s";
                     setTimeout(() => t.remove(), 300); }, kind === "err" ? 5000 : 2800);
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}
async function api(method, url, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt);
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((data && data.message) || (r.status + " " + r.statusText));
  return data;
}

// `last_trained_at` is a point counter (n_seen at the last retrain), not a
// clock time — render it as a point mark.
function fmtTrained(n) {
  if (!n || n <= 0) return '<span class="muted">never</span>';
  return '@ ' + Number(n).toLocaleString() + ' pts';
}
function versionSummary(meta) {
  const v = meta.versions || {};
  const names = Object.keys(v);
  const on = names.filter(n => v[n].enabled).length;
  return names.length ? (on + "/" + names.length + " on") : "–";
}
function isTrained(meta) {
  return (meta.last_trained_at || 0) > 0;
}

async function load() {
  try {
    const d = await api("GET", "/models/dynamic");
    MODELS = d.models || {};
    $("statMin").textContent = d.min_data_points ?? "–";
    $("statMax").textContent = (d.max_data_points ?? "–").toLocaleString?.() ?? d.max_data_points;
    render();
    if (SELECTED && MODELS[SELECTED]) renderDrawer(SELECTED);
  } catch (e) {
    toast(e.message, "err", "Load failed");
  }
}

// A model's own name is often whatever created it — a hash, here. The
// listing leads with the nickname when there is one and keeps the real
// name beside it, because that is what every route and every log is
// keyed on.
function modelLabel(name) {
  const a = (MODELS[name] || {}).alias;
  return a && a.length ? a : name;
}

// The ring's fill first — that is what the model trains and scans on —
// and the lifetime count beside it once they differ, i.e. once the ring
// has been full and the oldest points have left it.
function storedCell(m) {
  const seen = m.n_points_seen ?? 0, stored = m.n_points_stored ?? seen;
  return stored.toLocaleString() + (seen > stored
    ? ' <span class="muted" title="points ever seen by this model; the oldest ' + (seen - stored).toLocaleString() +
      ' have been evicted from the ring">· seen ' + seen.toLocaleString() + "</span>" : "");
}
function featCell(m) {
  const feats = m.feature_names || [], nc = Object.keys(m.column_types || {}).length;
  if (feats.length) return '<span title="' + esc(feats.join(", ")) + '">' + feats.length + "</span>" +
    (nc && nc !== feats.length ? ' <span class="muted">/ ' + nc + " col" + (nc === 1 ? "" : "s") + "</span>" : "");
  return nc ? '<span class="muted" title="columns seen; the feature order is frozen at the first train">' + nc + " col" + (nc === 1 ? "" : "s") + "</span>"
            : '<span class="muted">–</span>';
}

// A model's stored points as a file. Through fetch, not a link: with
// sign-in on, the token travels only with a wrapped fetch.
async function downloadFile(url, filename, btn) {
  const orig = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try {
    const r = await fetch(url);
    if (!r.ok) {
      let m = ""; try { m = (await r.json()).message || ""; } catch (e) {}
      throw new Error(m || ("HTTP " + r.status));
    }
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast((r.headers.get("X-Rows") || "?") + " rows → " + filename, "ok", "exported");
  } catch (e) {
    toast(e.message, "err", "export failed");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
}
function exportModel(name, fmt, btn) {
  return downloadFile("/models/dynamic/" + enc(name) + "/export?format=" + fmt, name + "." + fmt, btn);
}

function render() {
  const names = Object.keys(MODELS)
    .sort((a, b) => modelLabel(a).localeCompare(modelLabel(b)));
  $("statCount").textContent = names.length;
  const rows = $("rows");
  rows.innerHTML = "";
  $("empty").style.display = names.length ? "none" : "block";
  $("tbl").style.display = names.length ? "" : "none";
  for (const name of names) {
    const m = MODELS[name];
    const tr = document.createElement("tr");
    if (name === SELECTED) tr.className = "selected";
    const trained = isTrained(m);
    tr.innerHTML =
      '<td><span class="name" data-m="' + esc(name) + '">' + esc(modelLabel(name)) + "</span>" +
        (m.alias ? '<div class="muted" style="font-family:var(--mono);font-size:11px">' +
                   esc(name) + "</div>" : "") + "</td>" +
      '<td><span class="pill ' + (trained ? "trained" : "warming") + '">' +
        (trained ? "trained" : "warming") + "</span></td>" +
      '<td style="text-align:right;white-space:nowrap">' + storedCell(m) + "</td>" +
      '<td style="text-align:right">' + featCell(m) + "</td>" +
      "<td>" + esc(m.created || "–") + "</td>" +
      "<td>" + fmtTrained(m.last_trained_at) + "</td>" +
      "<td>" + versionSummary(m) + "</td>" +
      '<td><div class="actions">' +
        '<a class="btn small" href="/anomalies.html?model=' + enc(name) + '" title="Scan this model\'s stored points: what was flagged, when, and why">Anomalies</a>' +
        '<a class="btn small" href="/visualize.html?model=' + enc(name) + '" title="Plot any numeric feature of this model over time">Visualize</a>' +
        '<button class="small" data-act="train" data-m="' + esc(name) + '" title="Retrain the forests on the stored points now; margins are kept">Train</button>' +
        '<button class="small" data-act="finetune" data-m="' + esc(name) + '" title="Set every margin so 1 % of the last 24 h would be flagged">Finetune</button>' +
        '<button class="small" data-act="reset" data-m="' + esc(name) + '">Reset</button>' +
        '<button class="small danger" data-act="delete" data-m="' + esc(name) + '">Delete</button>' +
      "</div></td>";
    rows.appendChild(tr);
  }
  rows.querySelectorAll(".name").forEach(el =>
    el.onclick = () => openDrawer(el.dataset.m));
  rows.querySelectorAll("button[data-act]").forEach(el =>
    el.onclick = () => doAction(el.dataset.act, el.dataset.m, el));
}

async function doAction(act, name, btn) {
  if (act === "delete" && !confirm('Delete model "' + name + '"? This removes all data and forests.')) return;
  if (act === "reset" && !confirm('Reset model "' + name + '"? Drops data and forests, keeps the name.')) return;
  if (act === "finetune" && !confirm('Fine-tune "' + name + '"? Sets every enabled version\'s margin so that 1 % of the last 24 h of stored points would be flagged. Open the model to preview or pick another rate.')) return;
  const orig = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try {
    let d;
    if (act === "train")        d = await api("POST", "/force_train/" + enc(name));
    else if (act === "reset")   d = await api("POST", "/models/dynamic/" + enc(name) + "/reset");
    else if (act === "delete")  d = await api("DELETE", "/delete_model/" + enc(name));
    else if (act === "finetune")d = await api("POST", "/api/dynamic/" + enc(name) + "/finetune", { rate: 0.01 });
    toast((d && d.message) || "OK", "ok", act);
    if (act === "delete" && SELECTED === name) closeDrawer();
    await load();
  } catch (e) {
    toast(e.message, "err", act + " failed");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
}
const enc = encodeURIComponent;

// ── Detail drawer ──────────────────────────────────────────────
// The alias is a label the dashboard shows in place of the model's own
// name, which is often whatever created it — a hash, usually. The name
// itself is what every route is keyed on and never changes.
async function saveAlias() {
  if (!SELECTED) return;

    const r = await api("PUT", "/models/dynamic/" + enc(SELECTED) + "/metadata",
                        { alias: $("dAlias").value.trim() });
    MODELS[SELECTED] = r;
    toast("Nickname saved");
    render();
  } catch (e) {
    toast(e.message, true);
  }

}

async function openDrawer(name) {

function closeDrawer() {

// ── Detail drawer: the model's settings, explained ────────────────
//
// Every control that changes what gets flagged carries a `?` with the same
// three things: what the number means, which way to move it for fewer or
// more alerts, and when it takes effect. The texts are the contract the
// API documents, in plain words; keep them in step with README "Conventions".
const HELP = {
  rule: "Every enabled version scores each point; the score goes negative as the " +
    "point gets more unusual. A version flags the point when score ≤ −margin, and " +
    "the model reports an anomaly when ANY enabled version flags it. " +
    "severity = −score / margin, so 1.0 is exactly the alert line and 2.0 is twice " +
    "as far past it. Fewer alerts: raise the margin (or fine-tune to a lower rate). " +
    "More alerts: lower it.",
  margin: "Alert line of this version. A point is flagged when its score ≤ −margin.\n" +
    "• Raise the margin → fewer alerts (only the most extreme points).\n" +
    "• Lower it → more alerts; 0 flags anything the forest finds even slightly unusual.\n" +
    "Takes effect at the next point. The flags column shows what the value you type " +
    "would have flagged in the calibration window; Fine-tune sets it from a target rate.",
  margin_ae: "Alert line of the autoencoder, relative to its reconstruction threshold: " +
    "a point is flagged when its reconstruction error ≥ threshold × (1 + margin).\n" +
    "• 0 flags at the threshold itself; 0.5 only points that reconstruct 50 % worse than it.\n" +
    "• Raise → fewer alerts. Lower → more alerts. Takes effect at the next point.",
  contamination: "How large a share of its own training data the forest should treat " +
    "as outliers when it sets its zero line. \"auto\" is the isolation-forest default; " +
    "a number such as 0.01 (= 1 %) moves the zero line so that about 1 % of the " +
    "training points score below it.\n" +
    "• Raise → more alerts. Lower → fewer alerts.\n" +
    "Takes effect at the next retrain. The margin is applied on top and works at once — " +
    "prefer the margin for day-to-day tuning.",
  flags: "How many stored points in the calibration window this version flags at the " +
    "margin shown — its past alert rate. Type a new margin and this updates to what " +
    "that margin would have flagged. Ties in the data can make the count jump.",
  window: "The data the forest is trained on: minutes / points back for a time window, " +
    "or size × step for the shape (timevector) version. Changes at the next retrain; " +
    "edit them in Advanced.",
  trees: "Isolation-forest size: trees × samples per tree. More trees make the score " +
    "steadier, not stricter. Changes at the next retrain; edit in Advanced.",
  rate: "The share of stored points you are willing to alert on. 1 % of a feed at one " +
    "point per minute is about 14 alerts a day; 0.1 % about one or two. Fine-tune picks, " +
    "per version, the margin that flags this share of the window, and rounds it to " +
    "the fewest digits that keep the count (ties can make it a little more or less).",
  calwin: "The stored points that calibration and fine-tune look at, counted back from " +
    "the newest stored point (not the clock, so a stopped feed still calibrates on its " +
    "last day). The choices are the versions' own periods; pick the one that looks like " +
    "the future you want to alert on — a day for a feed with a daily rhythm, a week if " +
    "weekends differ, or 'own' to tune every version on its own period. On a count-clock " +
    "model the windows are point counts (1 point = 1 tick).",
  clock: "How the model measures time. 'time': every point carries a timestamp and " +
    "windows are durations. 'count': the data had no timestamps, so points are simply " +
    "numbered (#1, #2, …) and every window is a number of points — the model never " +
    "invents real times. Set at import; changeable only while the model holds no points.",
  threshold: "Reconstruction error at which the autoencoder starts calling a point " +
    "unusual, set at training from the error distribution of the training data. " +
    "The margin is relative to this.",
  prefilter: "Before the autoencoder trains, an isolation-forest pre-filter drops this " +
    "share of the ring as outliers so the net learns normal behaviour only. \"auto\" " +
    "is the forest default. Kept for automatic retrains.",
  sched_ae: "Also retrain the autoencoder whenever the forests retrain, with the layer " +
    "sizes and pre-filter of its last manual training. Off by default. Turn it on for " +
    "a feed whose normal drifts — an autoencoder trained once on a summer week calls " +
    "every autumn point unusual.",
  sched: "The forests retrain automatically every N stored points: one cadence while " +
    "the ring is still filling, another once it holds max points. Retraining keeps " +
    "the margins.",
  hidden: "Layer sizes of the autoencoder between input and output, e.g. 64,32,64. " +
    "Smaller middle layers force a stronger summary of what is normal. Empty keeps the " +
    "trained layout; a first train uses 64,32,64.",
};
function q(key) { return '<span class="q" title="' + esc(HELP[key]) + '">?</span>'; }
function th(label, key) { return "<th" + (key ? ' title="' + esc(HELP[key]) + '"' : "") + ">" + label + (key ? " " + q(key) : "") + "</th>"; }

// Numbers on screen: four significant digits, no trailing zeros. The
// stored value is what the input carries; this is only how it reads.
function fmtNum(x) {
  if (x === null || x === undefined) return "–";
  if (typeof x !== "number") return esc(x);
  if (x === 0) return "0";
  return String(Number(x.toPrecision(4)));
}
function fmtPct(num, den) {
  if (!den) return "–";
  const p = 100 * num / den;
  return (p >= 10 ? p.toFixed(0) : p >= 1 ? p.toFixed(1) : p.toFixed(2)) + " %";
}
// COUNT is the open model's clock: a model imported without timestamps
// counts points instead (metadata `clock: "count"`). Every stored "time" is
// then an ordinal, and every window is a number of points — never a date.
let COUNT = false;
function fmtWhen(ts) {
  if (!ts || ts <= 0) return '<span class="muted">–</span>';
  if (COUNT) return "#" + Math.round(ts / 60).toLocaleString();
  return esc(new Date(ts * 1000).toLocaleString());
}

// The calibration window. `CAL` holds the last report for the open model;
// the flags column and the fine-tune preview both read from it.
let CAL_LAST = "86400";
let CAL = null;
// The windows are the versions' own periods, so "tune on the last 24 h" and
// "tune on what the daily forest looks at" are the same choice. Values are
// seconds; on a count clock the same value is read as points (1 point = one
// tick of 60 s), so 86400 → 1440 points. `own` gives every version its own
// period (short_term 3 h, daily 24 h, weekly 7 d, seasonal 90 d, timevector
// its window of points) — calibration, which is one window, shows 24 h then.
const CAL_WINDOWS = [["10800", "3 h", "short_term"], ["86400", "24 h", "daily"],
                     ["604800", "7 d", "weekly"], ["7776000", "90 d", "seasonal"],
                     ["all", "all", ""], ["own", "own", "each version its own period"]];
function calLabel(v, l, vn) {
  if (v === "own") return "own · " + vn;
  if (v === "all") return "all stored points";
  const secs = parseInt(v, 10);
  return (COUNT ? (secs / 60).toLocaleString() + " pts" : l) + (vn ? " · " + vn : "");
}
// What `last=` carries for the current selection: seconds on a time clock,
// points on a count clock. `own` is only meaningful to fine-tune; the
// calibration view falls back to a day.
function calLastParam(forFinetune) {
  if (CAL_LAST === "all") return "all";
  if (CAL_LAST === "own") return forFinetune ? "own" : (COUNT ? 1440 : 86400);
  const secs = parseInt(CAL_LAST, 10);
  return COUNT ? Math.max(1, Math.round(secs / 60)) : secs;
}

// How many of the window a margin would flag, read off the calibration
// curve (rate → margin, margins fall as the rate rises). Approximate to the
// curve's 0.1 % / 1 % steps; the exact count needs the service.
function rateForMargin(cv, m) {
  if (!cv || !Array.isArray(cv.curve) || !cv.curve.length) return null;
  let best = 0;
  for (const [rate, margin] of cv.curve) { if (margin >= m) best = rate; else break; }
  return best;
}

function calCell(vn, m) {
  const cv = CAL && CAL.versions && CAL.versions[vn];
  if (!cv) return '<span class="muted">–</span>';
  const same = Math.abs(m - cv.margin) < 1e-12;
  if (same) return cv.flagged + " / " + cv.n + ' <span class="muted">(' + fmtPct(cv.flagged, cv.n) + ")</span>";
  const r = rateForMargin(cv, m);
  if (r === null) return '<span class="muted">–</span>';
  return '≈ ' + Math.round(r * cv.n) + " / " + cv.n + ' <span class="muted">(' + fmtPct(r * cv.n, cv.n) + ")</span>";
}

async function loadCal(name) {
  CAL = null;
  const box = $("calNote");
  if (!MODELS[name] || !isTrained(MODELS[name])) { if (box) box.textContent = ""; return; }
  if (box) box.innerHTML = '<span class="spin"></span> calibrating…';
  try {
    const d = await api("GET", "/models/dynamic/" + enc(name) + "/calibration?last=" + calLastParam(false));
    if (SELECTED !== name) return;
    CAL = d;
    if (box) box.innerHTML = "window: <b>" + (d.window.rows || 0).toLocaleString() + "</b> of " +
      (d.window.total || 0).toLocaleString() + " stored points · flagged by any version: <b>" +
      (d.aggregate.flagged || 0) + "</b> (" + fmtPct(d.aggregate.flagged || 0, d.window.rows || 0) + ")";
    refreshCalCells();
  } catch (e) {
    if (box) box.innerHTML = '<span class="muted">' + esc(e.message) + "</span>";
  }
}
function refreshCalCells() {
  const t = $("vTbl");
  if (!t) return;
  t.querySelectorAll("td[data-cal]").forEach(td => {
    const vn = td.dataset.cal;
    const inp = t.querySelector('input[data-v="' + CSS.escape(vn) + '"][data-f="margin"]');
    const m = inp ? parseFloat(inp.value) : NaN;
    td.innerHTML = isFinite(m) ? calCell(vn, m) : '<span class="muted">–</span>';
  });
}

// The hidden layers a trained net has: its layer list minus the input
// and output ends — what the layout box shows, and what a retrain with
// the box left empty keeps.
function aeHiddenOf(ae) {
  const ls = ae && ae.trained && Array.isArray(ae.layer_sizes) ? ae.layer_sizes : [];
  return ls.length > 2 ? ls.slice(1, -1).join(",") : "";
}

      '<span class="spacer"></span>' +
      '<button class="ro" id="expCsv" title="Download every stored point as CSV: one column per field, timestamp first">Export CSV</button>' +
      '<button class="ro" id="expJsonl" title="Download every stored point as JSON Lines — the stored records as they are; the importer takes the file back">Export JSONL</button>' +
    "</div></div>";

  $("expCsv").onclick   = (e) => exportModel(name, "csv", e.currentTarget);
  $("expJsonl").onclick = (e) => exportModel(name, "jsonl", e.currentTarget);
  $("vSave").onclick    = (e) => saveVersions(name, e.currentTarget);
  $("schedSave").onclick= (e) => saveSchedule(name, e.currentTarget);
  $("aeTrain").onclick  = (e) => trainAE(name, e.currentTarget);
  $("ftPreview").onclick= (e) => runFinetune(name, false, e.currentTarget);
  $("ftApply").onclick  = (e) => runFinetune(name, true, e.currentTarget);
  $("calWin").onchange  = (e) => { CAL_LAST = e.target.value; loadCal(name); };
  $("advApply").onclick = (e) => applyAdvanced(name, e.currentTarget);
  $("advRevert").onclick= () => { advShow(m, ADV_TAB); };
  $("advTabF").onclick  = () => advSwitch(m, "fields");
  $("advTabJ").onclick  = () => advSwitch(m, "json");
  $("advText").value = advSource(m);
  advSwitch(m, ADV_TAB, true);
  $("vTbl").querySelectorAll("input").forEach(el => {
    el.onchange = () => { const tr = el.closest("tr");
                          if (el.dataset.f === "enabled") tr.classList.toggle("off", !el.checked); };
    if (el.dataset.f === "margin") el.oninput = refreshCalCells;
  });
  if (CAL && CAL.model === name) refreshCalCells(); else loadCal(name);
}

// ── Advanced metadata editor ───────────────────────────────────
//
// Two views over ONE thing: the editable half of the metadata. Neither
// view names a field. The top-level keys come from `editable_fields`,
// which the service publishes beside the metadata (it is the same list
// model_apply_meta_patch reads), and everything below them is walked out
// of the metadata's own shape. That is the point: `max_data_points`
// became patchable through the API and stayed invisible in the editor
// that exists to reach it, because the editor kept its own hard-coded
// copy of the key list.
let ADV_LEAVES = [];        // [{ path: [...], bool: <is a checkbox> }]
let ADV_TAB = "fields";

function editableSlice(m) {
  const keys = Array.isArray(m.editable_fields) && m.editable_fields.length
    ? m.editable_fields : ["schedule", "versions"];
  const out = {};
  keys.forEach(k => { if (m[k] !== undefined) out[k] = m[k]; });
  return out;
}

// The same slice, pretty-printed for the JSON view.
function advSource(m) { return JSON.stringify(editableSlice(m), null, 2); }

// One typed input per leaf, nested groups for objects. Rebuilt on every
// render, so ADV_LEAVES always describes the inputs now on screen.
function advForm(m) {
  ADV_LEAVES = [];
  const slice = editableSlice(m);
  const body = Object.keys(slice).map(k => advNode(k, slice[k], [k], 0)).join("");
  return body || '<p class="muted">nothing editable</p>';
}

function advNode(label, val, path, depth) {
  if (val && typeof val === "object" && !Array.isArray(val)) {
    const inner = Object.keys(val).map(k => advNode(k, val[k], path.concat(k), depth + 1)).join("");
    return '<div class="advg' + (depth ? " sub" : "") + '">' +
      '<div class="advg-h">' + esc(label) + "</div>" +
      (inner || '<p class="muted">empty</p>') + "</div>";
  }
  const i = ADV_LEAVES.length;
  ADV_LEAVES.push({ path, bool: typeof val === "boolean" });
  const input = typeof val === "boolean"
    ? '<input type="checkbox" data-adv="' + i + '"' + (val ? " checked" : "") + ">"
    : '<input type="text" data-adv="' + i + '" value="' + esc(String(val ?? "")) + '">';
  return '<label class="advf"><span>' + esc(label) + "</span>" + input + "</label>";
}

// Rebuild the patch from the generated form. A box left empty is an
// OMITTED field, which is what the endpoint's "omitted fields keep their
// value" contract means — not a zero. Text is sent as a number when it
// reads as one and as itself when it does not, because `contamination` is
// legitimately either 0.05 or "auto" and guessing either way would drop
// half of that.
function advCollect() {
  const out = {};
  document.querySelectorAll("#advFields [data-adv]").forEach(el => {
    const leaf = ADV_LEAVES[+el.dataset.adv];
    if (!leaf) return;
    let v;
    if (leaf.bool) v = el.checked;
    else {
      const raw = el.value.trim();
      if (raw === "") return;
      const x = Number(raw);
      v = isFinite(x) ? x : el.value;
    }
    let o = out;
    for (let k = 0; k < leaf.path.length - 1; k++) {
      const key = leaf.path[k];
      o = (o[key] && typeof o[key] === "object") ? o[key] : (o[key] = {});
    }
    o[leaf.path[leaf.path.length - 1]] = v;
  });
  return out;
}

// Switch views without losing what was typed: the form's current state is
// what the JSON box is filled from, and the JSON box is what the form is
// rebuilt from. `initial` skips that carry-over on first render.
function advSwitch(m, tab, initial) {
  if (!initial && tab !== ADV_TAB) {
    if (tab === "json") $("advText").value = JSON.stringify(advCollect(), null, 2);
    else {
      let parsed = null;
      try { parsed = JSON.parse($("advText").value); } catch (e) {}
      if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
        $("advFields").innerHTML = advForm(Object.assign({}, parsed,
          { editable_fields: Object.keys(parsed) }));
      } else {
        toast("the JSON does not parse — the fields still show the saved metadata",
              "err", "Invalid JSON");
      }
    }
  }
  ADV_TAB = tab;
  $("advFields").style.display  = tab === "fields" ? "" : "none";
  $("advJsonBox").style.display = tab === "json" ? "" : "none";
  $("advTabF").classList.toggle("on", tab === "fields");
  $("advTabJ").classList.toggle("on", tab === "json");
}

// Revert: drop every edit in both views and show the saved metadata again.
function advShow(m, tab) {
  $("advFields").innerHTML = advForm(m);
  $("advText").value = advSource(m);
  $("advText").classList.remove("bad");
  ADV_TAB = null;
  advSwitch(m, tab || "fields", true);
}

// PUT a patch and adopt the metadata the service echoes back.
async function putMeta(name, patch, btn, what) {
  const orig = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try {
    const d = await api("PUT", "/models/dynamic/" + enc(name) + "/metadata", patch);
    if (d && d.metadata) MODELS[name] = d.metadata;
    toast((d && d.message) || "Saved", "ok", what);
    renderDrawer(name);
    render();
    return true;
  } catch (e) {
    toast(e.message, "err", what + " failed");
    return false;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
}

// Apply whichever view is showing — they produce the same patch shape.
function applyAdvanced(name, btn) {
  let patch;
  if (ADV_TAB === "fields") {
    patch = advCollect();
    if (!Object.keys(patch).length) {
      toast("every field is empty — nothing to send", "err", "Nothing to update"); return;
    }
  } else {
    const ta = $("advText");
    try { patch = JSON.parse(ta.value); }
    catch (e) { ta.classList.add("bad"); toast(e.message, "err", "Invalid JSON"); return; }
    ta.classList.remove("bad");
    if (!patch || typeof patch !== "object" || Array.isArray(patch)) {
      toast("expected a JSON object", "err", "Invalid JSON"); return;
    }
  }
  if ($("advReplace").checked) patch.replace_versions = true;
  return putMeta(name, patch, btn, "metadata");
}

function saveVersions(name, btn) {
  const versions = {};
  let bad = null;
  $("vTbl").querySelectorAll("input[data-v]").forEach(el => {
    const v = versions[el.dataset.v] || (versions[el.dataset.v] = {});
    if (el.dataset.f === "enabled") v.enabled = el.checked;
    else if (el.dataset.f === "contamination") {
      const raw = el.value.trim().toLowerCase();
      if (raw === "" || raw === "auto") v.contamination = "auto";
      else {
        const x = parseFloat(raw);
        if (isFinite(x) && x > 0 && x <= 0.5) v.contamination = x;
        else bad = el.dataset.v + ": contamination must be auto or a number in (0, 0.5]";
      }
    } else {
      const x = parseFloat(el.value);
      if (isFinite(x) && x >= 0) v.decision_margin = x;
      else bad = el.dataset.v + ": margin must be a number ≥ 0";
    }
  });
  if (bad) { toast(bad, "err", "Not saved"); return; }
  return putMeta(name, { versions }, btn, "versions").then(ok => { if (ok) loadCal(name); });
}

// Fine-tune: one POST for preview (dry_run) and apply. The response is the
// same shape either way, so the table is rendered by one function.
async function runFinetune(name, apply, btn) {
  const pct = parseFloat($("ftRate").value);
  if (!isFinite(pct) || pct < 0 || pct > 100) { toast("rate must be 0–100 %", "err", "Fine-tune"); return; }
  const orig = btn.textContent;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const d = await api("POST", "/api/dynamic/" + enc(name) + "/finetune",
                        { rate: pct / 100, last: calLastParam(true), dry_run: !apply });
    renderFinetune(d);
    if (apply) {
      toast(d.message || "margins written", "ok", "Fine-tune");
      const meta = await api("GET", "/models/dynamic/" + enc(name) + "/metadata");
      MODELS[name] = meta;
      CAL = null;
      renderDrawer(name);
      $("ftRate").value = pct;
      renderFinetune(d);
      render();
    }
  } catch (e) {
    toast(e.message, "err", "Fine-tune failed");
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}
function renderFinetune(d) {
  const out = $("ftOut");
  if (!out) return;
  const vs = d.versions || {};
  const names = Object.keys(vs);
  if (!names.length) { out.innerHTML = '<p class="muted">no enabled, trained version to tune</p>'; return; }
  const rows = names.map(vn => {
    const v = vs[vn];
    const up = v.new_margin > v.old_margin;
    return "<tr><td>" + esc(vn) + "</td>" +
      '<td class="dim">' + (v.rows ?? v.n ?? 0).toLocaleString() + " pts</td>" +
      '<td class="dim">' + fmtNum(v.old_margin) + "</td>" +
      "<td>" + (up ? "↑ " : v.new_margin < v.old_margin ? "↓ " : "= ") + fmtNum(v.new_margin) + "</td>" +
      '<td class="dim">' + v.flagged_before + " <span class=\"muted\">(" + fmtPct(v.flagged_before, v.n) + ")</span></td>" +
      "<td>" + v.flagged_after + " <span class=\"muted\">(" + fmtPct(v.flagged_after, v.n) + ")</span></td>" +
      "<td>" + (v.applied ? '<span class="pill trained">written</span>' : '<span class="pill">preview</span>') + "</td></tr>";
  }).join("");
  out.innerHTML = '<table class="vtable ft-table"><thead><tr><th>version</th>' +
    '<th title="The stored points this version was tuned on. With “own” every version has its own window.">window</th><th>margin now</th>' +
    "<th>new margin</th><th>flags now</th><th>flags after</th><th></th></tr></thead><tbody>" + rows +
    "</tbody></table>" + '<div class="cal-note">' + (d.dry_run ? "Preview — nothing written. " : "") +
    "Window: " + (d.window && d.window.rows || 0).toLocaleString() + " points" +
    (d.window && d.window.own ? " (the widest; each version tuned on its own period)" : "") +
    ", target " + fmtPct(d.rate || 0, 1) + ".</div>";
}

async function trainAE(name, btn) {
  const body = {};
  const hs = ($("aeHidden").value || "").split(",").map(x => parseInt(x, 10)).filter(x => x > 0);
  if (hs.length) body.hidden = hs;
  const c = parseFloat($("aeCont").value);
  if (isFinite(c) && c > 0) body.contamination = c;
  const orig = btn.textContent;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const d = await api("POST", "/train/autoencoder/" + enc(name), body);
    toast("trained on " + (d.training_data_points ?? "?") + " pts, " +
          (d.filtered_anomalies ?? 0) + " filtered", "ok", "autoencoder");
    CAL = null;
    await openDrawer(name);
  } catch (e) {
    toast(e.message, "err", "Autoencoder failed");
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}

function saveSchedule(name, btn) {
  const below = parseInt($("schedBelow").value, 10) || 0;
  const at = parseInt($("schedAt").value, 10) || 0;
  const aeToo = !!$("schedAe").checked;
  return putMeta(name, { schedule: { below_max: below, at_max: at, autoencoder: aeToo } }, btn, "schedule");
}

$("auto").onchange = (e) => {
  if (e.target.checked) autoTimer = setInterval(load, 5000);
  else { clearInterval(autoTimer); autoTimer = null; }
};
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

// deep link ?model=NAME opens the drawer
const qp = new URLSearchParams(location.search);
Auth.ready().then(() => {
  // A viewer sees what the organization has, and reads it. The controls
  // that would change a model are not disabled — they are not there.
  Auth.viewerNotice("Changing models, training and deleting are for administrators.");
  if (!Auth.canWrite()) {
    const st = document.createElement("style");
    st.textContent = ".actions button:not(.ro){display:none!important}#dAlias,#dAliasSave{display:none!important}" +
      ".drawer-body button:not(.drawer-close):not(.ro){display:none!important}" +
      ".drawer-body input,.drawer-body select,.drawer-body textarea{pointer-events:none;opacity:.55}";
    document.head.appendChild(st);
  }
}).then(load).then(() => { const m = qp.get("model"); if (m && MODELS[m]) openDrawer(m); });
</script>
</body>
