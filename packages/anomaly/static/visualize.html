<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualize · anomaly</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c2230; --border: #2a3242;
    --fg: #e6edf3; --muted: #8b98a9; --accent: #4c9aff; --accent2: #6ee7b7;
    --danger: #ff6b6b; --warn: #f6c344; --ok: #56d364; --radius: 10px; --grid: #212836;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }
  a { color: var(--accent); text-decoration: none; }
  header { display: flex; align-items: center; gap: 20px; padding: 14px 24px; background: var(--panel);
           border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header h1 .logo { width: 22px; height: 22px; vertical-align: -5px; margin-right: 8px; }
  header .brand { color: var(--accent2); font-family: var(--mono); }
  nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; }
  nav a:hover { background: var(--panel2); color: var(--fg); }
  nav a.active { background: var(--accent); color: #06122b; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  select, input[type=text] { font-family: var(--mono); font-size: 13px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
  select:focus { outline: none; border-color: var(--accent); }
  button { font-family: var(--sans); font-size: 13px; border: 1px solid var(--border); background: var(--panel2);
           color: var(--fg); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; }
  button:hover { border-color: var(--accent); }
  label.lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-right: 4px; }
  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
             margin: 0 0 14px; font-weight: 600; }
  canvas { width: 100%; display: block; cursor: crosshair; }
  .fcbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .fcbar input[type=range] { flex: 1; min-width: 160px; accent-color: #ffab40; }
  .fcbar .mono { font-family: var(--mono); color: var(--fg); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono); font-size: 12px; background: var(--panel2); border: 1px solid var(--border);
          border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip .t { color: var(--accent2); }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); word-break: break-word; }
  .muted { color: var(--muted); }
  .stat-row { display: flex; gap: 20px; margin-bottom: 14px; flex-wrap: wrap; }
  .stat { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
  .stat .n { font-size: 20px; font-weight: 700; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .empty { text-align: center; padding: 60px; color: var(--muted); }
  .section { margin-bottom: 20px; }
  #tip { position: fixed; pointer-events: none; background: var(--panel2); border: 1px solid var(--border);
         border-radius: 6px; padding: 6px 9px; font-family: var(--mono); font-size: 12px; display: none;
         box-shadow: 0 6px 18px rgba(0,0,0,.5); z-index: 50; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1><img class="logo" src="/favicon.svg" alt=""><span class="brand">anomaly</span> · Visualize</h1>
  <nav>
    <a href="/modelmanager.html">Models</a>
    <a href="/modeltrainer.html">Trainer</a>
    <a href="/visualize.html" class="active">Visualize</a>
    <a href="/anomalies.html">Anomalies</a>
    <a href="/sources.html">Sources</a>
  </nav>
</header>

<main>
  <div class="controls">
    <span><label class="lbl">Model</label><select id="model" onchange="onModel()"></select></span>
    <button onclick="refresh()">↻ Reload</button>
    <span class="muted" id="count"></span>
  </div>

  <div class="layout">
    <div>
      <div class="stat-row" id="stats"></div>
      <div class="card section">
        <h2>Feature</h2>
        <div class="chips" id="featChips"></div>
      </div>
      <div class="card">
        <h2 id="chartTitle">Series</h2>
        <canvas id="chart" height="380"></canvas>
        <div id="chartEmpty" class="empty" style="display:none">Select a model with numeric data.</div>
        <div class="fcbar" id="fcbar" style="display:none">
          <label>forecast from <span id="originLabel" class="mono">newest</span></label>
          <input type="range" id="origin" min="0" max="0" value="0" step="1">
          <label>steps <input type="text" id="horizon" value="24" size="4"></label>
          <button id="zoomReset" title="Show the whole series (double-click the chart does the same)">Reset zoom</button>
          <span class="muted">drag across the chart to zoom into a stretch; move the slider to forecast from an earlier point and see what followed</span>
        </div>
      </div>
    </div>
    <div>
      <div class="card">
        <h2>Metadata</h2>
        <div id="meta"><div class="muted">–</div></div>
      </div>
    </div>
  </div>
</main>
<div id="tip"></div>

<script src="/auth.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const enc = encodeURIComponent;
let DATA = [];         // array of raw records
let NUMKEYS = [];      // numeric feature keys
let FEATURE = null;
let SERIES = [];       // [{i, x}]

async function api(url) {
  const r = await fetch(url);
  let d = null; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((d && d.message) || (r.status + ""));
  return d;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function fmtNum(x) {
  if (typeof x !== "number") return esc(x);
  if (!isFinite(x)) return "–";
  return Math.abs(x) >= 1000 ? x.toLocaleString(undefined, {maximumFractionDigits: 2})
       : Math.abs(x) < 1e-4 && x !== 0 ? x.toExponential(2) : +x.toFixed(4) + "";
}

async function loadModels(preselect) {
  const d = await api("/models/dynamic");
  const names = Object.keys(d.models || {}).sort();
  $("model").innerHTML = names.map(n => '<option value="' + esc(n) + '">' + esc(n) + "</option>").join("");
  if (!names.length) { $("model").innerHTML = '<option>(no models)</option>'; return; }
  if (preselect && names.includes(preselect)) $("model").value = preselect;
  await onModel();
}

async function onModel() {
  const name = $("model").value;
  if (!name || name === "(no models)") return;
  await Promise.all([loadData(name), loadMeta(name)]);
}

let FC = null;      // the forecast answer for the current model, or null
let ORIGIN = null;  // the row the forecast is made from; null = the newest
let VIEW = null;    // the zoomed stretch as SERIES positions {a, b}; null = everything
function horizon() { const h = parseInt($("horizon").value, 10); return isFinite(h) && h > 0 ? Math.min(h, 1000) : 24; }
let fcSeq = 0;
async function loadForecast(name) {
  const seq = ++fcSeq;
  let f = null;
  try {
    const url = "/models/dynamic/" + enc(name) + "/forecast?horizon=" + horizon() + (ORIGIN === null ? "" : "&origin=" + ORIGIN);
    const d = await api(url);
    if (d && d.forecasts) f = d;
  } catch (e) { f = null; }
  if (seq !== fcSeq) return;   // a newer request answered first
  FC = f;
  draw();
}
async function loadData(name) {
  try {
    ORIGIN = PRESET_ORIGIN; PRESET_ORIGIN = null; VIEW = null; FC = null;
    const d = await api("/models/dynamic/" + enc(name) + "/data?limit=all");
    DATA = d.data || [];
    loadForecast(name);
    $("count").textContent = DATA.length + " points";
    // discover numeric keys
    const keys = {};
    for (const rec of DATA) {
      if (rec && typeof rec === "object")
        for (const k of Object.keys(rec)) if (typeof rec[k] === "number") keys[k] = true;
    }
    NUMKEYS = Object.keys(keys);
    if (!NUMKEYS.includes(FEATURE)) FEATURE = NUMKEYS[0] || null;
    renderChips();
    renderStats();
    draw();
  } catch (e) { $("count").textContent = e.message; }
}

async function loadMeta(name) {
  try {
    const m = await api("/models/dynamic/" + enc(name) + "/metadata");
    const cols = m.column_types || {};
    const sched = m.schedule || {};
    const vers = m.versions || {};
    const onv = Object.keys(vers).filter(v => vers[v].enabled);
    $("meta").innerHTML = '<dl class="kv">' +
      "<dt>Created</dt><dd>" + esc(m.created || "–") + "</dd>" +
      "<dt>Points seen</dt><dd>" + (m.n_points_seen ?? 0).toLocaleString() + "</dd>" +
      "<dt>Clock</dt><dd>" + (m.clock === "count" ? "count — no timestamps, points are numbered" : "time") + "</dd>" +
      "<dt>Last trained</dt><dd>" + (m.last_trained_at > 0 ? "@ " + m.last_trained_at.toLocaleString() + " pts" : "never") + "</dd>" +
      "<dt>Schedule</dt><dd>below " + (sched.below_max||0) + " · at " + (sched.at_max||0) +
        (sched.autoencoder ? " · autoencoder too" : "") + "</dd>" +
      "<dt>Versions</dt><dd>" + (onv.length ? esc(onv.join(", ")) : "–") + "</dd>" +
      "<dt>Features</dt><dd>" + (m.feature_names||[]).map(esc).join(", ") + "</dd>" +
      "</dl>";
  } catch (e) { $("meta").innerHTML = '<div class="muted">' + esc(e.message) + "</div>"; }
}

function renderChips() {
  $("featChips").innerHTML = NUMKEYS.length
    ? NUMKEYS.map(k => '<span class="chip ' + (k===FEATURE?"on":"") + '" data-k="' + esc(k) + '">' + esc(k) + "</span>").join("")
    : '<span class="muted">no numeric features in stored data</span>';
  $("featChips").querySelectorAll(".chip").forEach(el =>
    el.onclick = () => { FEATURE = el.dataset.k; renderChips(); renderStats(); draw(); });
}

function series() {
  const s = [];
  for (let i = 0; i < DATA.length; i++) {
    const v = DATA[i] && DATA[i][FEATURE];
    if (typeof v === "number" && isFinite(v)) s.push({ i, x: v });
  }
  return s;
}
function renderStats() {
  SERIES = FEATURE ? series() : [];
  const xs = SERIES.map(p => p.x);
  const n = xs.length;
  const mean = n ? xs.reduce((a,b)=>a+b,0)/n : 0;
  const sd = n ? Math.sqrt(xs.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n) : 0;
  const mn = n ? Math.min(...xs) : 0, mx = n ? Math.max(...xs) : 0;
  $("stats").innerHTML = [
    ["points", n], ["mean", fmtNum(mean)], ["std", fmtNum(sd)],
    ["min", fmtNum(mn)], ["max", fmtNum(mx)],
  ].map(([l,v]) => '<div class="stat"><div class="n">' + v + '</div><div class="l">' + l + "</div></div>").join("");
}

function draw() {
  const cv = $("chart");
  const empty = !FEATURE || SERIES.length === 0;
  $("chartEmpty").style.display = empty ? "block" : "none";
  cv.style.display = empty ? "none" : "block";
  $("fcbar").style.display = empty ? "none" : "flex";
  const fc = FC && FEATURE ? (FC.forecasts || []).find(f => f.feature === FEATURE) : null;
  const N = SERIES.length;
  // the slider ranges over the stored rows; its label names the origin
  const sl = $("origin");
  const lastRow = N ? SERIES[N-1].i : 0;
  sl.max = lastRow; sl.min = N ? SERIES[0].i : 0;
  if (ORIGIN === null) sl.value = lastRow;
  $("originLabel").textContent = ORIGIN === null ? "newest" : ("row #" + ORIGIN + (FC && FC.from_time ? " · " + fmtWhen(FC.from_time) : ""));
  $("chartTitle").textContent = FEATURE ? (FEATURE + " over time" + (fc ? " · forecast " + FC.horizon + " steps" + (ORIGIN === null ? "" : " from #" + ORIGIN) : "")) : "Series";
  if (empty) return;

  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H_ = 380;
  cv.width = W * dpr; cv.height = H_ * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  g.clearRect(0, 0, W, H_);
  const pad = { l: 54, r: 14, t: 14, b: 26 };
  const iw = W - pad.l - pad.r, ih = H_ - pad.t - pad.b;

  // the origin's position among the series, and the forecast's columns after it
  let oi = N - 1;
  if (ORIGIN !== null) { oi = 0; for (let k = 0; k < N; k++) if (SERIES[k].i <= ORIGIN) oi = k; }
  const H = fc ? (fc.mean || []).length : 0;
  // the visible stretch: the zoom, or everything; the forecast's columns
  // are always in view when the forecast is from the newest point
  let a = VIEW ? Math.max(0, VIEW.a) : 0;
  let b = VIEW ? Math.min(N - 1, VIEW.b) : N - 1;
  if (b - a < 2) { a = Math.max(0, b - 2); }
  let last = b;
  if (H > 0 && oi >= a && oi <= b) last = Math.max(b, oi + H);
  const cols = last - a;
  const X = (pos) => pad.l + (cols <= 0 ? iw/2 : ((pos - a)/cols)*iw);

  const ys = [];
  for (let k = a; k <= b; k++) ys.push(SERIES[k].x);
  if (fc && H > 0 && oi >= a && oi <= b) {
    for (let k = 0; k < H; k++) { if (isFinite(fc.lo95[k])) ys.push(fc.lo95[k]); if (isFinite(fc.hi95[k])) ys.push(fc.hi95[k]); }
  }
  let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mn === mx) { mn -= 1; mx += 1; }
  const padY = (mx - mn) * 0.08; mn -= padY; mx += padY;
  const Y = (v) => pad.t + ih - ((v - mn)/(mx - mn))*ih;

  // grid + y labels
  g.strokeStyle = getVar("--grid"); g.fillStyle = getVar("--muted");
  g.font = "11px " + getVar("--mono"); g.lineWidth = 1;
  for (let t = 0; t <= 4; t++) {
    const yv = mn + (mx-mn)*t/4, y = Y(yv);
    g.beginPath(); g.moveTo(pad.l, y); g.lineTo(W-pad.r, y); g.stroke();
    g.fillText(fmtNum(yv), 6, y+3);
  }
  // x ticks: row numbers
  for (let t = 0; t <= 4; t++) {
    const pos = Math.round(a + cols*t/4);
    const row = pos <= b ? SERIES[Math.min(pos, N-1)].i : (SERIES[N-1].i + (pos - (N-1)));
    g.fillText("#" + row, X(pos)-8, H_-8);
  }

  // area + line of the visible stretch
  const grad = g.createLinearGradient(0, pad.t, 0, H_-pad.b);
  grad.addColorStop(0, "rgba(76,154,255,.28)"); grad.addColorStop(1, "rgba(76,154,255,0)");
  g.beginPath();
  for (let k = a; k <= b; k++) { const y = Y(SERIES[k].x); k === a ? g.moveTo(X(k), y) : g.lineTo(X(k), y); }
  g.lineTo(X(b), H_-pad.b); g.lineTo(X(a), H_-pad.b); g.closePath();
  g.fillStyle = grad; g.fill();
  g.beginPath();
  for (let k = a; k <= b; k++) { const y = Y(SERIES[k].x); k === a ? g.moveTo(X(k), y) : g.lineTo(X(k), y); }
  g.strokeStyle = getVar("--accent"); g.lineWidth = 1.8; g.stroke();
  if (b - a <= 400) {
    g.fillStyle = getVar("--accent");
    for (let k = a; k <= b; k++) { g.beginPath(); g.arc(X(k), Y(SERIES[k].x), 2, 0, 7); g.fill(); }
  }

  // the forecast: 95 % and 80 % bands, then the mean, from the origin on —
  // over the actual rows that followed when the origin is not the newest
  if (fc && H > 0 && oi >= a && oi <= b) {
    const band = (lo, hi, color) => {
      g.beginPath();
      g.moveTo(X(oi), Y(SERIES[oi].x));
      for (let k = 0; k < H; k++) g.lineTo(X(oi+1+k), Y(hi[k]));
      for (let k = H-1; k >= 0; k--) g.lineTo(X(oi+1+k), Y(lo[k]));
      g.closePath(); g.fillStyle = color; g.fill();
    };
    band(fc.lo95, fc.hi95, "rgba(255,171,64,.16)");
    band(fc.lo80, fc.hi80, "rgba(255,171,64,.22)");
    g.beginPath();
    g.moveTo(X(oi), Y(SERIES[oi].x));
    for (let k = 0; k < H; k++) g.lineTo(X(oi+1+k), Y(fc.mean[k]));
    g.setLineDash([5, 4]); g.strokeStyle = "#ffab40"; g.lineWidth = 2; g.stroke(); g.setLineDash([]);
    g.strokeStyle = "#ffab40"; g.globalAlpha = 0.5; g.beginPath(); g.moveTo(X(oi), pad.t); g.lineTo(X(oi), H_ - pad.b); g.stroke(); g.globalAlpha = 1;
  }

  // the zoom selection in progress
  if (DRAG && DRAG.x1 !== undefined) {
    g.fillStyle = "rgba(76,154,255,.15)"; g.strokeStyle = getVar("--accent");
    const x0 = Math.min(DRAG.x0, DRAG.x1), x1 = Math.max(DRAG.x0, DRAG.x1);
    g.fillRect(x0, pad.t, x1 - x0, ih); g.strokeRect(x0 + 0.5, pad.t + 0.5, x1 - x0, ih);
  }

  // hover: positions → series index
  cv._series = SERIES; cv._X = X; cv._Y = Y; cv._N = N; cv._pad = pad; cv._a = a; cv._cols = cols; cv._oi = oi; cv._fc = fc;
}
function fmtWhen(t) { if (!t) return ""; try { return new Date(t * 1000).toISOString().replace("T", " ").slice(0, 16); } catch (e) { return String(t); } }
function getVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

let DRAG = null;
function posOf(cv, clientX) {
  const rect = cv.getBoundingClientRect();
  const mx = clientX - rect.left;
  const pad = cv._pad, iw = cv.clientWidth - pad.l - pad.r;
  return cv._a + ((mx - pad.l)/iw) * cv._cols;
}
$("chart").addEventListener("mousemove", (e) => {
  const cv = $("chart"); if (!cv._series) return;
  if (DRAG) { DRAG.x1 = e.clientX - cv.getBoundingClientRect().left; draw(); return; }
  const pos = Math.round(posOf(cv, e.clientX));
  const tip = $("tip");
  const N = cv._N;
  let text = null;
  if (pos >= 0 && pos < N) {
    const p = cv._series[pos];
    text = "#" + p.i + " · " + FEATURE + " = " + fmtNum(p.x);
    if (cv._fc && pos > cv._oi && pos - cv._oi - 1 < cv._fc.mean.length) {
      const k = pos - cv._oi - 1;
      text += " · forecast " + fmtNum(cv._fc.mean[k]) + " (95 % " + fmtNum(cv._fc.lo95[k]) + " … " + fmtNum(cv._fc.hi95[k]) + ")";
    }
  } else if (cv._fc && pos > cv._oi && pos - cv._oi - 1 < cv._fc.mean.length) {
    const k = pos - cv._oi - 1;
    text = "step +" + (k+1) + " · forecast " + fmtNum(cv._fc.mean[k]) + " (95 % " + fmtNum(cv._fc.lo95[k]) + " … " + fmtNum(cv._fc.hi95[k]) + ")";
  }
  if (!text) { tip.style.display = "none"; return; }
  tip.style.display = "block";
  tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px";
  tip.innerHTML = text;
});
$("chart").addEventListener("mouseleave", () => { $("tip").style.display = "none"; if (DRAG) { DRAG = null; draw(); } });
// drag across the chart: zoom into that stretch; double-click: everything
$("chart").addEventListener("mousedown", (e) => {
  const cv = $("chart"); if (!cv._series) return;
  DRAG = { x0: e.clientX - cv.getBoundingClientRect().left };
  e.preventDefault();
});
$("chart").addEventListener("mouseup", (e) => {
  const cv = $("chart"); if (!DRAG) return;
  const left = cv.getBoundingClientRect().left;
  const x0 = DRAG.x0, x1 = e.clientX - left;
  DRAG = null;
  if (Math.abs(x1 - x0) < 6) { draw(); return; }   // a click, not a drag
  const p0 = posOf(cv, x0 + left), p1 = posOf(cv, e.clientX);
  const lo = Math.max(0, Math.floor(Math.min(p0, p1))), hi = Math.min(cv._N - 1, Math.ceil(Math.max(p0, p1)));
  if (hi - lo >= 2) VIEW = { a: lo, b: hi };
  draw();
});
$("chart").addEventListener("dblclick", () => { VIEW = null; draw(); });
$("zoomReset").onclick = () => { VIEW = null; draw(); };
let originTimer = null;
$("origin").addEventListener("input", (e) => {
  const row = parseInt(e.target.value, 10);
  const lastRow = SERIES.length ? SERIES[SERIES.length-1].i : 0;
  ORIGIN = row >= lastRow ? null : row;
  $("originLabel").textContent = ORIGIN === null ? "newest" : "row #" + ORIGIN;
  clearTimeout(originTimer);
  originTimer = setTimeout(() => loadForecast($("model").value), 150);
});
$("horizon").addEventListener("change", () => loadForecast($("model").value));
window.addEventListener("resize", draw);

async function refresh() { await onModel(); }

const qp = new URLSearchParams(location.search);
// ?origin=<row> opens the page forecasting from that row (a link to share)
let PRESET_ORIGIN = qp.get("origin") !== null && isFinite(parseInt(qp.get("origin"), 10)) ? parseInt(qp.get("origin"), 10) : null;
Auth.ready().then(() => loadModels(qp.get("model"))).catch(e => $("count").textContent = e.message);
