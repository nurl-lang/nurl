<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- anomaly: six ordinary petals and the one that is not. -->
  <defs>
    <linearGradient id="hot" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b3001b"/>
      <stop offset="1" stop-color="#ff2d4a"/>
    </linearGradient>
    <path id="petal" d="M32 32 C 23 22, 22 9, 32 3 C 42 9, 41 22, 32 32 Z"/>
  </defs>
  <g fill="#f4f7fa" stroke="#35566b" stroke-width="3" stroke-linejoin="round">
    <use href="#petal" transform="rotate(0 32 32)"/>
    <use href="#petal" transform="rotate(120 32 32)"/>
    <use href="#petal" transform="rotate(180 32 32)"/>
    <use href="#petal" transform="rotate(240 32 32)"/>
    <use href="#petal" transform="rotate(300 32 32)"/>
    <use href="#petal" transform="rotate(60 32 32)" fill="url(#hot)" stroke="#8d0016"/>
    <circle cx="32" cy="32" r="5.5"/>
  </g>
  <!-- the arrow: out of the red petal, the way an outlier leaves the cluster -->
  <g transform="rotate(60 32 32)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 24 L32 11"/>
    <path d="M27.5 15.5 L32 11 L36.5 15.5"/>
  </g>
</svg>
