[package]
name = "anomaly"
version = "0.14.0"
description = "Streaming anomaly-detection service in pure NURL — dynamically created, automatically trained models over Isolation Forests. Where the `iforest` package is the kernel (matrix in, scores out), `anomaly` is the service around it: named dynamic models are created on first use, ingest one JSON data point at a time, and train themselves once enough history has accumulated — no offline training step, no labels. Heterogeneous features are encoded automatically (numeric passthrough, categorical → deterministic one-hot, ISO-8601 timestamps → calendar features), standardised with a persisted scaler, and projected onto a stable feature order so retrains never scramble one-hot columns. Each model keeps several versions judged at once: four time windows (short-term / daily / weekly / seasonal), a `timevector` sliding window that sees ORDER, an on-demand `autoencoder` that catches marginally-normal-but-jointly-impossible points, and a `range_guard` that flags one feature far outside its range and names it. A point is anomalous if any enabled version flags it (or `votes=N` of them); consecutive anomalous rows are reported as one event; a reader can label a point a false positive and calibration leaves it out; versions can be switched on and off, their thresholds retuned, a calibration report says what each margin flags over a window of stored data and which margin would flag a chosen rate, and a fine-tune pass writes those margins (dry run, per version, rounded to readable values). Models persist to disk (JSON metadata + compact forest blobs) and survive restarts. Ships as a library (model_open/model_ingest/model_detect_only/…), a CLI (`anomaly detect|score|batch|train|train-ae|calibrate|finetune|ls|info|serve`), an HTTP/JSON service (POST /detect/<model>, /detect_only/<model>, /detect_anomalies, model management, file import and one-call analysis, organisations with OAuth/OIDC sign-in, roles and API keys), and an MCP endpoint at /mcp where an agent — authenticated the same way, with the same rights as the user it acts for — lists models, reads recent anomalies and summaries sized for a context window, and trains scratch `llm_*` models of its own. `anomaly serve` also ships a self-contained web dashboard (model manager, trainer, feature visualiser and anomaly scanner — plain HTML/JS, no CDN or build step) served straight from the binary's web root: versions toggle, margins and the retrain schedule edit inline, the autoencoder trains from a button, and the whole editable metadata is reachable as raw JSON."
license = "MIT OR Apache-2.0"

[dependencies]
iforest = { path = "../iforest", version = "^0" }
gpu = { path = "../gpu", version = "^0" }
http = { path = "../http", version = "^0" }
cli = { path = "../cli", version = "^0" }
gpukit = { path = "../gpukit", version = "^0" }
mlp = { path = "../mlp", version = "^0" }
oauth = { path = "../oauth", version = "^0" }
http-client = { path = "../http-client", version = "^0" }

# Runtime data staged into $NURL_HOME/share/anomaly/ on `nurlpkg install`.
# The `serve` dashboard resolves its web root as <exe-dir>/../share/anomaly/static,
# so a registry install serves the dashboard with no --webroot needed.
[install]
assets = ["static"]
