<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lingbot-map viewer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10;
               font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
               color: #c8d0d8; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  .panel { position: fixed; background: rgba(14,17,21,.86); border: 1px solid #232a33;
           border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(6px); }
  #hud { top: 12px; left: 12px; min-width: 210px; }
  #hud h1 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: #e8eef4;
            letter-spacing: .02em; }
  #hud .sub { color: #6b7885; margin-bottom: 9px; font-size: 11px; }
  .row { display: flex; justify-content: space-between; gap: 12px; margin: 2px 0; }
  .row span:last-child { color: #e8eef4; }
  .ctl { margin-top: 9px; }
  .ctl label { display: block; color: #8b98a6; font-size: 11px; margin-bottom: 2px; }
  input[type=range] { width: 100%; accent-color: #4f9cf9; margin: 0; }
  #help { bottom: 12px; left: 12px; color: #8b98a6; font-size: 11px; }
  #help b { color: #c8d0d8; font-weight: 600; }
  #status { position: fixed; inset: 0; display: grid; place-content: center;
            text-align: center; background: #0b0d10; z-index: 5; }
  #status .big { font-size: 15px; color: #e8eef4; margin-bottom: 8px; }
  #bar { width: 260px; height: 3px; background: #232a33; border-radius: 2px;
         margin: 12px auto 0; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #4f9cf9; }
  .err { color: #ff8080; max-width: 46ch; text-align: left; }
  button { background: #1a2029; color: #c8d0d8; border: 1px solid #2c3540;
           border-radius: 5px; padding: 3px 8px; font: inherit; font-size: 11px;
           cursor: pointer; }
  button:hover { background: #222a35; }
  .btns { display: flex; gap: 5px; margin-top: 9px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="panel" hidden>
  <h1>lingbot-map</h1>
  <div class="sub" id="src">&nbsp;</div>
  <div class="row"><span>points</span><span id="n">-</span></div>
  <div class="row"><span>drawn</span><span id="nd">-</span></div>
  <div class="row"><span>fps</span><span id="fps">-</span></div>
  <div class="ctl">
    <label>point size <b id="psv">2</b></label>
    <input id="ps" type="range" min="1" max="12" step="1" value="2">
  </div>
  <div class="ctl">
    <label>density <b id="dnv">100%</b></label>
    <input id="dn" type="range" min="1" max="100" step="1" value="100">
  </div>
  <div class="ctl">
    <label>trim far points <b id="tmv">2%</b></label>
    <input id="tm" type="range" min="50" max="100" step="1" value="98">
  </div>
  <div class="btns">
    <button id="mode">colour: rgb</button>
    <button id="reset">reset view</button>
  </div>
</div>

<div id="help" class="panel" hidden>
  <b>drag</b> orbit &nbsp; <b>wheel</b> zoom &nbsp; <b>shift-drag</b> pan<br>
  <b>r</b> reset &nbsp; <b>c</b> colour &nbsp; <b>[ ]</b> point size
</div>

<div id="status">
  <div class="big" id="stat">loading the cloud...</div>
  <div id="statsub" style="color:#6b7885;font-size:11px">&nbsp;</div>
  <div id="bar"><i id="barf"></i></div>
</div>

<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };

/* ---------- PLY ---------------------------------------------------------
   lingbot-map writes binary_little_endian with x,y,z float32 then r,g,b
   uchar - 15 bytes a vertex. A 15-byte stride cannot be fed to a float
   attribute (WebGL wants the stride 4-aligned), so the body is repacked to
   16 bytes: 3 floats plus 4 colour bytes.

   The points arrive frame by frame, so any prefix of them is the start of
   the walk rather than a sample of the scene. They are shuffled once here
   with a seeded Fisher-Yates, which makes every prefix a uniform sample and
   is what lets the density slider mean what it says.                     */

function parsePly(buf, onNote) {
  var bytes = new Uint8Array(buf);
  var limit = Math.min(bytes.length, 8192), hdr = "";
  for (var i = 0; i < limit; i++) hdr += String.fromCharCode(bytes[i]);
  var end = hdr.indexOf("end_header");
  if (hdr.slice(0, 3) !== "ply" || end < 0) throw new Error("not a PLY file");
  var nl = hdr.indexOf("\n", end);
  var head = hdr.slice(0, nl);
  var m = /element vertex\s+(\d+)/.exec(head);
  if (!m) throw new Error("PLY header has no vertex count");
  var n = parseInt(m[1], 10);            // zero-padded here; parseInt copes
  var ascii = /format\s+ascii/.test(head);
  var bodyAt = nl + 1;

  var xyz = new Float32Array(n * 3), rgb = new Uint8Array(n * 4);

  if (ascii) {
    onNote("parsing ASCII PLY (slower than binary)");
    var text = new TextDecoder().decode(bytes.subarray(bodyAt));
    var lines = text.split("\n"), k = 0;
    for (var li = 0; li < lines.length && k < n; li++) {
      var t = lines[li].trim();
      if (!t) continue;
      var f = t.split(/\s+/);
      xyz[k * 3] = +f[0]; xyz[k * 3 + 1] = +f[1]; xyz[k * 3 + 2] = +f[2];
      rgb[k * 4] = +f[3] | 0; rgb[k * 4 + 1] = +f[4] | 0; rgb[k * 4 + 2] = +f[5] | 0;
      k++;
    }
    n = k;
  } else {
    var need = bodyAt + n * 15;
    if (bytes.length < need) {
      onNote("file is short: " + bytes.length + " bytes for " + n + " vertices");
      n = Math.max(0, Math.floor((bytes.length - bodyAt) / 15));
    }
    var dv = new DataView(buf);
    for (var j = 0, o = bodyAt; j < n; j++, o += 15) {
      xyz[j * 3]     = dv.getFloat32(o, true);
      xyz[j * 3 + 1] = dv.getFloat32(o + 4, true);
      xyz[j * 3 + 2] = dv.getFloat32(o + 8, true);
      rgb[j * 4]     = bytes[o + 12];
      rgb[j * 4 + 1] = bytes[o + 13];
      rgb[j * 4 + 2] = bytes[o + 14];
    }
  }
  return { n: n, xyz: xyz, rgb: rgb };
}

/* deterministic shuffle, so two loads of the same cloud look the same */
function shuffled(n) {
  var idx = new Uint32Array(n), s = 0x9e3779b9;
  for (var i = 0; i < n; i++) idx[i] = i;
  for (var k = n - 1; k > 0; k--) {
    s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0;
    var j = s % (k + 1), t = idx[k]; idx[k] = idx[j]; idx[j] = t;
  }
  return idx;
}

/* ---------- little matrix helpers -------------------------------------- */
function perspective(fovy, aspect, near, far) {
  var f = 1 / Math.tan(fovy / 2), d = near - far;
  return [f / aspect,0,0,0, 0,f,0,0, 0,0,(far+near)/d,-1, 0,0,2*far*near/d,0];
}
function lookAt(eye, tgt, up) {
  var z0=eye[0]-tgt[0], z1=eye[1]-tgt[1], z2=eye[2]-tgt[2];
  var zl=Math.hypot(z0,z1,z2)||1; z0/=zl; z1/=zl; z2/=zl;
  var x0=up[1]*z2-up[2]*z1, x1=up[2]*z0-up[0]*z2, x2=up[0]*z1-up[1]*z0;
  var xl=Math.hypot(x0,x1,x2)||1; x0/=xl; x1/=xl; x2/=xl;
  var y0=z1*x2-z2*x1, y1=z2*x0-z0*x2, y2=z0*x1-z1*x0;
  return [x0,y0,z0,0, x1,y1,z1,0, x2,y2,z2,0,
          -(x0*eye[0]+x1*eye[1]+x2*eye[2]),
          -(y0*eye[0]+y1*eye[1]+y2*eye[2]),
          -(z0*eye[0]+z1*eye[1]+z2*eye[2]), 1];
}
function mul(a, b) {   /* a * b, both column-major */
  var o = new Array(16);
  for (var c = 0; c < 4; c++) for (var r = 0; r < 4; r++) {
    var v = 0;
    for (var k = 0; k < 4; k++) v += a[k * 4 + r] * b[c * 4 + k];
    o[c * 4 + r] = v;
  }
  return o;
}

/* ---------- shaders ----------------------------------------------------- */
var VS = [
"#version 300 es",
"layout(location=0) in vec3 aPos;",
"layout(location=1) in vec4 aCol;",
"uniform mat4 uMVP;",
"uniform float uSize;",
"uniform int uMode;",
"uniform vec3 uLo;",
"uniform vec3 uSpan;",
"uniform vec3 uCentre;",
"uniform float uMaxR;",
"out vec3 vCol;",
/* a compact blue-through-red ramp for the height and depth modes */
"vec3 ramp(float t){",
"  t = clamp(t, 0.0, 1.0);",
"  return clamp(vec3(1.5 - abs(4.0*t - 3.0),",
"                    1.5 - abs(4.0*t - 2.0),",
"                    1.5 - abs(4.0*t - 1.0)), 0.0, 1.0);",
"}",
"void main(){",
/* Far outliers are mostly sky: geometry the depth head places at a
   plausible but enormous distance. Pushing them outside the frustum
   is the cheapest cull there is, and it composes with the density
   prefix instead of fighting it. */
"  if (uMaxR > 0.0 && distance(aPos, uCentre) > uMaxR) {",
"    gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; return;",
"  }",
"  gl_Position = uMVP * vec4(aPos, 1.0);",
"  gl_PointSize = uSize;",
"  if (uMode == 0) vCol = aCol.rgb;",
"  else if (uMode == 1) vCol = ramp(1.0 - (aPos.y - uLo.y) / max(uSpan.y, 1e-6));",
"  else vCol = ramp(clamp(gl_Position.w / max(uSpan.x, 1e-6), 0.0, 1.0));",
"}"].join("\n");

var FS = [
"#version 300 es",
"precision mediump float;",
"in vec3 vCol;",
"out vec4 oCol;",
"void main(){",
/* round splats: cheaper and much easier to read than squares */
"  vec2 d = gl_PointCoord - vec2(0.5);",
"  if (dot(d, d) > 0.25) discard;",
"  oCol = vec4(vCol, 1.0);",
"}"].join("\n");

function compile(gl, type, src) {
  var s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error("shader: " + gl.getShaderInfoLog(s));
  return s;
}

/* ---------- viewer ------------------------------------------------------ */
var Q = new URLSearchParams(location.search);
/* keep the farthest 2% out by default: on every example scene that is
   sky and nothing else, and it is what makes the first frame legible */
var DEFAULT_TRIM = 0.98;
/* ?probe=N renders N frames and then writes the canvas back into the DOM as
   a data URL. Headless Chrome's --screenshot grabs a compositor frame that
   can predate the WebGL draw, while --dump-dom always reflects the finished
   page; this is what lets tests/viewer_shot.sh see what was actually drawn.
   preserveDrawingBuffer is only paid for when probing. */
var PROBE = parseInt(Q.get("probe") || "0", 10);
var cv = $("gl"), gl = cv.getContext("webgl2",
  { antialias: false, alpha: false, preserveDrawingBuffer: PROBE > 0 });
/* The model works in OpenCV camera axes: x right, y DOWN, z forward. So
   world up is -Y, which is what the reference viewer uses too
   (point_cloud_viewer.py: up_dir = -R[:, 1]). Get this wrong and the
   reconstruction renders upside down with the sky underneath it, which
   looks wrong but not obviously so. */
var UP = [0, -1, 0];
var cam = { yaw: 0.6, pitch: 0.35, dist: 3, tgt: [0, 0, 0] }, home = null;
var total = 0, drawn = 0, mode = 0, psize = 2, density = 1, trim = 0.98;
var lo = [0,0,0], span = [1,1,1], mid = [0,0,0], radii = null, diag = 1;
function radiusAt(f) {
  if (!radii || !radii.length) return 0;
  return radii[Math.min(radii.length - 1,
                        Math.max(0, Math.round(f * (radii.length - 1))))];
}

function fail(msg, detail) {
  $("status").hidden = false;
  $("stat").textContent = msg;
  $("stat").className = "big err";
  $("statsub").textContent = detail || "";
  $("bar").hidden = true;
}

function resize() {
  var d = Math.min(window.devicePixelRatio || 1, 2);
  var w = Math.floor(cv.clientWidth * d), h = Math.floor(cv.clientHeight * d);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  gl.viewport(0, 0, cv.width, cv.height);
}

function boot(data, label) {
  total = data.n;
  if (!total) return fail("the cloud is empty", "no vertices in the PLY");

  /* bounds first: they set the camera and the height ramp */
  var mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
  for (var i = 0; i < total; i++)
    for (var a = 0; a < 3; a++) {
      var v = data.xyz[i * 3 + a];
      if (v < mn[a]) mn[a] = v;
      if (v > mx[a]) mx[a] = v;
    }
  mid = [(mn[0]+mx[0])/2, (mn[1]+mx[1])/2, (mn[2]+mx[2])/2];
  diag = Math.hypot(mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]) || 1;
  lo = mn; span = [diag, mx[1]-mn[1] || 1, 1];
  /* A sorted sample of radii about the centre, so the trim slider can be a
     percentile rather than a distance the user has to guess. */
  var SAMP = Math.min(total, 60000), rs = new Float32Array(SAMP);
  for (var q = 0; q < SAMP; q++) {
    var t = Math.floor(q * total / SAMP);
    rs[q] = Math.hypot(data.xyz[t*3] - mid[0], data.xyz[t*3+1] - mid[1],
                       data.xyz[t*3+2] - mid[2]);
  }
  rs.sort();
  radii = rs;

  cam.tgt = mid;
  /* frame what the default trim keeps, or one far sky point decides
     the zoom and the scene is a speck in the middle */
  cam.dist = Math.max(radiusAt(DEFAULT_TRIM) * 2.6, diag * 0.05);
  /* ?yaw=&pitch=&dist= overrides the framing, so a particular view can be
     linked to or asked for by a test. dist is a multiple of the automatic
     one rather than a world distance, which survives a change of scene. */
  if (Q.has("ps")) { psize = parseFloat(Q.get("ps")); $("ps").value = psize;
                     $("psv").textContent = psize; }
  if (Q.has("trim")) { trim = parseFloat(Q.get("trim")); $("tm").value = trim * 100;
                       $("tmv").textContent = Math.round(100 - trim * 100) + "%"; }
  if (Q.has("yaw")) cam.yaw = parseFloat(Q.get("yaw"));
  if (Q.has("pitch")) cam.pitch = parseFloat(Q.get("pitch"));
  if (Q.has("dist")) cam.dist *= parseFloat(Q.get("dist"));
  home = JSON.parse(JSON.stringify(cam));

  /* one interleaved, 16-byte-aligned, shuffled buffer */
  var order = shuffled(total);
  var inter = new ArrayBuffer(total * 16);
  var fv = new Float32Array(inter), bv = new Uint8Array(inter);
  for (var k = 0; k < total; k++) {
    var s = order[k];
    fv[k * 4]     = data.xyz[s * 3];
    fv[k * 4 + 1] = data.xyz[s * 3 + 1];
    fv[k * 4 + 2] = data.xyz[s * 3 + 2];
    bv[k * 16 + 12] = data.rgb[s * 4];
    bv[k * 16 + 13] = data.rgb[s * 4 + 1];
    bv[k * 16 + 14] = data.rgb[s * 4 + 2];
  }

  var vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  var vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, inter, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 16, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 4, gl.UNSIGNED_BYTE, true, 16, 12);

  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error("link: " + gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  var uMVP = gl.getUniformLocation(prog, "uMVP"),
      uSize = gl.getUniformLocation(prog, "uSize"),
      uMode = gl.getUniformLocation(prog, "uMode"),
      uLo = gl.getUniformLocation(prog, "uLo"),
      uSpan = gl.getUniformLocation(prog, "uSpan"),
      uCentre = gl.getUniformLocation(prog, "uCentre"),
      uMaxR = gl.getUniformLocation(prog, "uMaxR");

  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.043, 0.051, 0.063, 1);

  $("status").hidden = true;
  $("hud").hidden = false; $("help").hidden = false;
  $("src").textContent = label;
  $("n").textContent = total.toLocaleString();

  var last = performance.now(), frames = 0, acc = 0;
  function frame(now) {
    resize();
    var eye = [
      cam.tgt[0] + cam.dist * Math.cos(cam.pitch) * Math.sin(cam.yaw),
      cam.tgt[1] - cam.dist * Math.sin(cam.pitch),
      cam.tgt[2] + cam.dist * Math.cos(cam.pitch) * Math.cos(cam.yaw)
    ];
    var P = perspective(50 * Math.PI / 180, cv.width / cv.height,
                        Math.max(cam.dist / 5000, 1e-4), cam.dist * 20 + diag * 4);
    gl.uniformMatrix4fv(uMVP, false, mul(P, lookAt(eye, cam.tgt, UP)));
    gl.uniform1f(uSize, psize * Math.min(window.devicePixelRatio || 1, 2));
    gl.uniform1i(uMode, mode);
    gl.uniform3fv(uLo, lo);
    gl.uniform3fv(uSpan, [cam.dist * 2, span[1], 1]);
    gl.uniform3fv(uCentre, mid);
    gl.uniform1f(uMaxR, trim >= 1 ? 0 : radiusAt(trim));
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    drawn = Math.max(1, Math.round(total * density));
    gl.drawArrays(gl.POINTS, 0, drawn);

    frames++; acc += now - last; last = now;
    if (acc > 500) {
      $("fps").textContent = (frames * 1000 / acc).toFixed(0);
      $("nd").textContent = drawn.toLocaleString();
      frames = 0; acc = 0;
    }

  }
  function draw(now) { frame(now); requestAnimationFrame(draw); }

  if (PROBE > 0) {
    /* Probing draws its frames right here rather than waiting on the
       animation loop. A headless browser running on a virtual clock is
       under no obligation to deliver a requestAnimationFrame callback at
       all, and a test that depends on one reports "nothing was drawn" for
       a viewer that draws perfectly. */
    for (var f = 0; f < PROBE; f++) frame(performance.now());
    probeOut();
    return;
  }
  requestAnimationFrame(draw);
  window.__ready = true;
}

/* Count what the GPU actually put on screen, and hand the frame back as a
   PNG. A viewer that reports 590 002 points and draws none looks exactly
   like a working one in the DOM, so the test checks lit pixels, not counts. */
function probeOut() {
  var w = cv.width, h = cv.height, px = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  var lit = 0, r = 0, g = 0, b = 0;
  for (var i = 0; i < px.length; i += 4) {
    /* anything above the background counts as drawn */
    if (px[i] > 20 || px[i + 1] > 22 || px[i + 2] > 26) {
      lit++; r += px[i]; g += px[i + 1]; b += px[i + 2];
    }
  }
  var d = document.createElement("div");
  d.id = "probe";
  d.setAttribute("data-lit", String(lit));
  d.setAttribute("data-total", String(w * h));
  d.setAttribute("data-mean", lit ? [Math.round(r / lit), Math.round(g / lit),
                                     Math.round(b / lit)].join(",") : "");
  d.setAttribute("data-points", String(total));
  d.textContent = cv.toDataURL("image/png");
  d.style.display = "none";
  document.body.appendChild(d);
  document.title = "probe lit=" + lit + "/" + (w * h);
}

/* ---------- input ------------------------------------------------------- */
var drag = null;
cv.addEventListener("mousedown", function (e) {
  drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 1 };
  cv.classList.add("dragging"); e.preventDefault();
});
window.addEventListener("mouseup", function () { drag = null; cv.classList.remove("dragging"); });
window.addEventListener("mousemove", function (e) {
  if (!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) {
    /* pan in the camera plane, scaled so it feels the same at any zoom */
    var s = cam.dist * 0.0016;
    var rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
    cam.tgt[0] -= dx * s * rx; cam.tgt[2] -= dx * s * rz;
    cam.tgt[1] -= dy * s;
  } else {
    cam.yaw -= dx * 0.006;
    cam.pitch = Math.max(-1.55, Math.min(1.55, cam.pitch + dy * 0.006));
  }
});
cv.addEventListener("wheel", function (e) {
  cam.dist *= Math.exp((e.deltaY > 0 ? 1 : -1) * 0.12);
  e.preventDefault();
}, { passive: false });
cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });

var MODES = ["rgb", "height", "depth"];
function setMode(m) { mode = m; $("mode").textContent = "colour: " + MODES[m]; }
$("mode").onclick = function () { setMode((mode + 1) % 3); };
$("reset").onclick = function () { if (home) cam = JSON.parse(JSON.stringify(home)); };
$("ps").oninput = function () { psize = +this.value; $("psv").textContent = psize; };
$("dn").oninput = function () {
  density = +this.value / 100; $("dnv").textContent = this.value + "%";
};
$("tm").oninput = function () {
  trim = +this.value / 100;
  $("tmv").textContent = (100 - +this.value) + "%";
};
window.addEventListener("keydown", function (e) {
  if (e.key === "r") $("reset").onclick();
  else if (e.key === "c") setMode((mode + 1) % 3);
  else if (e.key === "[" || e.key === "]") {
    psize = Math.max(1, Math.min(12, psize + (e.key === "]" ? 1 : -1)));
    $("ps").value = psize; $("psv").textContent = psize;
  }
});

/* ---------- load -------------------------------------------------------- */
(function () {
  if (!gl) return fail("this browser has no WebGL2",
                       "the viewer draws the cloud on the GPU and needs it");
  var url = Q.get("cloud") || "cloud";
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url);
  xhr.responseType = "arraybuffer";
  xhr.onprogress = function (e) {
    var mb = (e.loaded / 1048576).toFixed(1);
    $("statsub").textContent = e.lengthComputable
      ? mb + " of " + (e.total / 1048576).toFixed(1) + " MB"
      : mb + " MB";
    if (e.lengthComputable) $("barf").style.width = (100 * e.loaded / e.total) + "%";
  };
  xhr.onerror = function () { fail("could not fetch the cloud", url); };
  xhr.onload = function () {
    if (xhr.status !== 200) return fail("server said " + xhr.status, url);
    $("stat").textContent = "building the point buffer...";
    $("barf").style.width = "100%";
    /* Parsed and uploaded synchronously rather than behind a timer. The
       timer only existed so the message above got a chance to paint, and
       it made the page depend on a task that a headless browser running on
       virtual time may never get round to running. */
    try {
      var name = xhr.getResponseHeader("X-Cloud-Name") || url;
      var data = parsePly(xhr.response, function (n) { $("statsub").textContent = n; });
      boot(data, name + "  " + (xhr.response.byteLength / 1048576).toFixed(1) + " MB");
    } catch (err) {
      fail("could not read the cloud", String(err && err.message || err));
    }
  };
  xhr.send();
})();
</script>
</body>
</html>
