[package]
name = "lingbot-map"
version = "0.9.5"
description = "Streaming 3-D reconstruction in pure NURL. Point it at a video or a folder of frames — `lingbot-map frames/` — and it writes a world-space point cloud as a PLY, plus a camera pose and a depth map for every frame, one frame at a time, with no per-scene optimisation and no structure-from-motion pass. It is a port of LingBot-Map's Geometric Context Transformer and runs the reference's own 1.16 B parameter checkpoint, which the first run fetches from Hugging Face and caches under ~/.nurl/models; no Python, no PyTorch, no CUDA toolkit, since the kernels are compiled at run time through NVRTC. Every stage is checked against the reference PyTorch implementation by importing and driving the upstream modules rather than re-implementing them: preprocessing byte-identical, the DINOv2 trunk 3.9e-6, the streaming aggregator with sliding-window KV eviction 5.9e-6, the camera head 2.2e-7, the DPT depth head 1.6e-6, the geometry 2.4e-16, world points end to end 1.5e-6. On one RTX 4090 in f32 it is at parity with the reference — 138 ms a frame against its 141 — and the per-frame cost is flat past 72 frames because the KV window bounds it: 286 frames of the courthouse example in 109 s. Writes binary_little_endian PLY (--ascii for text); a built-in viewer (`lingbot-map view cloud.ply`, or `--view` to open it the moment a reconstruction finishes) serves a self-contained WebGL page on localhost that orbits the cloud in a browser, so the output can be looked at without installing anything else; --profile reports per-stage frame timings and a per-kernel GPU profile; the reference's own flag spellings (--model_path, --image_folder, --conf_threshold, --first_k) are accepted."
license = "Apache-2.0"

[dependencies]
torchpt = { path = "../torchpt", version = "^0" }
hub = { path = "../hub", version = "^0" }
http = { path = "../http", version = "^0" }
gpukit = { path = "../gpukit", version = "^0" }
image = { path = "../image", version = "^0" }
ply = { path = "../ply", version = "^0" }
video = { path = "../video", version = "^0" }
