[package]
name = "ply"
version = "0.2.2"
description = "Write and view PLY point clouds in pure NURL. The writer streams: `ply_create` opens the file and writes a header whose vertex count is a fixed-width zero-padded placeholder, `ply_vertex` pushes x,y,z float32 + r,g,b uchar points through a ~4 KB buffer, and `ply_finish` seeks back and patches the real count in place — so a cloud of any size goes to disk without ever being held in memory, which is what a reconstruction emitting points frame by frame needs. Both binary_little_endian (15 bytes a vertex) and ascii come out of the same calls, and an optional comment line carries provenance. The viewer is one self-contained WebGL2 page compiled into the binary (no views/ directory to lose on install, no CDN, nothing leaves the machine): `ply view cloud.ply` serves it and the file on localhost, with orbit/pan/zoom, point-size / density / far-trim sliders, rgb / height / depth colouring, and a seeded shuffle that makes the density slider a uniform sample rather than a prefix of the write order. Sky-like far outliers are trimmed by percentile (the slider is a percentile, not a distance to guess), world up defaults to -Y for OpenCV-convention reconstruction clouds, and ?yaw=&pitch=&dist=&roll=&trim= pin a view for linking or testing; a ?probe=N mode renders N frames headlessly and reports the lit-pixel count, so a test can check what the GPU drew rather than what the DOM claims. CLI: `ply view cloud.ply [--port n] [--page file]`, `ply info cloud.ply`, and `ply cloud.ply` as shorthand. MeshLab, CloudCompare, Blender and f3d all open what the writer emits. Depends only on the http package (the server facade)."
license = "MIT OR Apache-2.0"

[dependencies]
http = { path = "../http", version = "^0.3" }
