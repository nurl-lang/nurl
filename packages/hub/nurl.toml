[package]
name = "hub"
version = "0.1.2"
description = "Fetch models from Hugging Face into one shared, verified, on-disk cache — the front door every model package was missing. Every model package used to start with 'get a model from somewhere yourself' (onnx and yoloe still can, embed/whisper/nurllama now fetch through hub directly); `hub` is the somewhere: `( hub_file ref )` downloads a single file (a GGUF, a checkpoint) and hands back a local path, `( hub_dir org/repo )` downloads a whole repository — safetensors shards, config.json, tokenizer.json — and hands back a real directory an existing loader can open unchanged. Refs are Hugging Face shorthands (org/repo, org/repo/path/to/file.gguf, org/repo@revision) or a plain http(s):// URL. The cache is content-addressed and shaped exactly like Hugging Face's own hub cache: every file is downloaded once into blobs/sha256-<hex>, and a model directory is a snapshots/<rev>/ farm of symlinks into those blobs, so two models that share a file share the bytes and a re-fetch copies nothing. Downloads are constant-memory and RESUMABLE — an interrupted transfer leaves a .part file and the next attempt sends `Range: bytes=<n>-`, re-hashing the existing bytes and appending — and every large weight file is verified against the sha256 Hugging Face publishes in its LFS metadata: a truncated, corrupted or substituted file is a clean error, never bytes handed to a model. Ships a library (hub_get — the one call a consumer wants: pass a local path straight through, else fetch a file or a whole repo — plus hub_file / hub_dir / hub_ls / hub_rm / hub_verify) and a CLI (`hub pull|file|dir|ls|rm|verify|path`), cache at $NURL_MODELS or ~/.nurl/models. No dependencies beyond the standard library (the stdlib streaming HTTP client, sha256, fs); no Python, no huggingface_hub, no git-lfs."
license = "MIT OR Apache-2.0"

