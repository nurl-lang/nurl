[package]
name = "nurllama"
version = "0.1.3"
description = "Run language models locally, in pure NURL — the ollama-shaped engine built package by package on top of the gguf container toolkit and the gpu compute package. Phase 6 (this release): quantised weights run natively on the device — the matvec kernels decode Q4_0/Q4_1/Q5_0/Q5_1/Q8_0/Q4_K/Q5_K/Q6_K blocks inside the matmul, so a Q4_K_M model needs ~3x less device memory than its f32 expansion and the memory-bound matvec reads proportionally fewer bytes (verified against the host dequant oracle: identical top-5 logits and byte-identical greedy text, on both compute backends). Earlier phases: the inference core — the full llama-family forward pass (RMSNorm, GQA attention with NORM-style RoPE, SwiGLU FFN, device-resident f32 KV cache) as CUDA-C kernels that run identically on the CUDA backend and the CPU/OpenMP backend, autoregressive decode with streaming output, and host-side sampling (greedy, temperature, top-k, top-p, seeded RNG). Weights load through gguf_dequant, so F32/F16/BF16/Q4_0/Q4_1/Q8_0 models all run. Verified against an independent numpy implementation of the forward pass reading the same GGUF: final-position logits agree to f32 rounding with identical argmax, and a 40-token greedy continuation of a real llama.cpp model is text-identical — with the CPU backend producing the same text as CUDA. Phase 2: the tokenizer, loaded entirely from the model's own tokenizer.ggml.* GGUF metadata — no external vocab files, no exporter step. Two families: SentencePiece-style bigram merging for llama-family models (space-escape to ▁, highest-score adjacent merge with llama.cpp's exact selection order, <0xNN> byte fallback, UNK) and byte-level BPE for gpt2-family models (GPT-2 byte→unicode remap, contraction/letter/digit/punct/whitespace pre-split, lowest-merge-rank pairing from tokenizer.ggml.merges). Encode and decode are verified bit-for-bit: a 17-check selftest over synthetic vocabularies with hand-derived expected ids (built with the gguf writer, parsed back through the real parser), plus token-for-token parity with an independent python SentencePiece implementation on a real llama.cpp model — unicode, emoji byte-fallback, tabs, runs of spaces and the empty string included. CLI: nurllama tokenize/detok/vocab/selftest. Next phases: the gpukit inference core (RMSNorm/RoPE/attention/KV-cache), the model store + pull, and an ollama-compatible HTTP API."
license = "MIT OR Apache-2.0"

[dependencies]
gguf = { path = "../gguf", version = "^0.2" }
gpu = { path = "../gpu", version = "^0.5" }
http = { path = "../http", version = "^0.3" }
