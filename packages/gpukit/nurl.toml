[package]
name = "gpukit"
version = "0.6.0"
description = "The ergonomic GPU-compute toolkit for NURL — a diamond facade over the `gpu` package that kills the marshalling boilerplate every GPU-using package re-invents. Where `gpu` is the low-level interface (open a device, JIT-compile a CUDA-C kernel via NVRTC or the host-C++ CPU backend, allocate/upload/download device buffers, build the argument vector, compute a grid, launch, sync, free), `gpukit` collapses the ~35 lines of that dance per kernel into a list of typed bindings and one `gk_run`: a GpuKit with a per-name kernel cache, `gk_in_f`/`gk_in_i`/`gk_out_f`/`gk_out_i` (and raw-buffer + i32/i64/f32 scalar) bindings, and a workhorse that compiles-once, allocates a device buffer per binding, uploads inputs, marshals args in declaration order, launches, syncs, downloads outputs, and frees everything. The device-resident layer (GkBuf: GK_F32 | GK_F64 | GK_I64) keeps data on the GPU between ops and ships a dtype-generic kernel library that covers a full CNN / transformer forward pass: elementwise (including full N-D stride-broadcast — numpy broadcasting as a stride table), unary maps, matmul and batched matmul with batch broadcast, gather/scatter with ONNX index semantics, gemm (alpha/beta/transB/bias), conv2d / convtranspose2d / maxpool2d (NCHW), batchnorm, layernorm, leakyrelu, clip, erf, axis softmax, axis concat/slice, N-D transpose, nearest-neighbour and bilinear resize (both corner conventions), expand, L2 reduction, argmax and CLIP EOS read-out. On the CPU backend matmul, batched matmul and gemm run a register-tiled kernel — one thread owns an 8x32 block of C with its accumulators in registers and reads B along a row — which is 24x the one-thread-per-output shape a GPU wants (1.7 -> 42 GFLOP/s on a 6-core i7-5930K), while every output's sum keeps its ascending-K order and stays bit-identical to the CUDA kernel and to a sequential host matmul. Every wrapper validates buffers, dtypes and sizes and fails closed, so a wrong shape never reaches the device. True float32 semantics on GK_F32 (accumulation included, matching numpy float32 / onnxruntime); adds no numerics of its own — a kernel runs bit-for-bit the same through gk_run as through hand-written gpu_* calls, preserving the gpu package's CUDA / CPU-backend equivalence. On the CUDA backend the same three run a shared-memory tiled kernel with a float4 register tile (3.1 -> 19-27 TFLOP/s on an RTX 4090 in f32, and 0.6 -> 20 with a transposed B), and gkd_attention fuses scaled-dot-product attention with an online softmax so the [heads, n, nkv] score matrix is never materialised. Device memory is pooled — gk_dbuf_free retires a block for the next same-size gk_dbuf_new rather than returning it to the driver, which on a model that allocates its scratch per layer is a third of the frame — and gk_prof gives a per-kernel device-time profile built on CUDA events. Runs on the CPU backend when no CUDA device is present."
license = "MIT OR Apache-2.0"

[dependencies]
gpu = { path = "../gpu", version = "^0.11" }
