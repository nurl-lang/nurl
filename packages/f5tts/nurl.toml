[package]
name = "f5tts"
version = "0.1.0"
description = "F5-TTS in pure NURL — the flow-matching text-to-speech model, running from the checkpoints Hugging Face ships, with no Python, no PyTorch and no ONNX export. A reference recording and its transcript go in and the same voice comes out saying something it never said. `f5tts synth --voice voices/Tero --text \"Hei\" -o out.wav` fetches the model on demand; `f5tts serve --voices DIR` answers POST /tts and POST /dialogue with a wav, in the shape the reference FastAPI service takes. Built package by package: packages/safetensor reads the 336-tensor DiT, packages/torchpt reads the vocoder's PyTorch pickle, packages/audio turns the reference recording into the mel and the vocoder's spectrogram back into samples, and packages/gpukit runs the arithmetic. Verified against the reference implementation at every stage, with fixed inputs so a disagreement is about the model and not about sampling: the text front-end id for id over 3039 lines of Finnish, the mel against an independent float64 reference, the text encoder at 2.6e-6 relative, the whole 22-block forward at 2.3e-6, 32 guided ODE steps at 7.4e-6 and the waveform at 2.9e-4. Three things this port had to learn the hard way. F5-TTS's text front-end is jieba, and jieba's character class has no ä — a Finnish word therefore breaks at every umlaut and the rule that spaces multi-character ASCII segments fires INSIDE the word, so the model reads \"Yöllä\" as \"Yö llä\" and the checkpoint was fine-tuned through exactly that. Vocabulary row 0 is the filler token's embedding, not a hole: skip it and the unconditional half of classifier-free guidance is left with the position code and nothing else, which costs 20 % on the velocity and is invisible in the conditional half. And the reference mel is put back over the first frames before the cut, one frame further than the conditioning reaches. A diffusion transformer is not a language model and the kernels say so: adaLN-zero modulation fused into the LayerNorm, interleaved RoPE applied while the heads are split, conv1d along the sequence (depthwise for the text encoder's ConvNeXt blocks, grouped with 31 taps for the position embedding), ConvNeXt-V2's GRN normalising down the SEQUENCE, Mish, and both GELUs — the exact one in the text encoder and the tanh approximation in the transformer, which are different functions. Speed came from measuring rather than guessing: --profile said the position embedding's convolution was 70 % of a synthesis while doing 2 % of its arithmetic, because each thread walked its own slice of the weights and a warp's 32 reads were 1984 floats apart. Permuting those weights once at upload and computing four positions per thread took it from 45.5 ms a call to 1.5. An utterance the reference implementation takes 3 minutes over on this machine's CPU takes 1.6 s. The service is one thread owning the GPU behind a job queue — a CUDA context belongs to a thread and the device holds one copy of the activations — with fibers on the sockets, and --unload-after N gives the card back when nobody is asking: 2289 MiB to 883, and 336 ms to bring the weights from the page cache on the next request."
license = "MIT OR Apache-2.0"

[dependencies]
safetensor = { path = "../safetensor", version = "^0" }
audio = { path = "../audio", version = "^0" }
gpu = { path = "../gpu", version = "^0" }
http = { path = "../http", version = "^0" }
hub = { path = "../hub", version = "^0" }

gpukit = { path = "../gpukit" }
torchpt = { path = "../torchpt" }