[package]
name = "f5tts"
version = "0.1.0"
description = "F5-TTS in pure NURL — flow-matching text-to-speech from the safetensors checkpoint, with no Python, no PyTorch and no ONNX export. A reference recording and its transcript go in, the voice comes out saying something it never said."
license = "MIT OR Apache-2.0"

[dependencies]
safetensor = { path = "../safetensor", version = "^0" }
audio = { path = "../audio", version = "^0" }
gpu = { path = "../gpu", version = "^0" }
http = { path = "../http", version = "^0" }
hub = { path = "../hub", version = "^0" }

gpukit = { path = "../gpukit" }
torchpt = { path = "../torchpt" }