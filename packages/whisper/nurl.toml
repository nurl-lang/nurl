[package]
name = "whisper"
version = "1.1.1"
description = "Speech recognition in pure NURL — whisper, running from the safetensors checkpoint Hugging Face ships, on the GPU or the CPU. `whisper transcribe openai/whisper-base audio.wav` fetches the model on demand: the model argument is a local directory, a whisper.cpp ggml file, or a Hugging Face ref pulled into the shared ~/.nurl/models cache via the hub package. Built package by package: packages/audio turns a WAV into the log-mel spectrogram (verified against HF's own WhisperFeatureExtractor), packages/safetensor reads the weights, packages/tokenizer holds the BPE vocabulary, and packages/gpu runs the kernels — the same CUDA-C on the CUDA backend and the CPU/OpenMP one. Whisper is not the llama shape, and every kernel is a place it differs: LayerNorm with a bias rather than RMSNorm, GELU with the error function rather than the tanh approximation, two conv1d layers that turn 3000 spectrogram frames into 1500 encoder positions, and NON-CAUSAL attention — a speech encoder hears the whole 30 seconds at once, where every attention in this ecosystem until now masked the future. --vad skips the silence before the model sees it: a recording is mostly not speech, a speech model costs exactly the same over a silent 30 seconds as over a spoken one, and handed silence whisper does not stay quiet — it invents [BLANK_AUDIO], or a sentence. A 292-second recording that is 8 % speech goes from 13.3 s to 2.2 s on distil-large-v3, and stops hallucinating. --timestamps emits '[a --> b] text' segments using whisper's OWN timestamp tokens under openai's constrained-decoding rules (greedy alone never emits one: no single 20 ms bin outscores 'the' - the bins win collectively or not at all), and under --vad the times are mapped back through the condensation to the recording's real timeline: the model saw second 0.2, the subtitle says 00:20, because that is when it was said. The encoder is where the time is, and profiling rather than guessing found it in two places that were not the arithmetic: attention launched nh*nq*nkey threads that each re-read a whole query and key row from memory (45 million threads and 740 GB of traffic per window for distil, plus a 180 MB score matrix that existed only to be read back), and LayerNorm recomputed a row's mean and variance once per ELEMENT of the row rather than once per row. Attention is now the flash shape — 64 queries of one head held in registers while keys and values stream past through shared memory, softmax computed online, no score matrix at all — the projections are a 64x64-tiled GEMM at ~18 TFLOPS, and LayerNorm is a block-per-row shared reduction that went from 973 us to 12. A 292-second recording: 13.3 s to 7.3 s, with the encoder's numbers bit-for-bit what an independent numpy reference (which matches HF) says. 1.1.0 does the same to the DECODER, where the encoder's fused attention did not reach: it amortises the key/value stream over 64 queries and a decode step has one, so every generated token fell back to a two-kernel path that launched nh*hd threads — 384 on tiny, 1280 on large — each walking a whole 1500-key score row twice and striding through V. That was 54 % of a token, more than the 51865-row vocabulary projection doing sixty times the arithmetic. The one-query attention splits the keys across blocks instead, merges the partial softmaxes, and writes no score matrix: cross-attention 95 us to 11, self-attention 33 to 10, the decode step 946 us to 474. Greedy decoding also stopped fetching 51865 floats per token to find the largest one — the argmax reduces on the device and one integer comes back — so a generated token costs 456 us where it cost 1180. And a device allocation that fails is now said out loud: a null pointer does not crash a kernel, it reads zeros, so a card with no room left produced a confident transcript of nothing at all."
license = "MIT OR Apache-2.0"

[install]
assets = ["views"]

[dependencies]
gpu = { path = "../gpu", version = "^0" }
safetensor = { path = "../safetensor", version = "^0" }
tokenizer = { path = "../tokenizer", version = "^0" }
http = { path = "../http", version = "^0" }
audio = { path = "../audio", version = "^0" }

hub = { path = "../hub", version = "^0" }