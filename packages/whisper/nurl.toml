[package]
name = "whisper"
version = "1.0.6"
description = "Speech recognition in pure NURL — whisper, running from the safetensors checkpoint Hugging Face ships, on the GPU or the CPU. `whisper transcribe openai/whisper-base audio.wav` fetches the model on demand: the model argument is a local directory, a whisper.cpp ggml file, or a Hugging Face ref pulled into the shared ~/.nurl/models cache via the hub package. Built package by package: packages/audio turns a WAV into the log-mel spectrogram (verified against HF's own WhisperFeatureExtractor), packages/safetensor reads the weights, packages/tokenizer holds the BPE vocabulary, and packages/gpu runs the kernels — the same CUDA-C on the CUDA backend and the CPU/OpenMP one. Whisper is not the llama shape, and every kernel is a place it differs: LayerNorm with a bias rather than RMSNorm, GELU with the error function rather than the tanh approximation, two conv1d layers that turn 3000 spectrogram frames into 1500 encoder positions, and NON-CAUSAL attention — a speech encoder hears the whole 30 seconds at once, where every attention in this ecosystem until now masked the future. --vad skips the silence before the model sees it: a recording is mostly not speech, a speech model costs exactly the same over a silent 30 seconds as over a spoken one, and handed silence whisper does not stay quiet — it invents [BLANK_AUDIO], or a sentence. A 292-second recording that is 8 % speech goes from 13.3 s to 2.2 s on distil-large-v3, and stops hallucinating. --timestamps emits '[a --> b] text' segments using whisper's OWN timestamp tokens under openai's constrained-decoding rules (greedy alone never emits one: no single 20 ms bin outscores 'the' - the bins win collectively or not at all), and under --vad the times are mapped back through the condensation to the recording's real timeline: the model saw second 0.2, the subtitle says 00:20, because that is when it was said. The encoder is where the time is, and profiling rather than guessing found it in two places that were not the arithmetic: attention launched nh*nq*nkey threads that each re-read a whole query and key row from memory (45 million threads and 740 GB of traffic per window for distil, plus a 180 MB score matrix that existed only to be read back), and LayerNorm recomputed a row's mean and variance once per ELEMENT of the row rather than once per row. Attention is now the flash shape — 64 queries of one head held in registers while keys and values stream past through shared memory, softmax computed online, no score matrix at all — the projections are a 64x64-tiled GEMM at ~18 TFLOPS, and LayerNorm is a block-per-row shared reduction that went from 973 us to 12. A 292-second recording: 13.3 s to 7.3 s, with the encoder's numbers bit-for-bit what an independent numpy reference (which matches HF) says."
license = "MIT OR Apache-2.0"

[install]
assets = ["views"]

[dependencies]
gpu = { path = "../gpu", version = "^0.11" }
safetensor = { path = "../safetensor", version = "^0.3" }
tokenizer = { path = "../tokenizer", version = "^0.3" }
http = { path = "../http", version = "^0.3" }
audio = { path = "../audio", version = "^0.6" }

hub = { path = "../hub", version = "^0.1" }