[package]
name = "tokenizer"
version = "0.3.2"
description = "The tokenizer that feeds a language model, in pure NURL — and it does not care which file the vocabulary arrived in. Two engines: SentencePiece-style bigram merging for llama-family vocabularies (space-escape, highest-score adjacent merge with llama.cpp's exact selection order and leftmost ties, byte fallback, UNK) and byte-level BPE for gpt2-family ones (the GPT-2 byte-to-unicode remap, contraction/letter/digit/punct/whitespace pre-split with per-model variants, lowest-merge-rank pairing). Special tokens are parsed INLINE: a chat template writes its turn markers into the prompt as text, and each must come back as its own single id — tokenised as ordinary pieces they shred into a dozen tokens and the model answers a question nobody asked. The engine takes PARTS (pieces, scores, token types, merge rules), so a vocabulary can arrive from a GGUF's tokenizer.ggml.* metadata, from Hugging Face's vocab.json + merges.txt + added_tokens.json (src/hf.nu — what whisper and every HF checkpoint ship), or from anywhere else, with nothing about the engine changing. A THIRD engine covers Hugging Face tokenizer.json Unigram models (XLM-RoBERTa / BGE / multilingual-e5 family): the sentencepiece Precompiled charsmap normalizer (a darts-clone double-array trie of NFKC-style replacement rules, decoded from the file), Metaspace pre-tokenization, true Viterbi segmentation over piece log-probabilities with fused unknowns, added-token extraction with lstrip/rstrip semantics, and TemplateProcessing specials — verified token-for-token against Hugging Face tokenizers on a multilingual corpus (CJK, Cyrillic, Arabic, emoji, NFKC forms, whitespace edges). Verified token-for-token against independent python SentencePiece and BPE implementations on real llama.cpp models, and against Hugging Face's own tokenizer on HF checkpoints. A BPE vocabulary without merges is now accepted as a decode-and-specials vocabulary: tok_decode needs only the pieces and control tokens match atomically - exactly what a transcriber needs - while free-text encoding falls back to per-byte pieces (lossless, just unmerged). 0.3.1: tokenising a whole CORPUS is linear again. tok_encode's special-token split walked the text with nurl_str_get, which re-runs strlen on every call — fine for a prompt, quadratic for a training corpus: 2 MB took 98 s and a 25 MB corpus would have taken over four hours before a single training step. Hoisting the length and indexing with nurl_str_at makes the same 2 MB take 0.85 s (115x) and 8 MB take 3.3 s, with token-for-token identical output."
license = "MIT OR Apache-2.0"
