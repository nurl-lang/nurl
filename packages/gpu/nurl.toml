[package]
name = "gpu"
version = "0.11.1"
description = "GPU compute for NURL — compiled kernels are cached on disk as device-specific CUBINs (keyed by source hash AND target architecture; loading a CUBIN needs no driver JIT at all, where the previously-cached PTX was re-JIT-compiled on every process start), and gpu_best_device picks the strongest GPU on the box instead of whichever the driver enumerates first ($NURL_GPU_DEVICE overrides), so a process start costs a file read instead of an NVRTC/C++ compile: a dozen-kernel package starts ~3x faster, and NURL_GPU_CACHE=off disables it. A backend-neutral interface (Gpu / GpuKernel / GpuBuffer: open, compile, alloc, upload/download, launch, sync) with two backends: CUDA and CPU. The CUDA backend writes kernels in CUDA-C, compiles them to PTX at runtime via NVRTC, and runs them through the CUDA Driver API — bound directly from pure NURL with no runtime.c bridge. The CPU backend (v0.2.0) runs the very same CUDA-C kernels on the host: each is wrapped in a small CUDA-compatibility shim (blockIdx/threadIdx as thread-locals, __global__ etc. as no-op macros) plus a generated grid-loop, compiled by the system C++ compiler, dlopen'd, and run with OpenMP parallelising the grid across cores — so an onnx/YOLOE model runs with no GPU at all. gpu_open selects CUDA when a device is available, else falls back to CPU; NURL_GPU=cpu forces it. The neutral surface is unchanged, so callers (packages/onnx, objdet, yoloe) get CPU fallback for free. The toolchain auto-links -lcuda / -lnvrtc only when a program references those symbols; the CPU backend needs only a C++ compiler on PATH (the analogue of NVRTC). Verified: the tiny MLP and the full 267-node YOLOE-seg forward produce identical results on CPU and GPU."
license = "MIT OR Apache-2.0"

