[package]
name = "tensor"
version = "0.4.2"
description = "The reusable n-dimensional array for NURL — the shared ML layer over gpukit. It is the ndarray the rest of the ML stack builds on: onnx, grad, nn and anomaly sit on `tensor` instead of each re-welding array logic into its own runtime, and gpukit stays the marshalling floor beneath it. Row-major contiguous storage computed in f64, with an F32 dtype that keeps values on the float32 grid for interop. Ships creation (zeros/ones/full/from_data/arange), shape ops (reshape/transpose/permute), numpy-rule broadcasting elementwise (add/sub/mul/div/pow/maximum/minimum + scalar forms), unary maps (neg/abs/exp/log/sqrt/relu/sigmoid/tanh), 2-D matmul that runs on the GPU via gpukit for large f64 problems and a plain loop otherwise (identical results), axis/global reductions (sum/mean/max/min/prod with keepdim), batched N-D matmul, softmax, slicing, concat and argmax/argmin. DEVICE-RESIDENT tensors (DTensor) keep data in GPU memory and chain ops with no host roundtrips, computing true float32 on the device (numpy-float32/onnxruntime semantics) — the substrate a NN forward pass needs. M5 completes the device layer: full numpy broadcasting on the elementwise ops (a stride table, one kernel), batched matmul with numpy batch broadcast (uniform batches in one launch, general broadcast over device-pointer views), gather/scatter along an axis with validated host indices (negative wrap, rejected when out of range), and conv2d / maxpool2d (NCHW). Verified against numpy on CUDA and the CPU backend, bit-identical across the two in f64."
license = "MIT OR Apache-2.0"

[dependencies]
gpukit = { path = "../gpukit", version = "^0.5" }
