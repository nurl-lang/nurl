[package]
name = "nurl-cert"
version = "0.4.0"
description = "Memory-safety certificates for NURL programs. `nurl-cert certify prog.nu` writes a bundle whose Claims.lean proves, about the program's own term in formal/A2, that it never gets stuck and frees everything it allocates (a panic's unwinding included), with the verified checker's verdict decided by the Lean kernel, and which of its functions a run can enter (N.cap: a program with the same functions there has the same runs; what those functions reach outside the program's memory is read off their calls through the capability table stdlib/caps.tsv); for a program in its subset (numbers, raw text, Strings, Vecs of numbers and of raw strings, views, slices of Vecs of numbers, foreach over a Vec of numbers, closures over numbers and buffers of numbers, options and structs of those types, and structs with a `% Drop` of the program's own of those fields but closures, each value bound in a function's destructor frame and not handed back, assigned, returned by a call, given to a sink or inout parameter or held in another value, channels of numbers, Strings or Vecs of numbers, and spawned threads whose closures hold those by value, their results matched) certify also tries to prove that its term is the one the kernel builds from the compiler's core IR (`Cert.elab`, `C.Elab.elabIR`): a bundle with that proof no longer trusts the translator, but still trusts `nurlc --emit-core` and the core IR's conversion to words (`words.nu`), which its `translation` ledger row names; a bundle without it keeps the translator's ledger row; `nurl-cert verify` re-checks a bundle (hashes, the claims' template, the program grammar, the proofs and their axioms) without the compiler."
# `nurlc --list-sources` (the files a certificate hashes) lands after v0.94.0.
nurl-version = "0.95.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nurl-lang/nurl/tree/main/packages/nurl-cert"

[dependencies]
