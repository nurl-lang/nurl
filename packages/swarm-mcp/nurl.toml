[package]
name = "swarm-mcp"
version = "0.21.1"
description = "An MCP-controlled distributed compute engine with real GPU compute over real data. Every node runs the same command with composable role flags — --relay, --worker [--gpu], --mcp (combine freely) — and a shared --token defines and secures the cluster (token-derived relay group for isolation + HMAC-SHA256 auth on every payload and result). A language model sets a workload over MCP, served as HTTPS JSON-RPC: an expression kernel in the variable x evaluated in either i64 or f64 (the dtype field), an arbitrary NURL kernel as source or a pre-compiled wasm32-wasi module (per-element, or kind=chunk for one call per sub-range), or — the CUDA tool family — just CUDA-C device functions: compute_submit_cuda reduces f(x) over the range, compute_sample_cuda returns every f(x) as an ordered array (curves, fields; inline or to a file), and compute_histogram_cuda bins val(x) by bin(x) into K buckets in one pass; compute_upload_data uploads a dataset (flat f64 array, base64 or a host file, <= 256 MiB) that all three map over with the element value as a device-function argument — each chunk ships exactly its slice. The server generates the whole GPU kernel program (NVRTC JIT, grid-stride map, on-device reduction/atomics), compiles it to wasm, and the --gpu workers run it on their real NVIDIA GPUs via the pure-NURL wasmtime's CUDA host-import bridge. Kernels take runtime params (an array of numbers on the device as p[0..n)) that never recompile anything — coordinator and worker module caches make parameter scans interactive. GPU-capable workers advertise a capability bit in the membership gossip and GPU tasks route on a GPU-only consistent-hash ring (dist/job per-kind routing rings), so mixed CPU/GPU clusters just work; failed chunks are reported as a task error, never silently folded as zeros. The cluster shards [lo,hi) across the eligible workers, runs the kernel, and combines the partials with the reduce op (sum/product/min/max/count). Built on the swarm distributed stack (relay/transport/ring/job). Requires NURL >= v0.10.12; wasm kernels need a wasmtime on the workers (the toolchain's pure-NURL packages/wasmtime is a drop-in — and required for --gpu); --mcp auto-mints a self-signed TLS cert on first run in pure NURL (std/x509_gen — no openssl needed; or pass --tls-cert/--tls-key); compute_submit_kernel/compute_submit_cuda compile kernels LOCALLY via the wasmbuilder package (the installed toolchain's nurlc + bundled zig cc — no network needed), falling back to a NURL build API only when the local toolchain can't build wasm (default https://play.nurl-lang.org, override with $NURL_BUILD_API)."
license = "MIT OR Apache-2.0"

[dependencies]
wasmbuilder = { path = "../wasmbuilder", version = "^0.1.0" }
