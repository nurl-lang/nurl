[package]
name = "swarm-mcp"
version = "0.5.0"
description = "An MCP-controlled distributed compute engine with real GPU compute. Every node runs the same command with composable role flags — --relay, --worker [--gpu], --mcp (combine freely) — and a shared --token defines and secures the cluster (token-derived relay group for isolation + HMAC-SHA256 auth on every payload and result). A language model sets a workload over MCP, served as HTTPS JSON-RPC: an expression kernel in the variable x evaluated in either i64 or f64 (the dtype field), an arbitrary NURL kernel as source or a pre-compiled wasm32-wasi module (per-element, or kind=chunk for one call per sub-range), or — compute_submit_cuda — just a CUDA-C __device__ double f(long long x): the server generates the whole GPU kernel program around it (NVRTC JIT, grid-stride map, on-device block reduction), compiles it to wasm, and the --gpu workers run it on their real NVIDIA GPUs via the pure-NURL wasmtime's CUDA host-import bridge. GPU-capable workers advertise a capability bit in the membership gossip and GPU tasks route on a GPU-only consistent-hash ring (dist/job per-kind routing rings), so mixed CPU/GPU clusters just work; failed chunks are reported as a task error, never silently folded as zeros. The cluster shards [lo,hi) across the eligible workers, runs the kernel, and combines the partials with the reduce op (sum/product/min/max/count). Built on the swarm distributed stack (relay/transport/ring/job). Requires NURL >= v0.10.9; wasm kernels need a wasmtime on the workers (the toolchain's pure-NURL packages/wasmtime is a drop-in — and required for --gpu); --mcp needs openssl on first run for a self-signed TLS cert (or pass --tls-cert/--tls-key); compute_submit_kernel/compute_submit_cuda need curl + a reachable NURL build API (default https://play.nurl-lang.org, override with $NURL_BUILD_API)."
license = "MIT OR Apache-2.0"

