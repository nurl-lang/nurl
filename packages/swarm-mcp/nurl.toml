[package]
name = "swarm-mcp"
version = "0.4.0"
description = "An MCP-controlled distributed compute engine. Every node runs the same command with composable role flags — --relay, --worker, --mcp (combine freely) — and a shared --token defines and secures the cluster (token-derived relay group for isolation + HMAC-SHA256 auth on every payload and result). A language model sets a workload over MCP, served as HTTPS JSON-RPC: an expression kernel in the variable x evaluated in either i64 or f64 (the dtype field — same grammar, float literals and f64 arithmetic, x as the index cast to double), or an arbitrary NURL kernel either as source (the server compiles it to wasm via the NURL build API) or as a pre-compiled wasm32-wasi module — plus a range and a reduce op (sum/product/min/max/count). The cluster shards the range across every live worker, runs the kernel (the expression interpreter, or the wasm module under wasmtime — every worker runs wasm), and combines the partials; the model reads running tasks and finished results back. Built on the swarm distributed stack (relay/transport/ring/job). Requires NURL >= v0.10.4; wasm kernels need a wasmtime on the workers (the toolchain's pure-NURL packages/wasmtime is a drop-in — no external runtime required — or the Bytecode-Alliance wasmtime); --mcp needs openssl on first run for a self-signed TLS cert (or pass --tls-cert/--tls-key); compute_submit_kernel needs curl + a reachable NURL build API (default https://play.nurl-lang.org, override with $NURL_BUILD_API)."
license = "MIT OR Apache-2.0"

