[package]
name = "image"
version = "0.2.0"
description = "Pure-NURL image codecs — close the vision-stack loop with no ImageMagick/ffmpeg shell-out. Decodes and encodes without any native image library: an 8-bit, row-major Image raster (1/3/4 channels), binary PPM (P5/P6), a full PNG codec on the stdlib DEFLATE, and baseline JPEG decode. png_decode handles 8-bit non-interlaced greyscale / RGB / palette (expanded to RGB) / grey+alpha / RGBA with all five scanline filters reconstructed; png_encode writes valid lossless 8-bit PNGs (decode→encode→decode reproduces pixels exactly). jpeg_decode handles baseline sequential-DCT Huffman JPEGs — 8-bit greyscale or YCbCr, any 4:4:4/4:2:2/4:2:0/4:1:1 subsampling and restart intervals, via a full segment parser (DQT/DHT/SOF0/DRI/SOS), a separable float IDCT, box chroma upsampling and YCbCr→RGB (matches libjpeg to within IDCT/upsampling rounding). File helpers sniff the format (image_load / image_save_png / image_save_ppm). The natural front door for objdet, yoloe, chart's PNG export and photography work, which used to shell out to `convert photo.jpg photo.ppm`. Not yet: interlaced PNG, sub-8-bit depths, tRNS, and progressive/arithmetic/12-bit/CMYK JPEG — all reported as a clean None, never an out-of-bounds read."
license = "MIT OR Apache-2.0"

