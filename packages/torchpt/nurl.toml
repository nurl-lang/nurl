[package]
name = "torchpt"
version = "0.1.0"
description = "Read PyTorch .pt / .pth checkpoints in pure NURL — the format every research model still ships in — without executing them. A torch.save file is a ZIP archive holding a pickled object graph plus one raw storage per tensor, and unpickling is famously arbitrary code execution: the format's REDUCE opcode means 'call this callable'. This reader never calls anything. It interprets the pickle as DATA — GLOBAL pushes a callable's NAME, and REDUCE consults a fixed table of shapes it knows how to build (torch._utils._rebuild_tensor_v2/v3, _rebuild_parameter, OrderedDict); everything else becomes an opaque node — so a hostile checkpoint can produce a confusing tree and nothing else. Every length read from the stream is checked against the bytes that remain, memo ids and stack depths are checked before use, and the opcode loop is step-bounded, so a crafted pickle cannot spin, over-read, or allocate on a number it merely claims. mmap-backed and lazy like safetensor and gguf: only the pickle is read up front, so listing the tensors of a multi-GB checkpoint costs megabytes and tensor bytes are addressed straight out of the mapping. Tensors come out as dotted paths from the pickle root with dtype, shape, strides and a contiguity flag; every dtype widens to f32 on demand (f64/f32/f16/bf16, i64/i32/i16/i8/u8/bool), an element RANGE is exact, and non-contiguous views are reported rather than silently mis-read. Verified tensor-for-tensor against the reference `torch.load`. CLI: torchpt info/tensors/stats/head."
license = "MIT OR Apache-2.0"
