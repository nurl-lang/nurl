[package]
name = "wasmtime"
version = "0.11.0"
description = "A WebAssembly runtime written in pure NURL — load a wasm module and run it, with no external runtime. It decodes a wasm binary (all standard sections incl. the name section) and interprets the full MVP instruction set with spec-correct semantics — trapping division/truncation, NaN-correct comparisons and min/max, checked call_indirect — plus the multi-value, bulk-memory (memory.init/copy/fill, passive segments), reference-types (table.*, ref.null/func, typed select) and sign-extension proposals. Function bodies are predecoded once into register form: static stack-slot assignment, operands as absolute slot indices, operand forwarding so a local.get is a slot reference rather than a copy, a per-function constant pool so an i32.const is one too, local.set folded into the instruction that produced its value, a compare feeding a br_if rewritten in place into a branch that tests for itself, branches as direct jumps — no value-stack traffic anywhere (floats and the int/float conversions are register-form too), no runtime control stack, no LEB128 or end-scanning at execution time. Execution is two loops: the outer owns the frame stack, the inner owns one frame's records and tests a single compare per record, and dispatch is one jump table over every opcode with the work inline in the arm. Instantiation is one zero-filled allocation of the declared memory minimum plus one memcpy per data segment, so start-up does not scale with the size of the guest's heap. Execution runs on an explicit frame stack (guest recursion never grows the host stack; 1M-deep recursion verified), with optional --fuel metering and wasm backtraces on trap. It hosts real wasm32-wasi command modules: proc_exit, fd_write/read/seek/tell/pread/pwrite/sync/readdir, args_*/environ_* (--env), real clock/random, repeatable --dir preopens with path_open/create/remove/unlink/rename/filestat. The NURL compiler itself runs on it: nurlc.wasm self-compiles byte-identically to the native compiler. 33 edge-case semantics tests, every expectation produced by the reference wasmtime. No dependencies."
license = "MIT OR Apache-2.0"

