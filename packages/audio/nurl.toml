[package]
name = "audio"
version = "0.1.0"
description = "Audio for speech models, in pure NURL: read WAV, resample it honestly, and compute the log-mel spectrogram. The WAV reader treats the file as untrusted input — every chunk announces its own size and a file is free to lie, so the reader walks the chunks with a bounded cursor and a size that overruns the file, a data chunk longer than the bytes behind it, a zero sample rate or a bit depth nobody uses are all clean errors rather than allocations sized by a stranger. 8-bit unsigned, 16/24/32-bit PCM and 32/64-bit IEEE float all come back as f32 in [-1,1]. Resampling is windowed-sinc, not linear interpolation: linear is a lousy low-pass filter, so downsampling with it folds everything above the new Nyquist frequency back into the speech band — precisely where a model is listening. The mel spectrogram is whisper's, to the constant: periodic Hann (not symmetric), reflect padding so frame k is centred on sample k*hop, the SLANEY mel scale (linear below 1 kHz, log above — not HTK's), Slaney-normalised triangular filters, and whisper's own log10 floor at max-8 and (x+4)/4 scaling. Verified numerically against Hugging Face's WhisperFeatureExtractor on real audio. Built on stdlib/std/fft.nu, whose Bluestein path makes n_fft = 400 — which is not a power of two — an exact transform rather than a padded approximation. CLI: audio info/mel/resample/tone."
license = "MIT OR Apache-2.0"
