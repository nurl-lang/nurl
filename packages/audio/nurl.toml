[package]
name = "audio"
version = "0.5.0"
description = "Audio for speech models, in pure NURL: read WAV, resample it honestly, and compute the log-mel spectrogram. The WAV reader treats the file as untrusted input — every chunk announces its own size and a file is free to lie, so the reader walks the chunks with a bounded cursor and a size that overruns the file, a data chunk longer than the bytes behind it, a zero sample rate or a bit depth nobody uses are all clean errors rather than allocations sized by a stranger. 8-bit unsigned, 16/24/32-bit PCM and 32/64-bit IEEE float all come back as f32 in [-1,1]; wav_parse reads the same hostile-input treatment from bytes already in hand, because an HTTP server that just received an upload has no path to give. Resampling is windowed-sinc, not linear interpolation: linear is a lousy low-pass filter, so downsampling with it folds everything above the new Nyquist frequency back into the speech band — precisely where a model is listening. The mel spectrogram is whisper's, to the constant: periodic Hann (not symmetric), reflect padding so frame k is centred on sample k*hop, the SLANEY mel scale (linear below 1 kHz, log above — not HTK's), Slaney-normalised triangular filters, and whisper's own log10 floor at max-8 and (x+4)/4 scaling. Verified numerically against Hugging Face's WhisperFeatureExtractor on real audio. Built on stdlib/std/fft.nu, which gives 400 = 2^4*5^2 a direct mixed-radix transform (Bluestein is for lengths with a large prime factor, not for perfectly factorable ones) and folds a real signal of even length into a half-length complex transform — so the 30-second spectrogram costs 0.14 s, down from 0.52. Voice activity detection finds where the speech IS, so the silence never reaches a model: an energy detector with an ADAPTIVE noise floor (the 10th percentile of this recording's own frame energies, not a fixed dB threshold tuned on somebody else's file), hysteresis in milliseconds, and padding either side so no consonant is clipped. vad_extract_runs also hands back a condensed-to-original sample map (VadRun), because a model transcribing the condensed audio reports times in the condensed timeline - and a caller who wants to say 'this was said at 3:12 of the recording' has to walk the map back; vad_map_sample does. CLI: audio info/mel/resample/vad/tone."
license = "MIT OR Apache-2.0"
